# ═══════════════════════════════════════════════════════════════════
# .github/workflows/external-crons.yml
#
# DÓNDE VIVEN LOS CRONS SUB-DIARIOS. El plan Hobby de Vercel limitaba cada cron
# a 1×/día, así que estos NO están en vercel.json — corren desde aquí:
#
#   • screener:refresh→ GET /api/arena-screener?job=refresh  (cada 4h)
#
# RETIRADO: `pead:earnings` (goteo AlphaVantage). El backtest PEAD cerró con
# NO-GO y su ledger quedó en 99/99 — el goteo no tenía nada más que bajar. El
# gasto de AV lo corta `PEAD_HARVEST_ENABLED != 1` en Vercel; el schedule se
# quita acá porque este job trata `disabled:true` como fallo duro y, con el
# endpoint apagado, dejaba la pestaña Actions en rojo 5×/día para siempre —
# ruido que tapa un cron realmente caído. Ver docs/wheel-fase0.md §4.3.
#
# Los crons DIARIOS siguen en vercel.json (agents-run, arena decide/reconcile,
# pead hour). Ver docs/crons.md para el mapa completo.
#
# Cada job falla RUIDOSAMENTE si el endpoint devuelve error: curl --fail-with-body
# corta en HTTP >=400 (401/500), y además revisamos el cuerpo por fallos lógicos
# que el handler devuelve como HTTP 200 (`error` / `disabled`). Un cron muerto
# aquí = un run rojo en la pestaña Actions (+ el heartbeat en /api/cron-status).
#
# SETUP (una vez): en GitHub → Settings → Secrets and variables → Actions
#   • Secret  CRON_SECRET     = el mismo valor que la env var CRON_SECRET en Vercel.
#   • Variable APP_BASE_URL   = URL de producción (opcional; default abajo).
#
# NOTA: los workflows con `schedule` solo corren en la rama por defecto (main).
# Este workflow no toma efecto hasta que este cambio esté en main.
# ═══════════════════════════════════════════════════════════════════
name: external-crons

on:
  schedule:
    - cron: '0 */4 * * *'              # screener:refresh — cada 4h
  workflow_dispatch: {}                # disparo manual (para probar)

permissions:
  contents: read

jobs:
  screener-refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 */4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Arena screener refresh
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://quantdesk2.vercel.app' }}
        run: |
          # Sin `set -e`: imprime SIEMPRE status + body antes de fallar (ver job de arriba).
          set -uo pipefail
          url="$BASE_URL/api/arena-screener?job=refresh"
          echo "GET $url"
          body_file="$(mktemp)"
          http_code="$(curl -sS -o "$body_file" -w '%{http_code}' \
            --connect-timeout 30 -m 120 \
            -H "Authorization: Bearer $CRON_SECRET" "$url")"
          curl_exit=$?
          echo "── HTTP $http_code (curl exit $curl_exit) ──"
          cat "$body_file"; echo
          body="$(cat "$body_file")"
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl falló (exit $curl_exit) — red/timeout, sin respuesta HTTP completa."; exit 1
          fi
          if [ "$http_code" -ge 400 ]; then
            echo "::error::arena-screener refresh devolvió HTTP $http_code — ver body arriba."; exit 1
          fi
          if ! echo "$body" | jq -e . >/dev/null 2>&1; then
            echo "::error::Respuesta no es JSON válido (¿página de error de Vercel?)."; exit 1
          fi
          if echo "$body" | jq -e 'has("error") or (.disabled == true)' >/dev/null; then
            echo "::error::arena-screener refresh devolvió error/disabled — revisar body."; exit 1
          fi
          echo "OK — screener corrió."
