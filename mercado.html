      [ETIQUETA_PESOS, qdPctTag(mx.pct, estado.periodo, { motivo: mx.motivo })],
      ['nivel', esc((c.prefijo||'') + fmtPrice(c.precio)) + (c.moneda ? ' ' + esc(c.moneda) : '')],
      ['nivel de', esc(c.precio_fecha || '—') + (c.precio_es_de_hoy ? ' (precio de mercado)' : ' (último cierre)')],
      ['país', esc(c.pais || '—')],
      ['bolsa', esc(c.es24h ? 'cotiza 24h' : (e.nombre || c.bolsa))],
      ['estado', esc(e.etiqueta) + (e.hora_local ? ' · ' + esc(e.hora_local) + ' local' : '')],
      ['último cierre', esc(c.ultimo_cierre || '—')],
      ['fuente', esc(c.fuente)],
      ['cierres traídos', String(c.puntos || 0)]
    ];
    // Cada número en pesos dice qué FIX usó y de qué fecha (regla 3).
    if(mx.fuente) filas.push(['fuente del peso', esc(mx.fuente)]);
    if(c.moneda_discrepa){
      filas.push(['moneda', esc(c.moneda) + ' (se esperaba ' + esc(c.moneda_esperada) + ')']);
    }
    document.getElementById('hojaCuerpo').innerHTML =
      '<div class="ficha"><div class="iniciales">' + esc(String(c.symbol).replace(/[^A-Za-z0-9]/g,'').slice(0,4)) + '</div>'
      + '<div><h2>' + esc(c.nombre) + '</h2><div class="sub">' + esc(c.symbol) + '</div></div></div>'
      + '<dl>' + filas.map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('') + '</dl>'
      + (mx.motivo ? '<div class="motivo">' + esc(mx.motivo) + '</div>' : '');
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','1'); h.setAttribute('aria-hidden','false');
  }

  // Tap en un cuadro de Mundo → la hoja, igual que en el mapa.
  document.getElementById('mundo').addEventListener('click', function(ev){
    var t = ev.target.closest('.c'); if(!t) return;
    estado.symbol = t.dataset.sym; escribirUrl(true); abrirHojaMundo(cache.mundo, estado.symbol);
  });
  document.getElementById('moneda').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-mon]'); if(!b) return;
    estado.moneda = b.dataset.mon; escribirUrl(true); render();
  });

  // EL FIX DE BANXICO, PARA CUALQUIER MAPA QUE CONVIERTA A PESOS.
  //
  // Vivía dentro de la rama de Mundo, y por eso el toggle MXN no hacía nada en
  // EE.UU.: sin FIX no hay con qué convertir, así que `cambio()` devolvía el
  // número local sin más. Ahora es una función y la usan los dos mapas: UNA
  // sola fuente del peso para toda la pantalla.
  //
  // Se pide aparte de los precios porque es OTRA fuente: Yahoo da el dólar de
  // mercado (`MXN=X`, que en Mundo es el cuadro) y Banxico da el FIX, que es el
  // número oficial con el que se convierte. Mezclarlos sería pintar una
  // conversión y atribuírsela a la otra fuente.
  //
  // Nunca rechaza: sin FIX se resuelve con `motivo`, y ese motivo termina
  // impreso en el cuadro. Convertir con el dólar de mercado como sustituto
  // silencioso queda prohibido.
  function traerFix(){
    return fetch('/api/banxico?series=USDMXN&days=420')
      .then(function(r){ return r.json(); })
      .catch(function(e){ return { error: e.message }; })
      .then(function(b){
        b = b || {};
        var pts = Array.isArray(b.points) ? b.points : null;
        if(pts && pts.length >= 2){
          return {
            fecha: b.latest ? b.latest.date : pts[pts.length-1].date,
            valor: b.latest ? b.latest.value : pts[pts.length-1].value,
            // A la forma que `qdPeriodChange` entiende. Un solo calculador,
            // también para el tipo de cambio.
            serie: pts.map(function(x){ return { t: Date.parse(x.date + 'T12:00:00Z')/1000, c: x.value }; })
          };
        }
        return { motivo: 'no llegó el FIX de Banxico' + (b.error ? ' (' + b.error + ')' : '') };
      });
  }

  // ═══════════════════════════════════════════════════════════════════
  // R3 · LAS TABLAS DENSAS Y LOS PANELES DE DEBAJO DEL MAPA
  //
  // LAS TRES TABLAS NO PIDEN NADA. Salen del MISMO payload que el mapa ya
  // trajo: `cuadros` viene con la serie de cada emisora y con lo operado, así
  // que ordenar es ordenar lo que ya está en pantalla. Cero peticiones nuevas
  // (regla 7), cero segunda definición del % (regla 1: el número lo da
  // `cambio()`, el mismo que pinta el cuadro) y, de paso, la tabla y el mapa
  // nunca pueden discrepar — son la misma lista mirada de otra forma.
  //
  // Eso incluye el toggle de moneda: en EE.UU. con MXN, la tabla ordena por el
  // rendimiento EN PESOS, porque es el que el mapa está pintando.
  //
  // "Esta semana" y Arena sí vienen de fuera, y por eso van en UN batch
  // (`/api/mercado-paneles`) en vez de tres fetches del navegador.
  // ═══════════════════════════════════════════════════════════════════
  var paneles = null;          // lo que devolvió /api/mercado-paneles
  var panelesPedido = false;
  var noticias = null;         // lo que devolvió /api/noticias
  var noticiasPedido = false;

  function filasDeTablas(d){
    return (d.cuadros || []).map(function(c){
      var x = cambio(c);
      return {
        symbol: c.symbol, nombre: c.nombre || c.symbol,
        pct: x.pct, motivo: x.motivo,
        precio: c.precio,
        importe: c.importe, importe_motivo: c.importe_motivo || null,
      };
    });
  }

  function fmtImporte(v){
    if(!Number.isFinite(v)) return '—';
    // La escala larga del español: 1 billón son 10¹². `qdCap` ya la sabe y es
    // la misma que usa la hoja, así que acá no se estrena otra.
    return qdCap(v, estado.mapa === 'mx' ? 'MXN' : 'USD');
  }

  function filaHtml(f, columna){
    var der = columna === 'importe'
      ? '<span class="val">' + esc(fmtImporte(f.importe)) + '</span>'
      : '<span class="val">' + qdPctTag(f.pct, estado.periodo, { motivo: f.motivo }) + '</span>';
    return '<div class="fila" data-sym="' + esc(f.symbol) + '" role="button" tabindex="0">'
      + '<span class="tk">' + esc(f.symbol) + '</span>'
      + '<span class="nom">' + esc(f.nombre) + '</span>'
      + der + '</div>';
  }

  function bloqueTabla(titulo, filas, conteo, clave, columna){
    var falta = faltanteDeTabla(clave, conteo);
    var html = '<h2>' + esc(titulo) + '</h2>';
    // LA CAUSA VA ARRIBA DE LA TABLA, no en lugar de ella: una lista de tres
    // con "sólo 3 subieron" es honesta; una lista de tres a secas hace pensar
    // que la pantalla se rompió.
    if(falta) html += '<p class="nota">' + esc(falta) + '</p>';
    html += '<div class="tabla">';
    html += filas.length
      ? filas.map(function(f){ return filaHtml(f, columna); }).join('')
      : '<div class="vacio">' + esc(falta || 'sin datos para este bloque') + '</div>';
    return html + '</div>';
  }

  function bloqueSemana(){
    var html = '<h2>Esta semana</h2>';
    if(!paneles){ return html + '<div class="tabla"><div class="vacio">cargando…</div></div>'; }
    var s = paneles.esta_semana || {};
    var fu = s.fuentes || {};
    // CADA MITAD DICE LO SUYO. Si se funden, un Finnhub en 429 se lee igual
    // que "no hay reportes esta semana", y la semana de resultados más cargada
    // del trimestre aparece como una pantalla tranquila. Las frases las arma
    // `fraseDeFuente`, que distingue tres estados que acá se confundían en uno:
    // la fuente falló / está vacía de verdad / tiene cosas pero más adelante.
    var avisos = ['macro', 'reportes']
      .map(function(k){ return fraseDeFuente(k, fu); })
      .filter(Boolean);
    if(avisos.length) html += '<p class="nota">' + esc(avisos.join(' · ')) + '</p>';
    var ev = s.eventos || [];
    html += '<div class="tabla">';
    if(!ev.length){
      // Sin nada que pintar, la causa ES el contenido. Repetirla arriba y
      // abajo sería ruido, pero dejar el cuadro vacío sería un hueco mudo.
      html += '<div class="vacio">' + esc(avisos.length ? avisos.join(' · ')
        : 'sin eventos ni reportes en los próximos ' + ((s.ventana && s.ventana.dias) || 7) + ' días') + '</div>';
    } else {
      html += ev.slice(0, 12).map(function(e){
        var dia = nombreDeDia(e.fecha);
        return '<div class="evento ' + esc(e.tipo) + '">'
          + '<span class="dia">' + esc(dia ? dia.slice(0,3) + ' ' + e.fecha.slice(8) : e.fecha) + '</span>'
          + '<span class="que"><b>' + esc(e.titulo) + '</b>'
          + (e.detalle ? '<small>' + esc(e.detalle) + '</small>' : '') + '</span>'
          + '<span class="cuando">' + esc(e.tipo === 'reporte' ? (e.cuando || 'TBD') : (e.importancia || '')) + '</span>'
          + '</div>';
      }).join('');
    }
    return html + '</div>';
  }

  // ── R3(b): LO DE HOY ──────────────────────────────────────────────
  // Titular + hora + fuente + link. El cuerpo no se guarda ni se muestra: la
  // sección manda a la fuente, no la reemplaza.
  //
  // LAS FUENTES CAÍDAS VIAJAN CON LA LISTA. Una sección corta sin decir que
  // ocho de veintidós no contestaron se lee como "no pasó nada hoy", y hoy
  // siempre pasa algo.
  function horaDeNota(iso){
    var d = new Date(iso);
    if(!Number.isFinite(d.getTime())) return null;
    // En hora de México, como todo lo demás de esta pantalla.
    try {
      return new Intl.DateTimeFormat('es-MX', { timeZone: 'America/Mexico_City',
        hour: '2-digit', minute: '2-digit', hour12: false }).format(d);
    } catch(e){ return null; }
  }

  function bloqueHoy(){
    var html = '<h2>Lo de hoy</h2>';
    if(!noticias){ return html + '<div class="tabla"><div class="vacio">cargando…</div></div>'; }
    if(noticias.error){
      return html + '<div class="tabla"><div class="vacio">' + esc('no se pudo leer: ' + noticias.error) + '</div></div>';
    }
    var ns = noticias.noticias || [];
    var caidas = noticias.fuentes_caidas || [];
    if(caidas.length){
      html += '<p class="nota">' + esc(caidas.length + ' de ' + (noticias.fuentes_go || '?')
        + ' fuentes no contestaron en la última cosecha: ' + caidas.slice(0,3).map(function(c){ return c.fuente_id; }).join(', ')
        + (caidas.length > 3 ? '…' : '')) + '</p>';
    }
    html += '<div class="tabla">';
    if(!ns.length){
      html += '<div class="vacio">' + esc(caidas.length
        ? 'ninguna fuente dejó notas en las últimas 72 horas'
        : 'sin notas en las últimas 72 horas: corré /api/noticias?job=feeds') + '</div>';
    } else {
      html += ns.slice(0, 12).map(function(n){
        var hora = horaDeNota(n.publicado_en);
        var chips = (n.tickers || []).slice(0, 4).map(function(t){
          return '<span class="chip-tk" data-sym="' + esc(t) + '" role="button" tabindex="0">' + esc(t) + '</span>';
        }).join('');
        // `rel="noopener noreferrer"`: la nota se abre en el sitio de la fuente
        // y esa pestaña no puede tocar la nuestra.
        return '<a class="nota-fila" href="' + esc(n.url) + '" target="_blank" rel="noopener noreferrer">'
          + '<div class="tit">' + esc(n.titular) + '</div>'
          + '<div class="meta">' + (hora ? esc(hora) + ' · ' : '')
          + '<b>' + esc(n.fuente_nombre || n.fuente_id) + '</b>'
          // Un titular que armamos nosotros desde una serie oficial NO se
          // puede presentar como un comunicado: lo dice acá.
          + (n.tipo === 'oficial_derivado' ? ' · ' + esc('de la serie oficial, no un comunicado') : '')
          + '</div>'
          + (chips ? '<div class="chips">' + chips + '</div>' : '')
          + '</a>';
      }).join('');
    }
    // R3b: la página entera de noticias. "Lo de hoy" es el recorte de 12
    // titulares; la página tiene las secciones, los chips de fuente y las
    // destacadas, y lee de la MISMA tabla (una sola fuente de verdad).
    html += '</div><a class="ver-todas" href="/mercado/noticias">ver todas las noticias →</a>';
    return html;
  }

  function bloqueArena(){
    var html = '<h2>Arena</h2>';
    if(!paneles){ return html + '<div class="tabla"><div class="vacio">cargando…</div></div>'; }
    var a = paneles.arena || {};
    if(!a.agentes || !a.agentes.length){
      return html + '<div class="tabla"><div class="vacio">'
        + esc(a.motivo || 'el leaderboard no devolvió agentes') + '</div></div>';
    }
    // UNA LÍNEA, UNA VEZ, ARRIBA. Cuando los cinco fallan por lo mismo —el
    // caso real: la temporada no se ha reiniciado— la causa se decía en cada
    // fila, cinco veces, con jerga. Repetirla no informa cinco veces: tapa la
    // tarjeta. Si hay MEZCLA de causas, cada fila dice la suya, porque ahí la
    // diferencia es el dato.
    var comun = causaComunArena(a.agentes);
    if(comun) html += '<p class="nota">' + esc(comun) + '</p>';
    html += '<div class="tabla">';
    html += a.agentes.map(function(g){
      // Con número, la línea chica es el modelo. Sin número y SIN causa común,
      // es la causa: `qdPctTag` la mete en un `title` que en un teléfono no
      // existe, así que ahí no se podía leer.
      var abajo = Number.isFinite(g.pct)
        ? (g.modelo ? esc(g.modelo) : '')
        : (comun ? (g.modelo ? esc(g.modelo) : '') : esc(g.pct_motivo || 'sin causa declarada'));
      return '<div class="evento">'
        + '<span class="que"><b>' + esc(g.nombre) + '</b>'
        + (abajo ? '<small>' + abajo + '</small>' : '') + '</span>'
        + '<span class="val">'
        // `qdPctTag` exige etiqueta de periodo: la de Arena es el acumulado
        // desde su baseline, y decirlo es lo que impide leerlo como el % del
        // día. El número NO se calcula acá: lo trae el leaderboard.
        + qdPctTag(g.pct, 'acum.', { motivo: g.pct_motivo }) + '</span>'
        + '</div>';
    }).join('');
    return html + '</div>';
  }

  function pintarPaneles(d){
    var el = document.getElementById('paneles');
    // En Mundo no hay tablas de emisoras: un índice no tiene capitalización ni
    // volumen, y "más operadas" no significa nada sobre el Nikkei. El resto de
    // los paneles sí va, porque el calendario y Arena no son de un mapa.
    var html = '';
    if(estado.mapa !== 'mundo'){
      // EL ERROR DEL MAPA VIAJA A LAS TABLAS. Sin esto, un mapa que no se pudo
      // leer llega como cero filas y las tablas decían "ninguna subió en este
      // periodo": una afirmación sobre el mercado que nadie midió, y que encima
      // manda a mirar la bolsa en vez de la consulta.
      var t = tablasDeMercado(filasDeTablas(d), { error: d.error || null });
      html += bloqueTabla('Más suben', t.suben, t.conteo, 'suben', 'pct');
      html += bloqueTabla('Más bajan', t.bajan, t.conteo, 'bajan', 'pct');
      html += bloqueTabla('Más operadas', t.operadas, t.conteo, 'operadas', 'importe');
    }
    // R3(c): las tablas van a la columna izquierda y el resto a la derecha.
    // En el celular los dos contenedores se apilan en este mismo orden, así
    // que la pantalla de 390 px no cambia.
    document.getElementById('p-tablas').innerHTML = html;
    document.getElementById('p-lado').innerHTML = bloqueHoy() + bloqueSemana() + bloqueArena();
    el.hidden = false;
    if(!panelesPedido) cargarPaneles();
    if(!noticiasPedido) cargarNoticias();
    cargarTiras();
  }

  function cargarNoticias(){
    noticiasPedido = true;
    fetch('/api/noticias?limite=30')
      .then(function(r){ return r.json(); })
      .then(function(j){ noticias = j; if(cache[estado.mapa]) pintarPaneles(cache[estado.mapa]); })
      .catch(function(e){
        // Un fallo de red no deja la sección diciendo "cargando…" para siempre.
        noticias = { error: e.message };
        if(cache[estado.mapa]) pintarPaneles(cache[estado.mapa]);
      });
  }

  function cargarPaneles(){
    panelesPedido = true;
    fetch('/api/mercado-paneles')
      .then(function(r){ return r.json(); })
      .then(function(j){ paneles = j; if(cache[estado.mapa]) pintarPaneles(cache[estado.mapa]); })
      .catch(function(e){
        // Un fallo de red no deja los paneles diciendo "cargando…" para
        // siempre: se dice qué pasó.
        paneles = { esta_semana: { eventos: [], fuentes: {
          macro: { ok: false, motivo: e.message }, reportes: { ok: false, motivo: e.message } } },
          arena: { agentes: [], motivo: 'no se pudo pedir el leaderboard: ' + e.message } };
        if(cache[estado.mapa]) pintarPaneles(cache[estado.mapa]);
      });
  }

  // Tap en una fila de tabla → la misma hoja que el cuadro del mapa.
  document.getElementById('paneles').addEventListener('click', function(ev){
    // El chip de ticker va PRIMERO y corta el enlace: está dentro de un <a>
    // que lleva a la nota, y sin esto tocar el chip abriría el medio en vez de
    // la hoja de la emisora.
    var chip = ev.target.closest('.chip-tk');
    if(chip && chip.dataset.sym){
      ev.preventDefault(); ev.stopPropagation();
      estado.symbol = chip.dataset.sym; escribirUrl(true);
      abrirHoja(cache[estado.mapa], chip.dataset.sym);
      return;
    }
    var f = ev.target.closest('.fila'); if(!f || !f.dataset.sym) return;
    estado.symbol = f.dataset.sym; escribirUrl(true);
    abrirHoja(cache[estado.mapa], f.dataset.sym);
  });

  // ── Carga: UNA petición por mapa, y el toggle no vuelve a pedir ───
  var NOMBRE_MAPA = { us:'EE.UU.', mx:'México', mundo:'Mundo' };

  function cargar(mapa){
    document.getElementById('pie').textContent = 'cargando ' + (NOMBRE_MAPA[mapa]||mapa) + '…';
    // Regla 7: un endpoint batch por mapa. Mundo no estrena uno — usa el que ya
    // existe y ya está cacheado para toda la base de usuarios, que además no
    // devuelve ningún porcentaje pre-cocinado (regla 1).
    //
    // El FIX viaja en la MISMA carga, en paralelo, para los dos mapas que
    // convierten a pesos: el toggle de moneda no vuelve a pedir nada.
    var peticiones = (mapa === 'mundo')
      ? [ fetch('/api/macro-markets').then(function(r){ return r.json(); }), traerFix() ]
      : (mapa === 'us')
        ? [ fetch('/api/mercado-mapa?map=us').then(function(r){ return r.json(); }), traerFix() ]
        // México ya está en pesos: no se ofrece el toggle y no se pide el FIX.
        : [ fetch('/api/mercado-mapa?map='+encodeURIComponent(mapa)).then(function(r){ return r.json(); }) ];

    Promise.all(peticiones).then(function(rs){
      var d = rs[0] || {};
      if(rs.length > 1) d.fix = rs[1];
      cache[mapa] = d; render();
    }).catch(function(e){
      document.getElementById('pie').textContent = 'no se pudo cargar ' + (NOMBRE_MAPA[mapa]||mapa) + ': ' + e.message;
    });
  }

  // ── Eventos ───────────────────────────────────────────────────────
  document.querySelector('nav').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-mapa]'); if(!b) return;
    estado.mapa = b.dataset.mapa; estado.sector=null; estado.symbol=null;
    escribirUrl(true); render();
  });
  document.getElementById('toggle').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-per]'); if(!b) return;
    estado.periodo = b.dataset.per; escribirUrl(true); render();
  });

  // ══════════════════════════════════════════════════════════════════
  // R3(c): LAS DOS TIRAS DEL ARTBOARD 5
  //
  // Son CONTEXTO bajo el mapa, no un segundo mapa: alto fijo, una línea, cada
  // cuadrito tocable. Se piden DESPUÉS de que el mapa pintó y sólo en
  // escritorio, que es donde el artboard las pone y donde hay sitio.
  //
  // LAS DOS DICEN SU CAUSA SI NO LLEGAN (regla 2). Una tira vacía bajo el
  // mapa se lee como "el IPC no se movió", que es una afirmación sobre el
  // mercado que nadie midió.
  //
  // LOS NUEVE ÍNDICES SON LOS DE R4 —SPX, NDX, DJI, IPC, BOVESPA, KOSPI,
  // NIKKEI, DAX, HSI— y el catálogo de Mundo hoy tiene OCHO: le falta ^DJI.
  // El noveno se pinta igual, en gris y con su causa, en vez de enseñar ocho
  // y llamarlos nueve. Cuando ^DJI entre al catálogo de `/api/macro-markets`,
  // esta tira lo toma sola.
  // ══════════════════════════════════════════════════════════════════
  var NUEVE_INDICES = [
    { symbol: '^GSPC', nombre: 'S&P 500' },
    { symbol: '^NDX',  nombre: 'Nasdaq 100' },
    { symbol: '^DJI',  nombre: 'Dow Jones' },
    { symbol: '^MXX',  nombre: 'IPC' },
    { symbol: '^BVSP', nombre: 'Bovespa' },
    { symbol: '^KS11', nombre: 'KOSPI' },
    { symbol: '^N225', nombre: 'Nikkei 225' },
    { symbol: '^GDAXI', nombre: 'DAX' },
    { symbol: '^HSI',  nombre: 'Hang Seng' },
  ];
  var TOPE_TIRA_IPC = 14;        // los más grandes del IPC: una línea, no un mapa
  var tirasPedidas = false;

  function esEscritorioAncho(){
    return window.matchMedia && window.matchMedia('(min-width:1200px)').matches;
  }

  function cuadritoDeTira(sym, nombre, pct, etiqueta, motivo){
    // El MISMO color del mapa (`colorDe`) y el MISMO pintor del % que todo lo
    // demás (`qdPctTag`, regla 1): una tira con su propia escala o su propio
    // formato sería un segundo mapa que dice otra cosa.
    var gris = !Number.isFinite(pct);
    var fondo = gris ? '#1b242e' : colorDe(pct);
    return '<div class="t" style="background:' + fondo + '"'
      + ' data-sym="' + esc(sym) + '" role="button" tabindex="0"'
      + ' title="' + esc(nombre + (gris && motivo ? ' · ' + motivo : '')) + '">'
      + '<b>' + esc(nombre) + '</b>'
      + '<span>' + qdPctTag(gris ? null : pct, etiqueta, { motivo: motivo || null }) + '</span></div>';
  }

  function pintarTiraIpc(){
    var el = document.getElementById('tira-ipc');
    var d = cache.mx;
    if(!d){ el.innerHTML = '<span class="rot">IPC</span><span class="vacio">cargando…</span>'; return; }
    if(d.error){
      el.innerHTML = '<span class="rot">IPC</span><span class="vacio">'
        + esc('sin dato: ' + d.error) + '</span>';
      return;
    }
    var cs = (d.cuadros || []).slice().sort(function(a, b){ return (b.cap || 0) - (a.cap || 0); })
      .slice(0, TOPE_TIRA_IPC);
    if(!cs.length){
      el.innerHTML = '<span class="rot">IPC</span><span class="vacio">'
        + esc('el mapa de México no trajo emisoras') + '</span>';
      return;
    }
    el.innerHTML = '<span class="rot">IPC</span>' + cs.map(function(c){
      // `cambio()` usa el periodo y la moneda que estén puestos: la tira se
      // mueve con el toggle, como el mapa.
      var x = cambio(c);
      return cuadritoDeTira(c.symbol, c.symbol, x.pct, x.periodLabel || estado.periodo, x.motivo);
    }).join('');
  }

  function pintarTiraIndices(){
    var el = document.getElementById('tira-idx');
    var d = cache.mundo;
    if(!d){ el.innerHTML = '<span class="rot">Índices en pesos</span><span class="vacio">cargando…</span>'; return; }
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    var porSym = {};
    (m.regiones || []).forEach(function(r){
      (r.cuadros || []).forEach(function(c){ porSym[c.symbol] = c; });
    });
    var faltantes = (m.faltantes || []).reduce(function(acc, f){ acc[f.symbol] = f.motivo; return acc; }, {});
    el.innerHTML = '<span class="rot">9 índices en pesos</span>' + NUEVE_INDICES.map(function(ix){
      var caja = porSym[ix.symbol];
      if(!caja){
        // El cuadrito gris DICE por qué: "no está en el catálogo" y "la
        // fuente no lo trajo hoy" son cosas distintas y se arreglan distinto.
        return cuadritoDeTira(ix.symbol, ix.nombre, null, estado.periodo,
          faltantes[ix.symbol] || 'no está en el catálogo de /api/macro-markets todavía');
      }
      // EN PESOS SIEMPRE, que es lo que el rótulo de la tira promete: no
      // depende del toggle de moneda. `enPesosDe` es el MISMO convertidor que
      // usa la pestaña Mundo — una sola cuenta del peso en toda la pantalla.
      var mx = enPesosDe(caja, d);
      return cuadritoDeTira(ix.symbol, ix.nombre, mx.pct, estado.periodo, mx.motivo);
    }).join('');
  }

  function pintarTiras(){
    var cont = document.getElementById('tiras');
    if(!esEscritorioAncho()){ cont.hidden = true; return; }
    cont.hidden = false;
    pintarTiraIpc();
    pintarTiraIndices();
  }

  /** Pide lo que las tiras necesitan, UNA vez y después del mapa. */
  function cargarTiras(){
    if(tirasPedidas || !esEscritorioAncho()) return;
    tirasPedidas = true;
    pintarTiras();
    if(!cache.mx){
      fetch('/api/mercado-mapa?map=mx').then(function(r){ return r.json(); })
        .then(function(j){ cache.mx = j; pintarTiras(); })
        .catch(function(e){ cache.mx = { error: e.message, cuadros: [] }; pintarTiras(); });
    }
    if(!cache.mundo){
      Promise.all([
        fetch('/api/macro-markets').then(function(r){ return r.json(); }),
        traerFix(),
      ]).then(function(rs){ var d = rs[0] || {}; d.fix = rs[1]; cache.mundo = d; pintarTiras(); })
        .catch(function(e){ cache.mundo = { data: {}, omitidos: {}, error: e.message }; pintarTiras(); });
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // R3(c): EL BUSCADOR DE TICKER DEL ARTBOARD 5
  //
  // BUSCA EN EL MAPA QUE YA VIAJÓ. No pide nada, no llama a ninguna API y
  // por lo tanto NO PUEDE OFRECER una emisora que esta pantalla no sepa
  // dibujar — que es la falla clásica de un buscador conectado a un catálogo
  // más grande que el mapa: encuentra, el lector toca, y no pasa nada.
  //
  // Lo que no está en el mapa se DICE, con el mapa en el que sí está si lo
  // sabemos: "NVDA no está en el mapa de México · está en EE.UU." es una
  // respuesta; "sin resultados" manda a buscar a ciegas.
  // ══════════════════════════════════════════════════════════════════
  var sugActiva = -1;

  function normalizaBusqueda(t){
    return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim();
  }

  /** Las emisoras del mapa actual, como {symbol, nombre}. Mundo incluido. */
  function catalogoDelMapa(){
    var d = cache[estado.mapa];
    if(!d) return [];
    if(estado.mapa === 'mundo'){
      var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
      var out = [];
      (m.regiones || []).forEach(function(r){
        (r.cajas || []).forEach(function(c){ out.push({ symbol: c.symbol, nombre: c.nombre || c.symbol }); });
      });
      return out;
    }
    return (d.cuadros || []).map(function(c){ return { symbol: c.symbol, nombre: c.nombre || c.symbol }; });
  }

  /** ¿En qué OTRO mapa ya cargado está este símbolo? Para no decir sólo "no". */
  function enQueOtroMapa(sym){
    var nombres = { us: 'EE.UU.', mx: 'México', mundo: 'Mundo' };
    for(var k in cache){
      if(k === estado.mapa || !cache[k]) continue;
      var hay = (cache[k].cuadros || []).some(function(c){ return c.symbol === sym; });
      if(hay) return nombres[k] || k;
    }
    return null;
  }

  function buscaEnMapa(txt){
    var q = normalizaBusqueda(txt);
    if(!q) return [];
    return catalogoDelMapa().filter(function(c){
      return normalizaBusqueda(c.symbol).indexOf(q) === 0
          || normalizaBusqueda(c.nombre).indexOf(q) >= 0
          || normalizaBusqueda(c.symbol).indexOf(q) >= 0;
    }).sort(function(a, b){
      // El que EMPIEZA con lo tecleado va primero: quien escribe "AM" busca
      // AMD o AMX, no "Advanced Micro" por el medio.
      var ea = normalizaBusqueda(a.symbol).indexOf(q) === 0 ? 0 : 1;
      var eb = normalizaBusqueda(b.symbol).indexOf(q) === 0 ? 0 : 1;
      return ea - eb || a.symbol.localeCompare(b.symbol);
    }).slice(0, 8);
  }

  function pintarSugerencias(txt){
    var caja = document.getElementById('sugerencias');
    var campo = document.getElementById('qtk');
    var q = normalizaBusqueda(txt);
    if(!q){
      caja.hidden = true; caja.innerHTML = ''; sugActiva = -1;
      campo.setAttribute('aria-expanded', 'false');
      return;
    }
    var res = buscaEnMapa(txt);
    if(!res.length){
      var otro = enQueOtroMapa(q);
      caja.innerHTML = '<div class="vacio">' + esc(
        otro ? (q + ' no está en este mapa · está en ' + otro)
             : (q + ' no está en el mapa de ' + (estado.mapa === 'mx' ? 'México' : estado.mapa === 'us' ? 'EE.UU.' : 'Mundo')
                + '. Este buscador sólo ofrece lo que la pantalla sabe dibujar.')) + '</div>';
    } else {
      caja.innerHTML = res.map(function(c, i){
        return '<div class="sug" role="option" data-sym="' + esc(c.symbol) + '"'
          + ' aria-selected="' + (i === sugActiva) + '">'
          + '<span class="tk">' + esc(c.symbol) + '</span>'
          + '<span class="nom">' + esc(c.nombre) + '</span></div>';
      }).join('');
    }
    caja.hidden = false;
    campo.setAttribute('aria-expanded', 'true');
  }

  function elegirSugerencia(sym){
    var campo = document.getElementById('qtk');
    campo.value = '';
    pintarSugerencias('');
    campo.blur();
    estado.symbol = sym;
    escribirUrl(true);
    render();
  }

  (function montarBuscador(){
    var campo = document.getElementById('qtk');
    var caja = document.getElementById('sugerencias');
    campo.addEventListener('input', function(){ sugActiva = -1; pintarSugerencias(campo.value); });
    campo.addEventListener('keydown', function(ev){
      var opciones = [].slice.call(caja.querySelectorAll('.sug'));
      if(ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
        if(!opciones.length) return;
        ev.preventDefault();
        sugActiva = (sugActiva + (ev.key === 'ArrowDown' ? 1 : -1) + opciones.length) % opciones.length;
        pintarSugerencias(campo.value);
      } else if(ev.key === 'Enter'){
        if(!opciones.length) return;
        var i = sugActiva >= 0 ? sugActiva : 0;
        elegirSugerencia(opciones[i].dataset.sym);
      } else if(ev.key === 'Escape'){
        campo.value = ''; pintarSugerencias('');
      }
    });
    caja.addEventListener('click', function(ev){
      var o = ev.target.closest('.sug'); if(!o) return;
      elegirSugerencia(o.dataset.sym);
    });
    document.addEventListener('click', function(ev){
      if(!ev.target.closest('#buscador')) pintarSugerencias('');
    });
  })();

  // ── R3(c): SECTOR / SIN AGRUPAR ────────────────────────────────────
  // En Mundo no aplica: ahí los cuadros son índices de tamaño fijo por
  // región, no emisoras con capitalización, y "sin agrupar" no significaría
  // nada. El toggle se esconde en vez de quedarse sin efecto, que es lo que
  // hacía el de moneda en México antes de que lo arregláramos.
  document.getElementById('agrupar').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-agrupar]'); if(!b) return;
    estado.agrupar = b.dataset.agrupar;
    estado.sector = null;      // el nivel de sector no existe sin agrupación
    escribirUrl(true); render();
  });
  function pintarAgruparToggle(){
    var t = document.getElementById('agrupar');
    t.hidden = estado.mapa === 'mundo';
    [].forEach.call(t.querySelectorAll('button'), function(b){
      b.setAttribute('aria-pressed', String(b.dataset.agrupar === estado.agrupar));
    });
  }
  // Tocar un cuadrito de tira hace lo MISMO que tocar un cuadro del mapa: el
  // IPC abre la hoja de la emisora en el mapa de México, y un índice abre su
  // hoja en Mundo. Se cambia de mapa porque la hoja vive ahí; dejar el tap sin
  // efecto convertiría la tira en un adorno.
  document.getElementById('tiras').addEventListener('click', function(ev){
    var t = ev.target.closest('.t[data-sym]'); if(!t) return;
    var sym = t.dataset.sym;
    var destino = t.parentNode.id === 'tira-idx' ? 'mundo' : 'mx';
    estado.mapa = destino; estado.sector = null; estado.symbol = sym;
    escribirUrl(true); render();
  });
  document.getElementById('cerrar').addEventListener('click', function(){ cerrarHoja(); });
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') cerrarHoja(); });
  // ── EL MAPA SE REPINTA CUANDO SU CAJA CAMBIA, NO SÓLO CON `resize` ──
  // El treemap se dibuja con píxeles MEDIDOS, así que cualquier cosa que le
  // cambie el alto a <main> después del pintado lo deja cortado. `resize` de
  // la ventana no cubre el caso que apareció en la captura de R3(c): las
  // tiras llegan DESPUÉS (se piden tras el mapa), estrenan una fila de la
  // rejilla, <main> se encoge ~40 px y la última hilera de cuadros quedaba
  // partida por la mitad. El observador lo ve pase lo que pase.
  if(window.ResizeObserver){
    var ultimoAlto = 0, ultimoAncho = 0, ro = null;
    ro = new ResizeObserver(function(entradas){
      var r = entradas[0] && entradas[0].contentRect;
      if(!r) return;
      var h = Math.round(r.height), a = Math.round(r.width);
      // Sólo cuando cambia de verdad: el observador también dispara al
      // montarse, y repintar en bucle sería peor que el corte.
      if(h === ultimoAlto && a === ultimoAncho) return;
      ultimoAlto = h; ultimoAncho = a;
      if(cache[estado.mapa] && estado.mapa !== 'mundo') pintarMapa(cache[estado.mapa]);
    });
    ro.observe(document.querySelector('main'));
  }

  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt=setTimeout(function(){
      if(cache[estado.mapa]) pintarMapa(cache[estado.mapa]);
      // Las tiras existen sólo donde el artboard las pone: al cruzar los
      // 1200 px se encienden o se apagan, y si se encienden por primera vez
      // hay que pedirles sus datos.
      if(esEscritorioAncho()) cargarTiras(); else document.getElementById('tiras').hidden = true;
    }, 120);
  });

  montarGestos();
  escribirUrl(false);
  render();
})();
</script>
</body>
</html>
