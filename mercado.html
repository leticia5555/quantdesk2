<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/mercado — QuantDesk</title>
<meta name="description" content="Mapa de mercado de EE.UU. y México por capitalización, con el cambio del periodo que elijas.">
<!--
  ═══════════════════════════════════════════════════════════════════
  /mercado — R1: el mapa.

  TRES REGLAS QUE ESTE ARCHIVO NO PUEDE ROMPER, y dónde se ven:

  1. TODO % pasa por qdPeriodChange + qdPctTag (qd-periods.js). Acá no se
     resta ni se divide un precio en ninguna parte. qdPctTag LANZA si le
     falta la etiqueta de periodo, así que un % mudo no llega a pintarse.
  2. Dato que falta es "—" en gris CON SU CAUSA, nunca un estimado. El
     endpoint manda el motivo por cuadro y la hoja lo muestra; el color de
     "sin dato" es distinto del gris de "sin cambio" a propósito.
  3. El endpoint LEE. La página hace UNA petición por mapa y el toggle no
     vuelve a pedir nada: los cuatro periodos se calculan sobre lo que ya
     viajó.

  QUÉ SE VE AL ABRIR, Y POR QUÉ NO SON 300 CUADROS NI 11 SECTORES.
  En 390 px, 300 cuadros dan ~10 px de lado y el encargo pide tap ≥44 px:
  no caben juntas. La primera versión resolvió abriendo en los 11 sectores,
  y probada en el teléfono la conclusión fue otra: un mapa de mercado que
  abre sin una sola empresa no es un mapa de mercado.
  Ahora el primer nivel son los ~30 nombres más grandes bajo la cabecera de
  su sector, y cada sector cierra con un cuadro "+N más = X%" que lo abre
  completo. La cabecera también abre el sector. El área de cada sector es su
  capitalización TOTAL, así que el cuadro del resto ocupa exactamente el
  peso que representa. El recorte NO cambia con el dispositivo: los 300 son
  los mismos y el "+N más" global también.
  ═══════════════════════════════════════════════════════════════════
-->
<!-- ── IBM PLEX (§4 del encargo) ────────────────────────────────────────
     `display=swap` y la pila del sistema como respaldo en `--sans`/`--mono`:
     el texto se pinta de inmediato con la fuente del aparato y cambia cuando
     Plex llega. La meta de la regla 7 es /mercado interactivo en menos de
     1.5 s en 4G, y una pantalla en blanco esperando una tipografía es
     exactamente lo que eso prohíbe. Si Google Fonts no responde, la página se
     ve con la fuente del sistema y no se rompe nada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@400;600;700&display=swap">
<style>
  /* ── LA PALETA DEL §4 DEL ENCARGO ──────────────────────────────────
     Fondo #0b0f14, paneles #0e141b, bordes #161c24, IBM Plex Sans Condensed
     + IBM Plex Mono. Decisión ya tomada en el encargo; acá sólo se aplica.

     LOS COLORES DE TEXTO SON TOKENS Y NO LITERALES porque el piso de
     contraste (≥4.5, AA) se prueba contra ellos: con los grises repartidos
     por el archivo, "subir el gris del pie" era buscar y reemplazar, y lo
     que no se encontraba se quedaba abajo del piso sin que nada avisara.
     Los dos que no llegaban —#6b7785 (4.06) y #555 (2.48)— se reemplazaron
     por `--apagado`, que es el gris más tenue que SÍ pasa AA sobre el panel.

     EL MAPA ES OTRA COSA, a propósito: la escala de color de los cuadros es
     la del mockup y ahí el piso declarado es 2.5, no 4.5 (blanco sobre el
     verde claro da 2.71). Esa es tu decisión, no un efecto de esta paleta, y
     la comprobación de Chromium la mide aparte. */
  :root{
    --bg:#0b0f14; --panel:#0e141b; --linea:#161c24;
    --texto:#e6edf3; --tenue:#8b98a5; --apagado:#7d8793;
    --verde:#00c97d; --rojo:#ff5d5d;
    --sans:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --tap:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--texto);
    font-family:var(--sans);
    -webkit-text-size-adjust:100%}
  /* La página vuelve a recorrerse: debajo del mapa están las tablas de R3. El
     MAPA no se estira — eso vive en `.pantalla`, que mide una pantalla exacta. */
  body{margin:0}
  .pantalla{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--linea)}
  .marca{font-family:var(--mono);font-size:15px;letter-spacing:.5px}
  .marca b{color:#00c97d;font-weight:600}
  .chip{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tenue);
    border:1px solid var(--linea);border-radius:3px;padding:3px 7px;white-space:nowrap}
  .chip.abierto{color:#00c97d}
  nav,.toggle{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--linea)}
  /* EL `hidden` TIENE QUE GANAR. `.toggle{display:flex}` es una regla de autor
     y le gana al `[hidden]{display:none}` del navegador, así que el toggle de
     moneda se seguía viendo en México —con los botones de la pestaña anterior
     pegados, porque `pintarMonedaToggle` sale antes de rellenarlos—. La
     propiedad `.hidden` decía `true` y la pantalla decía otra cosa; por eso la
     comprobación que miraba la propiedad lo daba por bueno. */
  nav[hidden],.toggle[hidden]{display:none}
  nav button,.toggle button{flex:1;min-height:var(--tap);min-width:var(--tap);
    background:transparent;border:1px solid var(--linea);border-radius:6px;color:var(--tenue);
    font-family:var(--mono);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  nav button[aria-selected="true"],.toggle button[aria-pressed="true"]{
    background:#18212b;border-color:#2b3845;color:var(--texto)}
  main{flex:1;position:relative;margin:8px 16px;min-height:0}
  /* overflow:hidden NO es cosmético: sin él, un cuadro calculado con una
     altura vieja se dibuja encima del pie y tapa la fuente del dato. */
  #lienzo{position:absolute;inset:0;overflow:hidden}
  /* ── EL MAPA CABE EN UNA PANTALLA, Y SE AMPLÍA CON LOS DEDOS ─────────
     El mapa largo (alto = ancho × 12, con scroll) se fue el 2026-10-02:
     "lo hacemos como TradingView, no largo. Nadie estira el mapa hacia abajo;
     todos lo dejan en una pantalla y la letra aparece con el zoom" (Lety).
     El alto disponible ya lo da el `flex:1` de <main>, así que acá no hay
     ninguna cuenta de alto: lo que había (`FACTOR_ALTO_MOVIL`) se borró.
     `touch-action:none` NO es cosmético: sin él el navegador se queda el
     pellizco y el arrastre para su propio zoom de página y el mapa no ve
     nada. Va sólo en celular, que es donde hay gestos. */
  /* `pan-y` a 1× y `none` ampliado. A 1× no hay a dónde moverse dentro del
     mapa, así que arrastrar hacia abajo tiene que recorrer la PÁGINA y llegar a
     las tablas; con `touch-action:none` el mapa se comía ese gesto y las tablas
     quedaban inalcanzables desde el mapa. Ampliado es al revés: el arrastre es
     del mapa y la página no se puede mover bajo el dedo.
     El pellizco sigue siendo nuestro en los dos casos: `pan-y` permite recorrer
     en vertical pero NO el zoom de página, así que los dos dedos llegan acá. */
  @media (max-width:599px){
    #lienzo{touch-action:pan-y}
    main[data-zoom="1"] #lienzo{touch-action:none}
  }

  /* ── R3: LAS TABLAS DENSAS ──────────────────────────────────────────
     Una línea por fila, como pide el encargo: ticker, nombre, número. El
     nombre se recorta con elipsis y el número nunca, porque el número es el
     dato y el nombre es el adorno. */
  #paneles{padding:0 16px 24px;max-width:900px}
  #paneles h2{margin:18px 0 6px;font:600 13px var(--mono);letter-spacing:.04em;
    color:#9aa5b1;text-transform:uppercase}
  #paneles .nota{margin:0 0 6px;font-size:11px;color:var(--tenue);line-height:1.4}
  .tabla{border:1px solid var(--linea);border-radius:8px;overflow:hidden;background:var(--panel)}
  .tabla .fila{display:flex;align-items:center;gap:8px;min-height:var(--tap);
    padding:0 10px;border-top:1px solid var(--linea);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .tabla .fila:first-child{border-top:0}
  .tabla .tk{flex:0 0 auto;font:600 12px var(--mono);color:var(--texto);min-width:52px}
  .tabla .nom{flex:1 1 auto;font-size:12px;color:var(--tenue);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabla .val{flex:0 0 auto;font:600 12px var(--mono);text-align:right;white-space:nowrap}
  @media (pointer:fine){ .tabla .fila:hover{background:#141c25} }
  .vacio{padding:12px 10px;font-size:12px;color:var(--tenue);line-height:1.5}
  /* ── R3(b): "lo de hoy" ─────────────────────────────────────────────
     Titular + hora + fuente + link, y nada más. El cuerpo de la nota no se
     guarda ni se muestra: esto manda a la fuente, no la reemplaza. */
  .ver-todas{display:flex;align-items:center;justify-content:center;min-height:var(--tap);
    margin-top:8px;border:1px solid var(--linea);border-radius:8px;color:var(--tenue);
    font-family:var(--mono);font-size:12px;text-decoration:none}
  .nota-fila{display:block;padding:9px 10px;border-top:1px solid var(--linea);
    color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .nota-fila:first-child{border-top:0}
  .nota-fila .tit{font-size:13px;line-height:1.35}
  .nota-fila .meta{margin-top:3px;font-family:var(--mono);font-size:10px;color:var(--tenue)}
  .nota-fila .meta b{color:#9aa5b1;font-weight:600}
  /* El chip de ticker es TOCABLE y abre la misma hoja que el cuadro, así que
     mide como todo lo que se toca aunque el texto sea corto. */
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .chip-tk{display:inline-flex;align-items:center;min-height:28px;padding:0 8px;
    border:1px solid var(--linea);border-radius:999px;background:#121a22;
    font-family:var(--mono);font-size:10px;color:var(--texto);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  @media (pointer:fine){ .nota-fila:hover{background:#141c25} .chip-tk:hover{border-color:#2b3845} }
  /* "Esta semana" y Arena: listas de dos líneas, no tablas de números. */
  .evento{display:flex;gap:10px;align-items:baseline;min-height:36px;
    padding:7px 10px;border-top:1px solid var(--linea)}
  .evento:first-child{border-top:0}
  .evento .dia{flex:0 0 58px;font:600 11px var(--mono);color:var(--tenue)}
  .evento .que{flex:1 1 auto;font-size:12px;line-height:1.35}
  .evento .que b{font-weight:600}
  .evento .que small{display:block;color:var(--tenue);font-size:11px}
  .evento .cuando{flex:0 0 auto;font:11px var(--mono);color:var(--tenue)}
  .evento.reporte .dia{color:var(--apagado)}
  /* Volver a 1×. Flota sobre el mapa porque pertenece al mapa, y mide 44px
     como todo lo que se toca (regla 8). Sólo aparece cuando hay a qué
     volver: un botón que no hace nada es ruido. */
  #reset{position:absolute;right:8px;bottom:8px;z-index:5;display:none;
    min-width:var(--tap);min-height:var(--tap);background:rgba(20,20,20,.88);
    border:1px solid #2b3845;border-radius:8px;color:var(--texto);
    font-size:18px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
  main[data-zoom="1"] #reset{display:block}
  /* ── MUNDO: REJILLA, NO TREEMAP (artboard 4) ─────────────────────────
     Encargo §3/R2: "un cuadro por índice, TAMAÑO FIJO (los índices no tienen
     cap; no fingir)". El tamaño fijo es la regla 2 aplicada al tamaño: en el
     mapa de acciones el área ES un dato y un cuadro grande afirma algo; un
     índice no tiene con qué dimensionarse, así que todos miden igual y lo
     único que el cuadro afirma es su color.
     Las medidas son las del mockup: 3 columnas, 78px de alto, 2px de gap. */
  #mundo{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
  #mundo .tira{display:flex;gap:14px;align-items:center;height:30px;padding:0 2px;
    border-bottom:1px solid var(--linea);overflow-x:auto;white-space:nowrap;
    font-family:var(--mono);font-size:11px;scrollbar-width:none}
  #mundo .tira::-webkit-scrollbar{display:none}
  #mundo .tira b{color:var(--tenue);font-weight:500}
  #mundo .titular{padding:10px 2px 6px}
  #mundo .titular h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  #mundo .titular .sub{margin-top:2px;font-size:11px;color:var(--tenue)}
  #mundo .reg{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:12px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:#9aa5b1;font-weight:600}
  #mundo .reg span{font-size:10px;letter-spacing:.04em;text-transform:none;
    color:var(--apagado);font-weight:400;text-align:right}
  #mundo .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
  .c{box-sizing:border-box;height:78px;display:flex;flex-direction:column;
    justify-content:space-between;padding:8px 10px;color:#fff;border:1px solid #0b0f14;
    position:relative;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .c .n{font-size:12px;font-weight:600;line-height:1.1}
  .c .r{font-size:10px;opacity:.85}
  .c .v{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1}
  /* EL % EN BLANCO SOBRE UN CUADRO DE COLOR.
     `qdPctTag` pinta el número de verde o rojo con un `style` en línea — que
     es lo correcto sobre fondo oscuro, como en la tira de arriba— pero acá el
     FONDO ya es verde o rojo, así que el número quedaba del mismo color que su
     cuadro y no se leía: el CAC 40, el Nasdaq, el IPC y el DAX en MXN salían en
     blanco… de invisible. El signo ya lo dice el fondo; el texto sólo tiene que
     ser legible, como en el mapa de EE.UU.
     El `!important` es contra un `style` en línea, que es la única manera de
     ganarle sin tocar el calculador compartido que usa toda la app. */
  .c .v .qd-pct, .c .v .qd-pct-per, .c .v .qd-pct *{color:#fff !important}
  .c .v .qd-pct{text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .c .l{font-family:var(--mono);font-size:10px;opacity:.85}
  .c.punteado{border-style:dashed;border-color:#3a4652}
  @media (pointer:fine){ .c:hover{outline:1px solid rgba(255,255,255,.55);outline-offset:-1px} }
  #mundo .nota{padding:2px 0 4px;font-size:10px;color:#f59e0b}
  .cuadro{position:absolute;overflow:hidden;border:1px solid #0b0f14;border-radius:2px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;padding:2px}
  .cuadro .sym{font-family:var(--mono);font-weight:600;line-height:1.05;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .cuadro .val{font-family:var(--mono);line-height:1.05;color:rgba(255,255,255,.92)}
  /* La "ficha" de la hoja: iniciales en mono en vez de logo. Ver abrirHoja. */
  .ficha{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .iniciales{flex:0 0 auto;width:44px;height:44px;border-radius:6px;background:#1b242e;border:1px solid #333;
    display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:#ddd;letter-spacing:.02em}
  .ficha h2{margin:0}
  /* Aviso de sistema: ámbar, porque no es un error rojo ni un dato gris. */
  #aviso{display:none;margin:6px 10px 0;padding:8px 10px;border-radius:6px;
    background:#241f00;border:1px solid #5a4a00;color:#e8d48a;font:12px var(--mono);line-height:1.5}
  .cuadro.punteado{border:1px dashed #555}
  /* La cabecera de sector del artboard 1: 14 px, tocable, y abre el sector. */
  .cabecera{position:absolute;display:flex;align-items:center;padding:0 6px;
    background:#10171f;border:1px solid #0b0f14;color:#cfcfcf;
    font-family:var(--mono);font-size:11px;letter-spacing:.3px;
    cursor:pointer;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  /* La ruta vive en su propia franja. Flotando sobre el lienzo tapaba el
     cuadro de arriba a la izquierda, que además es el más grande del sector. */
  #ruta{display:none;padding:0 16px 8px}
  #ruta[data-visible="1"]{display:block}
  .volver{min-height:var(--tap);padding:0 14px;background:#111820;
    border:1px solid var(--linea);border-radius:6px;
    color:var(--texto);font-family:var(--mono);font-size:13px;cursor:pointer}
  #mas{padding:0 16px 6px;font-family:var(--mono);font-size:11px;color:var(--tenue)}
  footer{padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);
    font-family:var(--mono);font-size:10px;color:var(--tenue);line-height:1.5}
  .qd-pct{font-family:var(--mono);font-weight:600;white-space:nowrap}
  .qd-pct-per{margin-left:3px;font-size:.78em;font-weight:400;color:var(--tenue);vertical-align:.08em}
  /* La hoja. En móvil sube desde abajo; en escritorio es un panel lateral. */
  .hoja{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);
    border-top:1px solid var(--linea);border-radius:14px 14px 0 0;padding:14px 16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .18s ease-out;max-height:70vh;overflow:auto}
  .hoja[data-abierta="1"]{transform:translateY(0)}
  .hoja h2{margin:0 0 2px;font-family:var(--mono);font-size:18px}
  .hoja .sub{color:var(--tenue);font-size:12px;margin-bottom:10px}
  .hoja dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
  .hoja dt{color:var(--tenue);font-family:var(--mono);font-size:11px}
  .hoja dd{margin:0;font-family:var(--mono)}
  .hoja .motivo{margin-top:10px;padding:8px 10px;border-left:2px solid #555;background:#121a22;
    color:#ccc;font-size:12px;line-height:1.45}
  .cerrar{position:absolute;right:10px;top:10px;min-height:var(--tap);min-width:var(--tap);
    background:transparent;border:0;color:var(--tenue);font-size:22px;cursor:pointer}
  #tip{position:fixed;z-index:20;display:none;pointer-events:none;background:#121a22;
    border:1px solid var(--linea);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:11px}
  /* Hover SÓLO donde hay puntero fino. En táctil, :hover se queda pegado. */
  @media (pointer:fine){ .cuadro:hover{outline:1px solid rgba(255,255,255,.55);outline-offset:-1px} }
  /* ── R3(c): LAS PIEZAS NUEVAS SON DE ESCRITORIO ────────────────────
     El encargo las lista bajo la línea de escritorio del artboard 5:
     "Desktop 1440×1000 sin scroll: 3 columnas … Header con buscador de
     ticker, tabs Cripto/ETFs (vacíos con 'pronto') y toggle Sector / Sin
     agrupar". En el celular salen por default y la captura a 390 px enseñó
     por qué importa: las dos pestañas nuevas y el tercer toggle le quitaban
     ~100 px al mapa, y el mapa en una pantalla es la decisión del 2026-10-02.

     Así que debajo de 1200 px no se pintan. No es que "no quepan": es que
     ahí no van. La pantalla del teléfono queda exactamente como estaba. */
  #buscador,.ir-noticias,#tab-cripto,#tab-etfs,#agrupar{display:none}
  @media (min-width:1200px){
    #buscador{display:block}
    .ir-noticias{display:inline-block}
    #tab-cripto,#tab-etfs{display:block}
    #agrupar{display:flex}
    #agrupar[hidden]{display:none}
  }

  /* ── R3(c): LAS PIEZAS NUEVAS DEL ARTBOARD 5 ──────────────────────── */
  #buscador{position:relative;margin-left:auto}
  #qtk{background:#0b1118;border:1px solid var(--linea);border-radius:6px;color:var(--texto);
    font-family:var(--mono);font-size:13px;padding:0 10px;min-height:36px;width:150px}
  #qtk::placeholder{color:var(--apagado)}
  #sugerencias{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:230px;
    max-height:280px;overflow-y:auto;background:var(--panel);border:1px solid var(--linea);
    border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  #sugerencias[hidden]{display:none}
  #sugerencias .sug{display:flex;align-items:center;gap:8px;min-height:var(--tap);
    padding:0 10px;border-top:1px solid var(--linea);cursor:pointer}
  #sugerencias .sug:first-child{border-top:0}
  #sugerencias .sug[aria-selected="true"]{background:#141c25}
  #sugerencias .sug .tk{font:600 12px var(--mono);min-width:56px}
  #sugerencias .sug .nom{font-size:12px;color:var(--tenue);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #sugerencias .vacio{padding:10px;font:11px var(--mono);color:var(--tenue);line-height:1.5}
  .ir-noticias{font-family:var(--mono);font-size:11px;color:var(--tenue);text-decoration:none;
    border:1px solid var(--linea);border-radius:6px;padding:7px 9px;white-space:nowrap}

  /* LAS TIRAS. Alto fijo y chico: son contexto bajo el mapa, no un segundo
     mapa. Cada cuadrito es tocable igual que uno del mapa. */
  #tiras{padding:0 16px}
  #tiras[hidden]{display:none}
  .tira{display:flex;gap:2px;align-items:stretch;overflow-x:auto;scrollbar-width:none;
    margin-top:6px}
  .tira::-webkit-scrollbar{display:none}
  .tira .rot{flex:0 0 auto;align-self:center;font:600 9px var(--mono);color:var(--tenue);
    letter-spacing:.06em;text-transform:uppercase;padding-right:6px;white-space:nowrap}
  .tira .t{flex:0 0 auto;min-width:54px;height:34px;border-radius:3px;padding:3px 5px;
    display:flex;flex-direction:column;justify-content:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .tira .t b{font:600 10px var(--mono);color:#fff;line-height:1.1}
  .tira .t span{font:10px var(--mono);color:#fff;opacity:.92;line-height:1.1}
  .tira .vacio{font:10px var(--mono);color:var(--tenue);line-height:1.5;padding:4px 0}

  @media (min-width:900px){
    header,nav,.toggle,#mas,footer{padding-left:24px;padding-right:24px}
    nav,.toggle{justify-content:flex-start}
    nav button,.toggle button{flex:0 0 auto;padding:0 18px}
    main{margin:10px 24px}
    .hoja{left:auto;right:0;top:0;bottom:0;width:380px;border-radius:0;border-left:1px solid var(--linea);
      border-top:0;max-height:none;transform:translateX(102%)}
    .hoja[data-abierta="1"]{transform:translateX(0)}
  }

  /* ── R3(c): ESCRITORIO 1440×1000 SIN SCROLL, TRES COLUMNAS ──────────
     El artboard 5 manda 292 / 748 / 336. La del medio va en `minmax(0,1fr)`
     y no en 748 px fijos: a 1440 da 748 con los paddings, y en una pantalla
     más ancha el mapa crece en vez de dejar una franja muerta. Las laterales
     sí son fijas, porque son listas de una línea.

     `display:contents` en `.pantalla` y en `#paneles` es lo que hace que sus
     hijos sean celdas de ESTA rejilla sin duplicar el HTML: la misma página
     se apila en el celular y se reparte en escritorio.

     SIN SCROLL DE PÁGINA (regla 8): el alto es `100dvh` y lo que sobra se lo
     queda la fila del medio; cada columna lateral se recorre por dentro. No
     hay ninguna resta de píxeles adivinada — la cuenta la hace la rejilla. */
  @media (min-width:1200px){
    /* SEIS FILAS, y las tiras tienen la suya. La primera versión las puso en
       la MISMA celda que el mapa con `align-self:end`, y en la captura se
       veían encima de los cuadros de abajo: tapaban dos filas del mapa. Una
       tira bajo el mapa tiene que estar bajo el mapa. */
    body{height:100dvh;overflow:hidden;display:grid;
      grid-template-columns:292px minmax(0,1fr) 336px;
      grid-template-rows:auto auto auto minmax(0,1fr) auto auto auto;
      column-gap:14px;padding:0 20px;align-content:stretch}
    .pantalla{display:contents}
    #paneles{display:contents}
    header{grid-column:1/-1;grid-row:1;padding-left:0;padding-right:0}
    nav{grid-column:1/-1;grid-row:2;border-bottom:0;padding:8px 0 0}
    #toggle,#moneda,#agrupar{grid-row:3;border-bottom:0;padding:8px 0}
    #toggle{grid-column:1}
    #moneda{grid-column:2;justify-content:center}
    #agrupar{grid-column:3;justify-content:flex-end}
    #moneda[hidden],#agrupar[hidden]{display:none}
    #ruta{grid-column:2;grid-row:4;align-self:start;z-index:2}
    main{grid-column:2;grid-row:4;margin:0;align-self:stretch;min-height:0;margin-top:26px}
    /* El "+N más" y las tiras van BAJO el mapa, cada uno en su fila. Las dos
       columnas laterales se estiran hasta abajo para acompañarlas. */
    #mas{grid-column:2;grid-row:5;padding:4px 0 0}
    #tiras{grid-column:2;grid-row:6;padding:0 0 6px}
    #p-tablas{grid-column:1;grid-row:4/7;overflow-y:auto;min-height:0;padding-bottom:8px}
    #p-lado{grid-column:3;grid-row:4/7;overflow-y:auto;min-height:0;padding-bottom:8px}
    #aviso{grid-column:1/-1;grid-row:7}
    footer{grid-column:1/-1;grid-row:7;padding:8px 0 10px;align-self:end}
    #paneles{padding:0;max-width:none}
    #paneles h2{margin:0 0 5px;font-size:11px}
    #p-tablas h2:not(:first-child),#p-lado h2:not(:first-child){margin-top:12px}
    .tabla .fila{min-height:30px;font-size:12px}
    .nota-fila{padding:6px 9px}
    .ver-todas{min-height:32px}
  }

  /* Entre 900 y 1199 px la pantalla no da para tres columnas de verdad: se
     queda con el mapa a lo ancho y los paneles abajo, en dos columnas. No se
     fuerza el artboard en una pantalla donde no cabe. */
  @media (min-width:900px) and (max-width:1199px){
    #paneles{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;
      max-width:none;padding:0 24px 24px}
  }
</style>
</head>
<body>
<!-- LA PRIMERA PANTALLA. Envuelve el mapa y su cromo para que <main> siga
     midiendo "lo que queda de la pantalla" ahora que la página vuelve a
     recorrerse: sin esto, el `flex:1` repartiría el alto entre el mapa y las
     tablas y el mapa dejaría de caber en una pantalla, que es la decisión del
     2026-10-02. -->
<div class="pantalla">
<header>
  <div class="marca">/<b>mercado</b></div>
  <div class="chip" id="chip">—</div>
  <!-- R3(c): el buscador del artboard 5. Busca en el mapa QUE YA VIAJÓ: no
       pide nada, no llama a ninguna API y por lo tanto no puede ofrecer una
       emisora que la pantalla no sepa dibujar. -->
  <div id="buscador">
    <input id="qtk" type="search" inputmode="search" autocomplete="off" spellcheck="false"
           placeholder="buscar ticker" aria-label="Buscar un ticker en este mapa"
           aria-expanded="false" aria-controls="sugerencias" role="combobox">
    <div id="sugerencias" role="listbox" hidden></div>
  </div>
  <a class="ir-noticias" href="/mercado/noticias">noticias →</a>
</header>

<nav role="tablist" aria-label="Mercado">
  <button role="tab" id="tab-us" data-mapa="us" aria-selected="true">EE.UU.</button>
  <button role="tab" id="tab-mx" data-mapa="mx" aria-selected="false">México</button>
  <button role="tab" id="tab-mundo" data-mapa="mundo" aria-selected="false">Mundo</button>
  <!-- CRIPTO Y ETFs: en la cabecera del artboard y SIN datos. Deshabilitadas
       con "pronto", no vacías con una promesa: una pestaña que se puede tocar
       y no lleva a nada se lee como una pantalla rota. -->
  <button role="tab" id="tab-cripto" disabled aria-selected="false"
          title="pronto: todavía no hay un mapa de cripto con capitalización verificada">Cripto · pronto</button>
  <button role="tab" id="tab-etfs" disabled aria-selected="false"
          title="pronto: todavía no hay un universo de ETFs declarado">ETFs · pronto</button>
</nav>

<div class="toggle" id="toggle" role="group" aria-label="Periodo"></div>
<div class="toggle" id="moneda" role="group" aria-label="Moneda" hidden></div>
<!-- R3(c): Sector / Sin agrupar. Cambia CÓMO se reparte el área, no qué
     entra: las mismas emisoras, los mismos tamaños, sin las cabeceras. -->
<div class="toggle" id="agrupar" role="group" aria-label="Agrupación">
  <button type="button" data-agrupar="sector" aria-pressed="true">Sector</button>
  <button type="button" data-agrupar="plano" aria-pressed="false">Sin agrupar</button>
</div>

<div id="ruta"></div>
<main><div id="lienzo"></div><div id="mundo" hidden></div><button type="button" id="reset" aria-label="Volver al mapa completo">⤢</button></main>
<!-- R3(c): las dos tiras del artboard 5, bajo el mapa. Se piden DESPUÉS de
     que el mapa pintó y cada una dice su causa si no llega: son contexto, y
     una tira que falla no puede dejar la pantalla sin mapa. -->
<div id="tiras" hidden>
  <div class="tira" id="tira-ipc"></div>
  <div class="tira" id="tira-idx"></div>
</div>
<div id="aviso"></div>
<div id="mas"></div>
<footer id="pie">cargando…</footer>
</div><!-- /.pantalla -->

<!-- R3: lo que va DEBAJO del mapa. Fuera de `.pantalla` a propósito: el mapa
     sigue ocupando una pantalla exacta y esto aparece al recorrer.

     R3(c): PARTIDO EN DOS a propósito. En el celular los dos bloques se
     apilan y se ven exactamente como antes —`#p-tablas` primero, `#p-lado`
     después—; en escritorio el artboard 5 los manda a las columnas 1 y 3, con
     el mapa en medio. Partirlo acá y no con CSS de reordenamiento es lo que
     permite que cada columna se recorra por su cuenta sin mover a la otra. -->
<section id="paneles" hidden>
  <div id="p-tablas"></div>
  <div id="p-lado"></div>
</section>

<aside class="hoja" id="hoja" aria-hidden="true">
  <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  <div id="hojaCuerpo"></div>
</aside>
<div id="tip"></div>

<script src="/qd-periods.js"></script>
<script src="/qd-treemap.js"></script>
<script src="/qd-mercados.js"></script>
<script src="/qd-pesos.js"></script>
<script src="/qd-mundo.js"></script>
<script src="/qd-tablas.js"></script>
<script>
(function(){
  'use strict';

  var SECTORES = {
    XLK:'Tecnología', XLF:'Finanzas', XLV:'Salud', XLY:'Consumo discrecional',
    XLP:'Consumo básico', XLE:'Energía', XLI:'Industriales', XLB:'Materiales',
    XLU:'Servicios públicos', XLRE:'Inmobiliario', XLC:'Comunicaciones'
  };
  var PERIODOS = ['1D','1S','1M','YTD'];
  var cache = {};           // mapa → payload
  var estado = leerUrl();

  // ── URL = ESTADO ──────────────────────────────────────────────────
  // Compartir la vista tiene que compartir LO QUE SE ESTÁ VIENDO. Y el botón
  // atrás del teléfono tiene que salir del sector, no de la página.
  function leerUrl(){
    var p = new URLSearchParams(location.search);
    var pm = p.get('mapa');
    var mapa = (pm==='mx' || pm==='mundo') ? pm : 'us';
    var per  = PERIODOS.indexOf(p.get('periodo'))>=0 ? p.get('periodo') : '1D';
    return { mapa:mapa, periodo:per, sector:p.get('sector')||null, symbol:p.get('symbol')||null,
             // R3(c): la agrupación también es estado. Un mapa sin agrupar
             // pegado en WhatsApp tiene que abrir sin agrupar.
             agrupar: p.get('agrupar')==='plano' ? 'plano' : 'sector',
             // Regla 9: `&moneda=usd|mxn`. En la URL se llama "usd" porque así
             // lo fijó el encargo; el botón dice "Local", porque un índice en
             // yenes no está en dólares — lo que el botón promete es "en su
             // moneda", y el otro es "en pesos".
             moneda: p.get('moneda')==='mxn' ? 'mxn' : 'usd' };
  }
  function escribirUrl(push){
    var p = new URLSearchParams();
    p.set('mapa', estado.mapa); p.set('periodo', estado.periodo);
    if(estado.mapa==='mundo') p.set('moneda', estado.moneda);
    if(estado.sector) p.set('sector', estado.sector);
    if(estado.symbol) p.set('symbol', estado.symbol);
    if(estado.agrupar==='plano') p.set('agrupar', 'plano');
    var url = location.pathname + '?' + p.toString();
    if(push) history.pushState(estado, '', url); else history.replaceState(estado, '', url);
  }
  window.addEventListener('popstate', function(){ estado = leerUrl(); render(); });

  // ── El % de un cuadro. ÚNICA vía: qdPeriodChange. ────────────────
  // YTD se arma con [ancla, último] porque el ancla es una FECHA y viaja
  // como punto; los demás periodos usan la ventana de cierres recientes.
  function cambioLocalDeCuadro(c){
    if(estado.periodo==='YTD'){
      if(!c.ytd || !c.serie || !c.serie.length)
        return { pct:null, periodLabel:'YTD', motivo: c.ytd_motivo || 'no hay serie para este instrumento' };
      return qdPeriodChange([c.ytd, c.serie[c.serie.length-1]], 'YTD');
    }
    var r = qdPeriodChange(c.serie||[], estado.periodo);
    if(r.pct==null && !r.motivo) r.motivo = 'la serie no alcanza para este periodo';
    return r;
  }

  // EL TOGGLE MXN TAMBIÉN EN EL MAPA DE EE.UU.
  //
  // No hacía nada: NVDA decía +1.7% en Local y +1.7% en MXN. Una acción de
  // Nueva York cotiza en dólares, así que para un mexicano su rendimiento es lo
  // que subió la acción MÁS lo que subió el dólar contra su peso — y eso se
  // multiplica, no se suma. La cuenta es la MISMA de Mundo (`qd-pesos.js`) con
  // el MISMO FIX de Banxico: una sola calculadora y una sola fuente del peso.
  //
  // El color sale de este número, no del local: si el cuadro se pinta por el %
  // en dólares mientras el número dice pesos, el color miente.
  //
  // En México no se ofrece: esas acciones ya están en pesos.
  function cambio(c){
    var local = cambioLocalDeCuadro(c);
    if(estado.mapa !== 'us' || estado.moneda !== 'mxn') return local;
    var mx = enPesos({
      pctLocal: local.pct,
      // El mapa de EE.UU. es todo en dólares; el veredicto de la cap ya
      // descarta lo que no lo sea.
      moneda: 'USD',
      usdMxnPct: pctDelFix(dActual),
      fix: dActual && dActual.fix ? { serie:'SF43718', fecha:dActual.fix.fecha, valor:dActual.fix.valor } : null,
    });
    return {
      pct: mx.pct, periodLabel: estado.periodo,
      motivo: mx.motivo || local.motivo || null,
      local_pct: local.pct, local_motivo: local.motivo || null,
      fuente_peso: mx.fuente || null,
    };
  }

  // La capitalización la formatea `qdCap` (qd-periods.js), en español y con la
  // moneda al lado. Acá había un `fmtCap` que decía "5.51 B" para 5.51
  // billones: "B" se lee como billion —mil millones— y eran mil veces más.
  // Y "790.8 mm" era una abreviatura que no existe fuera de esta pantalla.


  // ── Render ────────────────────────────────────────────────────────
  // El payload que se está pintando. `cambio()` lo necesita para el FIX y ya
  // lee `estado.periodo` del mismo ámbito, así que es el mismo patrón.
  var dActual = null;

  function render(){
    ['us','mx','mundo'].forEach(function(k){
      document.getElementById('tab-'+k).setAttribute('aria-selected', estado.mapa===k);
    });
    pintarToggle();
    pintarMonedaToggle();
    pintarAgruparToggle();
    var d = cache[estado.mapa];
    if(!d){ cargar(estado.mapa); return; }
    dActual = d;
    // Mundo es una rejilla, no un treemap: los índices no tienen con qué
    // dimensionarse. Se reparte acá arriba para no meterle un `if` al
    // repartidor del mapa, que ya tiene bastante.
    document.getElementById('lienzo').hidden = (estado.mapa==='mundo');
    document.getElementById('mundo').hidden = (estado.mapa!=='mundo');
    if(estado.mapa==='mundo'){
      // El botón de volver a 1× es del mapa, no de Mundo.
      document.querySelector('main').setAttribute('data-zoom','0');
      pintarChipMundo(d);
      pintarAviso({});
      pintarPieMundo(d);
      document.getElementById('ruta').innerHTML = '';
      document.getElementById('mas').innerHTML = '';
      pintarMundo(d);
      pintarPaneles(d);
      if(estado.symbol) abrirHojaMundo(d, estado.symbol); else cerrarHoja(true);
      return;
    }
    pintarChip(d);
    // El "+N más" y el pie se pintan ANTES del mapa: los dos cambian de alto
    // al llenarse, y el treemap se dibuja con píxeles medidos. Al revés, el
    // mapa se calculaba contra una altura que después se encogía y los
    // cuadros de abajo terminaban encima del pie.
    pintarAviso(d);
    pintarPie(d);
    pintarRuta();
    pintarMapa(d);
    pintarPaneles(d);
    if(estado.symbol) abrirHoja(d, estado.symbol); else cerrarHoja(true);
  }

  function pintarToggle(){
    var t = document.getElementById('toggle');
    t.innerHTML = PERIODOS.map(function(p){
      return '<button type="button" data-per="'+p+'" aria-pressed="'+(p===estado.periodo)+'">'+p+'</button>';
    }).join('');
  }

  // Los nombres de los días los da `qd-mercados.js` (`nombreDeDia`): había una
  // lista acá y otra allá, y dos listas de días es cómo terminan diciendo
  // cosas distintas de la misma fecha.

  // EL CHIP LO MANDA EL DATO, NO EL CALENDARIO.
  // Decía "cierre del lunes" porque el lunes ya había cerrado, mientras la
  // tabla terminaba el viernes: rotulaba lo que DEBERÍA haber en vez de lo
  // que hay. Ahora, si el mercado está cerrado, el texto sale de la fecha
  // del último cierre que viajó.
  //
  // Y SI NO VIAJÓ NINGUNA, EL CHIP NO NOMBRA UN DÍA. Caer al texto del
  // calendario era el mismo pecado por la puerta de atrás: con el mapa roto
  // por un error de lectura, el chip seguía afirmando "cierre del lunes" —
  // un día que nada respaldaba. Sin dato se dice "cerrado" a secas y el
  // motivo va en el title, porque un hueco visible es mejor que un rótulo
  // seguro de sí mismo.
  // EL ESTADO DEL MERCADO Y LA FECHA DEL DATO SON DOS HECHOS DISTINTOS.
  //
  // El chip decía "cerrado · cierre del jueves" el viernes a las 11:16 CT con
  // la NYSE y la BMV operando (Lety, 2026-10-02). La causa está explicada en
  // `qd-mercados.js`: el estado se contrastaba contra el último CIERRE, y
  // mientras la sesión corre el cierre de hoy no existe todavía, así que la
  // bolsa salía cerrada todos los días hábiles en horario.
  //
  // Ahora el estado lo decide el horario (`qd-mercados.js`, un solo lugar) y la
  // fecha del dato se dice APARTE, que es lo que pidió: el mapa muestra
  // cierres, y durante la sesión el último que hay es el de ayer. Decirlo no es
  // una disculpa, es la procedencia del número que se está viendo.
  //
  // ESTA COMPOSICIÓN YA NO VIVE ACÁ: es `chipDeMercado`, en `qd-mercados.js`.
  // Se sacó porque las cuatro pantallas nuevas no la tenían y acabaron
  // pintando el texto crudo de `estadoDeBolsa`, que dice "no se sabe de qué
  // día es el último cierre" — cierto, y una queja en pantalla (Lety,
  // 2026-10-20). Dejar acá una copia sería volver a tener dos opiniones sobre
  // el mismo hecho, que es justo lo que este archivo vino a cerrar.
  function pintarChip(d){
    var c = chipDeMercado(d.bolsa || estado.mapa, {
      ahora: new Date(),
      ultimoCierre: d.ultimo_cierre || null,
      // El mapa SÍ muestra cierres, así que sí nombra de cuándo son.
      muestra: 'mapa',
    });
    var el = document.getElementById('chip');
    el.className = 'chip' + (c.abierto ? ' abierto' : '');
    el.textContent = c.chip;
    el.title = c.motivo;
  }

  function cuadrosVisibles(d){
    // YA ES UN CUADRO el que tiene cap verificada o el que tiene precio: el
    // segundo se dibuja gris punteado con tamaño prestado y dice su causa al
    // tocarlo. Este filtro pedía `cap > 0` y por eso una emisora sin cap
    // verificada no salía gris: salía ausente, y su motivo no tenía dónde
    // aparecer. El que no tiene precio no es un cuadro todavía.
    var cs = (d.cuadros||[]).filter(function(c){
      return (Number.isFinite(c.cap) && c.cap>0) || Number.isFinite(c.precio);
    });
    if(estado.sector) return cs.filter(function(c){ return (c.sector||'—')===estado.sector; });
    return cs;
  }

  // Cuántas empresas se ven al abrir. En 390 px, ~30 dejan cuadros tocables;
  // en escritorio hay sitio para más.
  function cuantasVisibles(){
    return (window.innerWidth >= 900) ? 60 : 30;
  }

  // ── UNA PANTALLA, Y LA LETRA APARECE CON EL ZOOM ────────────────────
  // Hasta el 2026-10-01 el mapa del celular crecía a `ancho × 12` y la página
  // se recorría hacia abajo. Se fue: "lo hacemos como TradingView, no largo.
  // Nadie estira el mapa hacia abajo; todos lo dejan en una pantalla y la letra
  // aparece con el zoom" (Lety, 2026-10-02).
  //
  // CÓMO FUNCIONA, Y POR QUÉ NO ES UN `transform: scale`.
  // El treemap se calcula UNA vez contra el alto visible —el que ya da el
  // `flex:1` de <main>— y esa geometría base no se vuelve a tocar. El zoom sólo
  // cambia cómo se PINTA: cada cuadro se dibuja en `x·z − px, y·z − py` con
  // `w·z × h·z`, y su etiqueta se recalcula con `etiquetaCuadro(w·z, h·z)`.
  //
  // Un `transform: scale` habría sido tres líneas y habría agrandado también
  // las letras: un ticker de 6px a 8× son 48px de alto y el cuadro deja de
  // caber en sí mismo. Lo que ella pidió es lo contrario — que al ampliar
  // aparezcan los tickers y después los % de los cuadros que antes no tenían
  // sitio—, y eso sólo sale recalculando la etiqueta contra el tamaño EN
  // PANTALLA. Es también por lo que se repinta el DOM en vez de transformarlo.
  //
  // El costo de repintar 550 cuadros se paga una vez a 1×; ampliado se pintan
  // sólo los que caen dentro de la ventana (a 8× es 1/64 del mapa).
  var ZOOM_MIN = 1, ZOOM_MAX = 8, ALTO_CABECERA = 14;
  var vista = { z: 1, px: 0, py: 0 };
  // La geometría base: lo que squarify repartió contra el alto visible.
  var mapaBase = null;        // { cuadros:[], cabeceras:[], w, h }
  var claveVista = null;      // mapa/sector: al cambiar de pantalla, vuelve a 1×

  var ANCHO_MOVIL = 600;
  function esMovil(){ return window.innerWidth < ANCHO_MOVIL; }

  function limitaVista(){
    vista.z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vista.z));
    if(!mapaBase){ vista.px = 0; vista.py = 0; return; }
    // El mapa ampliado nunca deja ver fuera de sus bordes: el hueco negro al
    // lado de un treemap no es un dato, es un error de encuadre.
    vista.px = Math.min(mapaBase.w * (vista.z - 1), Math.max(0, vista.px));
    vista.py = Math.min(mapaBase.h * (vista.z - 1), Math.max(0, vista.py));
  }

  /** Amplía a `z2` dejando quieto el punto (cx,cy) de la pantalla. */
  function zoomHacia(z2, cx, cy){
    var z1 = vista.z;
    z2 = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z2));
    if(z2 === z1) return;
    var k = z2 / z1;
    vista.px = (vista.px + cx) * k - cx;
    vista.py = (vista.py + cy) * k - cy;
    vista.z = z2;
    limitaVista();
    pintarLienzo();
  }

  function volverA1(){ vista.z = 1; vista.px = 0; vista.py = 0; pintarLienzo(); }

  // Lo que la comprobación del Chromium necesita LEER. No hay nada acá que
  // mueva la vista: los tests amplían con dedos de verdad (Input.dispatchTouchEvent),
  // porque un atajo que salte el gesto dejaría el gesto sin probar.
  window.QD_MAPA = { ANCHO_MOVIL: ANCHO_MOVIL, ZOOM_MIN: ZOOM_MIN, ZOOM_MAX: ZOOM_MAX,
    vista: vista, base: function(){ return mapaBase; } };

  function pintarMapa(d){
    var l = document.getElementById('lienzo');
    var w = l.clientWidth, h = l.clientHeight;
    // Si el layout todavía no se aplicó (primer pintado), se reintenta en el
    // siguiente cuadro en vez de dibujar contra un cero.
    if(!w || !h){ requestAnimationFrame(function(){ pintarMapa(d); }); return; }
    var cs = cuadrosVisibles(d);
    if(!cs.length){
      mapaBase = null;
      pool.cuadros = []; pool.cabeceras = [];
      // ROTO Y VACÍO NO SON LO MISMO, y el marcador lo dice: confundirlos fue
      // el bug. "No hay cuadros" manda a revisar la cosecha; un error de
      // lectura manda a revisar la consulta, y son dos búsquedas distintas.
      l.innerHTML = '<div class="aviso"' + (d.error ? ' data-error="1"' : '')
        + ' style="padding:24px;color:var(--tenue);font:12px var(--mono);line-height:1.5">'
        + (d.error ? esc(d.error) : 'no hay cuadros con capitalización medida para pintar')
        + (d.detalle ? '<br><br>' + esc(JSON.stringify(d.detalle)) : '')
        + '</div>';
      pintarReset();
      return;
    }
    // Al cambiar de pantalla —otro mapa, entrar o salir de un sector— la vista
    // vuelve a 1×: seguir ampliado sobre un reparto distinto deja al dedo en
    // una parte del mapa que ya no es la que estaba mirando. Cambiar de
    // periodo o de moneda NO la mueve: ahí el reparto es el mismo y perder el
    // encuadre sería perder el sitio en el que estaba.
    var clave = estado.mapa + '/' + (estado.sector || '');
    if(clave !== claveVista){ claveVista = clave; vista.z = 1; vista.px = 0; vista.py = 0; }

    // El cartel de "no hay cuadros" de una carga anterior no es un cuadro y no
    // está en el pool: se quita a mano o se queda encima del mapa nuevo.
    var cartel = l.querySelector(':scope > .aviso');
    if(cartel) cartel.remove();

    mapaBase = estado.sector ? baseDeSector(cs, w, h) : basePrimerNivel(cs, w, h);
    limitaVista();
    pintarLienzo();
  }

  // ── LA GEOMETRÍA BASE ─────────────────────────────────────────────
  // Devuelve rectángulos en coordenadas del mapa a 1×. No toca el DOM: el
  // reparto y el pintado quedan separados porque el zoom repinta muchas veces
  // y repartir de nuevo en cada repintado movería los cuadros bajo el dedo.

  // PRIMER NIVEL: TODAS las empresas, agrupadas bajo su sector.
  // No hay "+N más". Un sector cuyas empresas no entraban al top salía como
  // "+55 más · 100%": un sector entero sin una sola empresa, y un cuadro de
  // resto que era el 100% de lo que decía resumir. El agregado había dejado
  // de resumir para tapar.
  function basePrimerNivel(cs, w, h){
    // ── SIN AGRUPAR (R3(c)) ───────────────────────────────────────────
    // El MISMO conjunto de emisoras y los MISMOS tamaños: lo único que
    // cambia es que el área no se reparte primero entre sectores. Por eso no
    // hay cabeceras y por eso el "+N más" de cada sector no aplica: acá no
    // hay sectores que abrir, y un cuadro que no lleva a ningún lado sería
    // peor que no ponerlo.
    var grupos = agrupaPorSector(cs).grupos;
    // ── SIN AGRUPAR (R3(c)) ───────────────────────────────────────────
    // Las MISMAS emisoras y los MISMOS tamaños: lo único que cambia es que el
    // área no se reparte primero entre sectores.
    //
    // Se arma DESDE `grupos` y no desde `cs` a propósito: el `area` de cada
    // cuadro lo calcula `agrupaPorSector` —la verificada vale su
    // capitalización y la gris toma el mínimo de su sector—, así que partir
    // de `cs` dejaría `area` en `undefined` y todos los cuadros medirían
    // igual. Un cuadro no puede cambiar de tamaño al apagar la agrupación:
    // sería cambiar el dato con un botón de vista.
    if(estado.agrupar === 'plano'){
      var planos = [];
      grupos.forEach(function(g){ g.items.forEach(function(it){ planos.push(it); }); });
      planos.sort(function(a, b){ return b.area - a.area; });
      return { cuadros: squarify(itemsDe(planos), { x:0, y:0, w:w, h:h }), cabeceras: [], w: w, h: h };
    }
    var rects = squarify(grupos.map(function(g){ return { key:g.sector, value:g.cap_total, grupo:g }; }), { x:0, y:0, w:w, h:h });
    var cuadros = [], cabeceras = [];
    rects.forEach(function(r){
      var g = r.item.grupo;
      // Sin sitio para la cabecera, el sector se dibuja sin ella: media
      // cabecera recortada no dice el nombre del sector, lo insinúa. Y una
      // banda VACÍA es peor que ninguna: ocupa 14px, no nombra nada y no se
      // puede tocar para entrar. Así que la banda sólo existe si al menos la
      // abreviatura del sector cabe a 1×; si no, el sitio es de los cuadros.
      var nom0 = SECTORES[g.sector] || g.sector;
      var conCabecera = r.h >= ALTO_CABECERA + 12
        && !!etiquetaQueCabe(candidatosSector(nom0), r.w, 11);
      if(conCabecera) cabeceras.push({ x:r.x, y:r.y, w:r.w, h:ALTO_CABECERA, sector:g.sector });
      var y0 = r.y + (conCabecera ? ALTO_CABECERA : 0);
      var h0 = r.h - (conCabecera ? ALTO_CABECERA : 0);
      squarify(itemsDe(g.items), { x:r.x, y:y0, w:r.w, h:h0 }).forEach(function(q){ cuadros.push(q); });
    });
    return { cuadros: cuadros, cabeceras: cabeceras, w: w, h: h };
  }

  // SEGUNDO NIVEL: un sector completo, a pantalla entera. Mismo criterio de
  // área que el primer nivel —incluido el tamaño fijo de las grises— para que
  // un cuadro no cambie de sentido al entrar al sector.
  function baseDeSector(cs, w, h){
    var g = agrupaPorSector(cs).grupos[0];
    return { cuadros: squarify(itemsDe(g ? g.items : []), { x:0, y:0, w:w, h:h }),
             cabeceras: [], w: w, h: h };
  }

  function itemsDe(lista){
    return lista.map(function(c){ var x = cambio(c);
      return { key:c.symbol, value:c.area, cuadro:c, pct:x.pct, motivo:x.motivo,
               cap_verificada:c.cap_verificada }; });
  }

  // ── EL PINTADO, QUE ES LO QUE EL ZOOM CAMBIA ──────────────────────
  // LOS NODOS SE RECICLAN, Y NO ES UNA OPTIMIZACIÓN: ES LO QUE HACE QUE EL
  // PELLIZCO FUNCIONE. Repintar con `innerHTML = ''` quita del documento el
  // cuadro que está debajo del dedo, y cuando el navegador pierde el blanco de
  // un toque manda `touchcancel` y DA POR TERMINADO el gesto. El pellizco se
  // moría en su primer movimiento: ampliaba a 1.5× y ahí se quedaba.
  // Así que no se borra nada: los nodos que ya existen se reescriben en su
  // sitio y los que sobran se esconden. El elemento bajo el dedo sigue vivo.
  var pool = { cuadros: [], cabeceras: [] };

  function nodoDe(lista, i, clase, l){
    if(lista[i]) return lista[i];
    var d = document.createElement('div');
    d.className = clase;
    l.appendChild(d);
    lista[i] = d;
    return d;
  }
  function escondeDesde(lista, i){
    for(var k = i; k < lista.length; k++) lista[k].style.display = 'none';
  }

  function pintarLienzo(){
    var l = document.getElementById('lienzo');
    pintarReset();
    if(!mapaBase){ escondeDesde(pool.cuadros, 0); escondeDesde(pool.cabeceras, 0); return; }
    var z = vista.z, W = mapaBase.w, H = mapaBase.h;

    // Sólo lo que cae dentro de la ventana. A 8× eso es 1/64 del mapa, y es
    // lo que hace que ampliar no cueste 550 nodos cada vez.
    function dentro(x, y, w, h){ return !(x + w < -1 || x > W + 1 || y + h < -1 || y > H + 1); }

    var nc = 0;
    mapaBase.cabeceras.forEach(function(c){
      var x = c.x*z - vista.px, y = c.y*z - vista.py, w = c.w*z, h = c.h*z;
      if(!dentro(x, y, w, h)) return;
      // EL NOMBRE SE QUEDA A LA VISTA AL RECORRER. El texto va pegado al borde
      // izquierdo de la banda, así que ampliado y movido hacia la derecha el
      // nombre del sector se iba fuera de la pantalla y quedaba una franja
      // negra sin decir de qué sector era lo que se estaba mirando. La banda se
      // recorta a la parte visible —nunca más allá de su sector— y el nombre
      // viaja con ella.
      var xv = Math.max(0, x), wv = Math.min(x + w, W) - xv;
      if(wv <= 0) return;
      var cab = nodoDe(pool.cabeceras, nc++, 'cabecera', l);
      var nom = SECTORES[c.sector] || c.sector;
      // La banda escala con el mapa —si no, dejaría un hueco entre ella y los
      // cuadros, que están repartidos por debajo— pero la LETRA se topa: una
      // cabecera de 16px ya se lee, y a 8× sería un cartel.
      var f = Math.max(9, Math.min(16, Math.round(h * 0.78)));
      cab.style.cssText = 'left:'+xv+'px;top:'+y+'px;width:'+wv+'px;height:'+h+'px;font-size:'+f+'px';
      // Regla 3: si no cabe entera, abreviatura; nunca cortada a la mitad.
      cab.textContent = etiquetaQueCabe(candidatosSector(nom), wv, f) || '';
      cab.title = nom;
      cab.setAttribute('aria-label', nom);
      cab.setAttribute('data-sector', c.sector);
    });
    escondeDesde(pool.cabeceras, nc);

    var n = 0;
    mapaBase.cuadros.forEach(function(q){
      var x = q.x*z - vista.px, y = q.y*z - vista.py, w = q.w*z, h = q.h*z;
      if(!dentro(x, y, w, h)) return;
      pintaCuadro(nodoDe(pool.cuadros, n++, 'cuadro', l), q.item, x, y, w, h);
    });
    escondeDesde(pool.cuadros, n);
  }

  function pintarReset(){
    document.querySelector('main').setAttribute('data-zoom', vista.z > 1 ? '1' : '0');
  }

  function pintarRuta(){
    var r = document.getElementById('ruta');
    r.innerHTML = '';
    r.setAttribute('data-visible', estado.sector ? '1' : '0');
    if(!estado.sector) return;
    var b = document.createElement('button');
    b.className = 'volver'; b.type = 'button';
    b.textContent = '← ' + (SECTORES[estado.sector]||estado.sector);
    b.addEventListener('click', function(){ estado.sector=null; estado.symbol=null; escribirUrl(true); render(); });
    r.appendChild(b);
  }

  function entrarASector(sector){
    estado.sector = sector; estado.symbol = null; escribirUrl(true); render();
  }

  function pintaCuadro(div, it, x, y, w, h){
    // UN DATO QUE FALTA NO PUEDE ESCONDER OTRO QUE SÍ ESTÁ.
    //
    // Hay dos motivos distintos para el mismo punteado y NO son lo mismo:
    //   · sin % no se puede colorear — el cuadro no dice nada del día;
    //   · sin cap verificada el TAMAÑO es prestado — el cuadro no dice nada
    //     del tamaño, pero su % es un número medido como cualquier otro.
    //
    // El segundo caso se callaba el %, por miedo a que un cuadro de tamaño no
    // afirmado "pasara por entero". Estaba mal: WDC salía −10.2% en "más
    // bajan" y "—" en el mapa, con los dos números sacados de la MISMA serie
    // (Lety, 2026-10-05). Dos pantallas de la misma app contradiciéndose es
    // peor que cualquier cosa que el silencio pudiera prevenir.
    //
    // Lo que afirma el tamaño ya lo desmiente el gris y el borde punteado, que
    // es justo la pieza que ESTE cuadro tiene y una fila de tabla no. Así que
    // el fondo se queda gris —el tamaño sigue sin afirmarse— y el % se pinta.
    var capGris = it.cap_verificada === false;
    var incompleto = capGris || !Number.isFinite(it.pct);
    div.className = 'cuadro' + (incompleto ? ' punteado' : '');
    div.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'
      + (capGris ? COLOR_SIN_DATO : colorDe(it.pct));
    div.setAttribute('aria-label', it.key);

    var txt = '—';
    if(Number.isFinite(it.pct)){
      var r1 = Math.round(it.pct*10)/10;
      txt = r1===0 ? '0.0%' : ((r1>0?'+':'')+r1.toFixed(1)+'%');
    }
    // EL TEXTO SÓLO SI CABE, Y CONTRA EL TAMAÑO EN PANTALLA. `w` y `h` ya
    // vienen multiplicados por el zoom, así que ampliar hace aparecer primero
    // el ticker y después el %, que es justo lo que se pidió: la letra sale
    // cuando hay sitio, no antes. Un cuadro de 3px existe, se toca y va sin
    // letra —como en Finviz—; nunca se recorta a mitad de palabra, porque
    // media palabra no es información, es ruido con forma de información.
    // El ticker puede bajar a 6px en celular; el % conserva su piso de 8
    // (`fontMinDos`), porque un número de 6px no se lee: se adivina.
    var e = etiquetaCuadro(w, h, {
      ticker: it.key, pct: txt, fontPx: 18,
      fontMin: esMovil() ? 6 : 8, fontMinDos: 8,
    });
    var html = '';
    if(e.ticker){
      html = '<div class="sym" style="font-size:'+e.font+'px">'+esc(e.ticker)+'</div>';
      if(e.pct) html += '<div class="val" style="font-size:'+e.font_pct+'px">'+esc(e.pct)+'</div>';
    }
    div.innerHTML = html;
    // El tap y el hover NO se enganchan por cuadro: se delegan en el lienzo.
    // Ampliar repinta, y 550 listeners por repintado es trabajo que se tira.
    // Además el tap tiene que poder distinguirse de un arrastre o un pellizco,
    // y eso sólo se sabe en el gesto completo, no en un `click` por cuadro.
    div.qdItem = it;
  }

  // ═══════════════════════════════════════════════════════════════════
  // LOS GESTOS: pellizcar para ampliar, un dedo para moverse, tap para abrir.
  //
  // TRES COSAS QUE ESTO TIENE QUE DISTINGUIR, y confundirlas es el bug:
  //   · un TAP abre la hoja de ese cuadro;
  //   · un ARRASTRE mueve el mapa y NO abre nada;
  //   · un PELLIZCO amplía y NO abre nada, ni siquiera cuando el segundo dedo
  //     se levanta antes que el primero y el final parece un toque.
  // Por eso el tap no se engancha con un `click` por cuadro: el navegador
  // sintetiza un click al final de casi cualquier gesto, y para entonces ya no
  // se sabe de dónde venía.
  //
  // El doble tap amplía 2× donde se tocó, así que el primer tap no puede abrir
  // la hoja de inmediato: espera `MS_DOBLE_TAP` por si llega el segundo. Es el
  // mismo retardo que hace cualquier mapa táctil, y sólo en celular — con
  // puntero fino el click abre al instante.
  var MS_DOBLE_TAP = 280, PX_ARRASTRE = 8;
  var gesto = { activo:false, movido:false, pellizco:false, dedos:0,
                x0:0, y0:0, px0:0, py0:0, d0:0, z0:1, cx:0, cy:0,
                tapT:0, tapX:0, tapY:0, tapTimer:null };

  function puntosDe(ev, l){
    var r = l.getBoundingClientRect(), out = [];
    for(var i=0;i<ev.touches.length;i++){
      out.push({ x: ev.touches[i].clientX - r.left, y: ev.touches[i].clientY - r.top,
                 cx: ev.touches[i].clientX, cy: ev.touches[i].clientY });
    }
    return out;
  }
  function distancia(a, b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

  /** Abre lo que haya bajo ese punto de la pantalla: cuadro u hoja de sector. */
  function abrirEnPunto(cx, cy){
    var el = document.elementFromPoint(cx, cy);
    if(!el) return;
    var cab = el.closest ? el.closest('.cabecera') : null;
    if(cab && cab.getAttribute('data-sector')){ entrarASector(cab.getAttribute('data-sector')); return; }
    var cu = el.closest ? el.closest('.cuadro') : null;
    if(cu && cu.qdItem){
      estado.symbol = cu.qdItem.key; escribirUrl(true); abrirHoja(cache[estado.mapa], cu.qdItem.key);
    }
  }

  function montarGestos(){
    var l = document.getElementById('lienzo');

    l.addEventListener('touchstart', function(ev){
      if(!esMovil()) return;
      var p = puntosDe(ev, l);
      gesto.dedos = Math.max(gesto.dedos, p.length);
      if(p.length === 1 && !gesto.pellizco){
        gesto.activo = true; gesto.movido = false;
        gesto.x0 = p[0].x; gesto.y0 = p[0].y;
        gesto.px0 = vista.px; gesto.py0 = vista.py;
      } else if(p.length >= 2){
        // Un pellizco empieza: el punto medio entre los dedos es el ancla y no
        // se mueve mientras dure. Volver a leerlo en cada `touchmove` haría que
        // el mapa se escapara con el más mínimo temblor.
        gesto.pellizco = true; gesto.movido = true;
        gesto.d0 = distancia(p[0], p[1]) || 1;
        gesto.z0 = vista.z;
        gesto.cx = (p[0].x + p[1].x) / 2; gesto.cy = (p[0].y + p[1].y) / 2;
        gesto.px0 = vista.px; gesto.py0 = vista.py;
      }
    }, { passive: true });

    l.addEventListener('touchmove', function(ev){
      if(!esMovil() || !mapaBase) return;
      var p = puntosDe(ev, l);
      if(gesto.pellizco && p.length >= 2){
        ev.preventDefault();
        var k = (distancia(p[0], p[1]) || 1) / gesto.d0;
        var z2 = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, gesto.z0 * k));
        var kk = z2 / gesto.z0;
        vista.px = (gesto.px0 + gesto.cx) * kk - gesto.cx;
        vista.py = (gesto.py0 + gesto.cy) * kk - gesto.cy;
        vista.z = z2;
        limitaVista(); pintarLienzo();
        return;
      }
      if(!gesto.activo || p.length !== 1) return;
      var dx = p[0].x - gesto.x0, dy = p[0].y - gesto.y0;
      if(Math.abs(dx) > PX_ARRASTRE || Math.abs(dy) > PX_ARRASTRE) gesto.movido = true;
      if(vista.z <= 1) return;   // a 1× no hay a dónde moverse
      ev.preventDefault();
      vista.px = gesto.px0 - dx; vista.py = gesto.py0 - dy;
      limitaVista(); pintarLienzo();
    }, { passive: false });

    l.addEventListener('touchend', function(ev){
      if(!esMovil()) return;
      if(ev.touches.length > 0) return;   // todavía queda algún dedo abajo
      var fueTap = gesto.activo && !gesto.movido && !gesto.pellizco && gesto.dedos === 1;
      // El click sintético que el navegador manda después del touchend abriría
      // la hoja aunque el gesto haya sido un arrastre o un pellizco.
      ev.preventDefault();
      gesto.activo = false; gesto.pellizco = false; gesto.dedos = 0;
      if(!fueTap) return;

      var t = ev.changedTouches[0];
      var cx = t.clientX, cy = t.clientY;
      var ahora = Date.now();
      var esDoble = (ahora - gesto.tapT) < MS_DOBLE_TAP
        && Math.abs(cx - gesto.tapX) < 32 && Math.abs(cy - gesto.tapY) < 32;
      if(esDoble){
        clearTimeout(gesto.tapTimer); gesto.tapTimer = null; gesto.tapT = 0;
        var r = document.getElementById('lienzo').getBoundingClientRect();
        zoomHacia(vista.z * 2, cx - r.left, cy - r.top);
        return;
      }
      gesto.tapT = ahora; gesto.tapX = cx; gesto.tapY = cy;
      clearTimeout(gesto.tapTimer);
      gesto.tapTimer = setTimeout(function(){ gesto.tapTimer = null; abrirEnPunto(cx, cy); }, MS_DOBLE_TAP);
    }, { passive: false });

    l.addEventListener('touchcancel', function(){
      gesto.activo = false; gesto.pellizco = false; gesto.dedos = 0;
    }, { passive: true });

    // Puntero fino (escritorio): click directo, sin retardo ni gestos.
    l.addEventListener('click', function(ev){
      if(esMovil()) return;
      abrirEnPunto(ev.clientX, ev.clientY);
    });
    l.addEventListener('mousemove', function(ev){
      if(esMovil() || !(window.matchMedia && window.matchMedia('(pointer:fine)').matches)) return;
      var cu = ev.target.closest ? ev.target.closest('.cuadro') : null;
      if(cu && cu.qdItem) mostrarTip(ev, cu.qdItem); else ocultarTip();
    });
    l.addEventListener('mouseleave', ocultarTip);

    document.getElementById('reset').addEventListener('click', function(ev){
      ev.stopPropagation(); volverA1();
    });
  }

  function mostrarTip(ev, it){
    var t = document.getElementById('tip');
    var etq = it.key;
    t.innerHTML = '<div>'+esc(etq)+'</div>'
      + '<div>'+qdPctTag(it.pct, estado.periodo, { motivo: it.motivo })+'</div>';
    t.style.display='block';
    var x = Math.min(ev.clientX+12, window.innerWidth-t.offsetWidth-8);
    t.style.left = x+'px'; t.style.top = Math.max(8, ev.clientY-40)+'px';
  }
  function ocultarTip(){ document.getElementById('tip').style.display='none'; }

  // EL AVISO DE SISTEMA, que no es lo mismo que un dato que falta. Un mapa
  // gris porque la cap no se auditó todavía manda a correr un job; uno gris
  // porque la cosecha está atrasada manda a otro lado. Decir sólo "N cuadros
  // sin dato completo" los confunde y hace buscar el bug donde no está.
  function pintarAviso(d){
    var el = document.getElementById('aviso');
    if(!el) return;
    var a = d.auditoria && d.auditoria.aviso;
    el.textContent = a || '';
    el.style.display = a ? 'block' : 'none';
  }

  function pintarPie(d){
    var f = d.fuente || {};
    var partes = [];
    partes.push('fuente: ' + (f.series || '—'));
    if(d.cosecha && d.cosecha.ultima_fecha) partes.push('último cierre: ' + d.cosecha.ultima_fecha);
    if(d.cosecha && d.cosecha.alerta) partes.push('⚠ cosecha atrasada ' + d.cosecha.sesiones_de_atraso + ' sesiones');
    // LO QUE SE CUENTA ACÁ SON CUADROS, y un símbolo sin precio no es un
    // cuadro todavía: no se dibuja, no tiene %, no hay nada que mirar. El
    // conteo decía "277 cuadros sin dato completo" sumándole los 250 sin
    // serie, y mandaba a buscar 277 problemas donde había 25.
    var f2 = d.faltantes || {};
    if(f2.sin_cap_verificada) partes.push(f2.sin_cap_verificada + ' sin capitalización verificada');
    if(f2.sin_periodo) partes.push(f2.sin_periodo + ' sin periodo');
    // Regla 5 + regla 3: si la pantalla está en pesos, el pie declara con qué
    // se convirtió. El FIX es diario, así que la fecha es parte del dato: "el
    // FIX de Banxico" sin fecha no dice qué número se usó.
    if(estado.mapa === 'us' && estado.moneda === 'mxn'){
      partes.push(d.fix && d.fix.fecha
        ? 'en pesos con el FIX de Banxico (SF43718) del ' + d.fix.fecha
        : 'sin FIX: ' + ((d.fix && d.fix.motivo) || 'no llegó el FIX de Banxico'));
    }
    partes.push('generado ' + new Date(d.generado_en).toLocaleString('es-MX'));
    document.getElementById('pie').textContent = partes.join(' · ');
  }

  // ── La hoja ───────────────────────────────────────────────────────
  function abrirHoja(d, symbol){
    var c = (d.cuadros||[]).find(function(x){ return x.symbol===symbol; });
    if(!c) return;
    var r = cambio(c);
    // En pesos la hoja muestra LAS DOS y con su etiqueta: el número grande del
    // cuadro es el de pesos, y el local queda debajo para que se vea de dónde
    // salió. En dólares no hay segunda línea que mostrar.
    var enPeso = (estado.mapa === 'us' && estado.moneda === 'mxn');
    var filas = enPeso ? [
      [ETIQUETA_PESOS, qdPctTag(r.pct, estado.periodo, { motivo: r.motivo })],
      ['cambio local', qdPctTag(r.local_pct, estado.periodo, { motivo: r.local_motivo })],
    ] : [
      ['cambio', qdPctTag(r.pct, estado.periodo, { motivo: r.motivo })],
    ];
    filas = filas.concat([
      ['precio', (c.precio!=null ? fmtPrice(c.precio) : '—') + (enPeso ? ' USD' : '')],
      ['al cierre de', c.fecha_precio || '—'],
      ['capitalización', esc(qdCap(c.cap, d.bolsa === 'mx' ? 'MXN' : 'USD'))],
      ['fuente de la cap', esc(c.cap_fuente || '—')],
      ['sector', esc(SECTORES[c.sector]||c.sector||'—')]
    ]);
    // Cada número en pesos dice qué FIX usó y de qué fecha (regla 3).
    if(enPeso && r.fuente_peso) filas.push(['fuente del peso', esc(r.fuente_peso)]);
    if(c.cap_medida_en) filas.push(['cap medida el', esc(c.cap_medida_en)]);
    if(c.serie_liquida) filas.push(['serie', esc(c.serie_liquida)]);
    if(c.acciones_por_unidad && c.acciones_por_unidad!==1) filas.push(['acciones por unidad', String(c.acciones_por_unidad)]);
    if(c.etiqueta) filas.push(['verificación', esc(c.etiqueta)]);
    // EN QUÉ ESTADO ESTÁ LA CONSULTA A EDGAR. Sólo se muestra cuando no trajo
    // conteo, que es cuando importa: el 2026-09-26 la hoja decía "EDGAR no dio
    // acciones" de ORCL sin que EDGAR hubiera sido consultado, y eso manda a
    // revisar la fuente en lugar del job que murió antes de preguntarle.
    if(c.cap_edgar_estado && c.cap_edgar_estado!=='consultado_con_dato'){
      filas.push(['consulta a EDGAR', c.cap_edgar_estado==='no_consultado'
        ? 'pendiente' : 'hecha, y no trajo acciones']);
    }
    if(c.cap_portada_edgar) filas.push(['portada del 10-Q', esc(c.cap_portada_edgar)]);
    // NO es el largo de la historia: es lo que la consulta del mapa trajo
    // (los cierres recientes más el ancla de fin de año). Decir "puntos de
    // serie: 24" hacía parecer que el YTD salía de 24 días, cuando sale del
    // ancla que viene EN esos 24.
    filas.push(['cierres traídos', String(c.puntos||0) + (c.ytd ? ' (incluye el ancla de fin de año)' : '')]);

    // La nota va junto al motivo: un cuadro VERIFICADO puede tener algo que
    // declarar —"la cap declarada se descartó porque dos conteos de acciones
    // coinciden"— y eso es procedencia, no un error. Sin esto, la pantalla
    // mostraría el tamaño sin decir que se descartó un dato de la fuente.
    var motivo = c.motivo || r.motivo || c.ytd_motivo;
    if(c.cap_nota) motivo = motivo ? (c.cap_nota + ' · ' + motivo) : c.cap_nota;
    document.getElementById('hojaCuerpo').innerHTML =
      // LAS INICIALES, NO UN LOGO. No tenemos fuente de logos, y una que
      // dependa de terceros siempre va a tener huecos: un ícono roto dice
      // "esto está mal hecho" sobre una empresa que no tiene nada de malo.
      // Un cuadro con el ticker en mono nunca falta y nunca miente.
      '<div class="ficha"><div class="iniciales">'+esc(String(c.symbol||'').slice(0,4))+'</div>'
      + '<div><h2>'+esc(c.symbol)+'</h2><div class="sub">'+esc(c.nombre||'')+'</div></div></div>'
      + '<dl>' + filas.map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('') + '</dl>'
      // Regla 2: el dato que falta dice POR QUÉ falta.
      + (motivo ? '<div class="motivo">'+esc(motivo)+'</div>' : '');
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','1'); h.setAttribute('aria-hidden','false');
  }
  function cerrarHoja(silencioso){
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','0'); h.setAttribute('aria-hidden','true');
    if(!silencioso && estado.symbol){ estado.symbol=null; escribirUrl(true); }
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ═══════════════════════════════════════════════════════════════════
  // MUNDO (artboard 4) — rejilla por región, tamaño fijo, color por %
  //
  // El % de cada cuadro sale de `qdPeriodChange` sobre la serie que manda el
  // endpoint (regla 1), incluido YTD: la serie es de un año, así que el ancla
  // de fin de año la encuentra el mismo calculador y no hace falta que el
  // servidor la elija —como sí hace falta en el mapa de acciones, donde sólo
  // viajan 22 cierres para no mandar 75,000 puntos a un teléfono—.
  //
  // El estado es POR BOLSA, no global: el Nikkei cerrado y el Bovespa abierto
  // caben en la misma pantalla. Y las horas de los encabezados van en hora de
  // MÉXICO, que es la decisión del mockup: "Asia · abre lun 18:00 CT".
  // ═══════════════════════════════════════════════════════════════════
  var BOLSAS_POR_REGION = { america:[], europa:[], asia:[], otros:[] };

  function cambioLocal(c){
    var r = qdPeriodChange(c.serie || [], estado.periodo);
    if(r.pct==null && !r.motivo) r.motivo = 'la serie no alcanza para este periodo';
    return r;
  }

  // ── R2(c): EL RENDIMIENTO EN PESOS ─────────────────────────────────
  // La aritmética vive en `qd-pesos.js` y recibe DOS rendimientos ya
  // calculados con `qdPeriodChange` —el del activo y el de su moneda contra el
  // peso—, nunca precios: calcularlo desde precios haría dos implementaciones
  // del ancla del periodo, que es el bug que la regla 1 previene.
  function rendimientoDeSerie(sym, d){
    var s = d && d.data && d.data[sym] && d.data[sym].series;
    if(!s || s.length < 2) return null;
    var r = qdPeriodChange(s, estado.periodo);
    return Number.isFinite(r.pct) ? r.pct : null;
  }

  function pctDelFix(d){
    // El FIX de Banxico, en el MISMO periodo. Serie diaria: `qdPeriodChange`
    // la ancla por fecha igual que cualquier otra.
    var f = d && d.fix && Array.isArray(d.fix.serie) ? d.fix.serie : null;
    if(!f || f.length < 2) return null;
    var r = qdPeriodChange(f, estado.periodo);
    return Number.isFinite(r.pct) ? r.pct : null;
  }

  function enPesosDe(c, d){
    var moneda = c.moneda || c.moneda_esperada;
    var cruce = MONEDAS[moneda];
    var usdPorUnidad = null;
    if(cruce){
      var p = rendimientoDeSerie(cruce.symbol, d);
      if(p != null){
        // `EURUSD=X` son DÓLARES POR EURO: para el cruce hace falta la forma
        // inversa, euros por dólar. Confundirlas invierte el signo.
        usdPorUnidad = cruce.invertir ? ((1 / (1 + p/100)) - 1) * 100 : p;
      }
    }
    return enPesos({
      pctLocal: cambioLocal(c).pct,
      moneda: moneda,
      usdMxnPct: pctDelFix(d),
      usdPorUnidadPct: usdPorUnidad,
      fix: d && d.fix ? { serie:'SF43718', fecha:d.fix.fecha, valor:d.fix.valor } : null,
    });
  }

  function estadoDeCuadro(c){
    if(c.es24h) return estado24h();
    // `fecha_dato`, no `ultimo_cierre`: cuando el precio de hoy ya entró a la
    // serie, el número que se ve es de hoy y el estado tiene que salir de la
    // MISMA fecha. Asia decía "cierre del lunes" con los cuadros en martes.
    // `datoIntradia: true`: los cuadros de Mundo traen `precio_t`, una marca de
    // tiempo de HOY cuando se está operando. Ahí sí un dato viejo con el
    // horario corriendo desmiente la sesión. El mapa de EE.UU. y el de México
    // viajan con cierres diarios y no pueden hacer ese contraste.
    try { return estadoDeBolsa(c.bolsa, new Date(), { ultimoCierre: c.fecha_dato || c.ultimo_cierre, datoIntradia: true }); }
    catch(e){ return { etiqueta: 'sin horario declarado', abierta: false, estado: 'desconocida' }; }
  }

  /** Lo que se pinta grande y lo que se pinta chico, según moneda y tipo. */
  function lineasDeCuadro(c, d){
    var local = cambioLocal(c);
    if(estado.moneda === 'mxn'){
      var mx = enPesosDe(c, d);
      return {
        pct: mx.pct,
        grande: qdPctTag(mx.pct, estado.periodo, { motivo: mx.motivo }),
        // El local queda chico, como en el mockup: el número grande es el que
        // el toggle promete y el chico es de dónde salió.
        chico: 'local ' + (Number.isFinite(local.pct) ? (local.pct>=0?'+':'') + local.pct.toFixed(1) + '%' : '—'),
        motivo: mx.motivo || local.motivo || null,
        fuente: mx.fuente || null,
      };
    }
    return {
      pct: local.pct,
      grande: qdPctTag(local.pct, estado.periodo, { motivo: local.motivo }),
      // En moneda local la línea chica lleva el NIVEL, no el país: el país ya
      // está arriba y repetirlo desperdicia el único renglón que queda. Para
      // Bitcoin y el oro va con "$" porque son dólares; para un índice va sin
      // símbolo, porque 45,800 puntos del Nikkei no son pesos ni dólares.
      // LA FECHA VA SIEMPRE, no sólo cuando el dato es viejo. Ponerla sólo a
      // los atrasados dejaba sin fecha justo a los más frescos —los de Asia,
      // que ya traían el precio de hoy— y obligaba a saber la regla para leer
      // la pantalla. Cada número dice de cuándo es.
      chico: (c.prefijo || '') + fmtPrice(c.precio)
        + (c.precio_fecha ? ' · ' + c.precio_fecha.slice(5) : ''),
      motivo: local.motivo || null,
      fuente: 'yahoo:v8/chart',
    };
  }

  function pintarMundo(d){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    var cont = document.getElementById('mundo');
    var html = '';

    // ── La tira de arriba: cinco índices corriendo ────────────────────
    html += '<div class="tira">' + TIRA.map(function(sym){
      var c = null;
      m.regiones.forEach(function(r){ r.cuadros.forEach(function(x){ if(x.symbol===sym) c = x; }); });
      if(!c) return '';
      var l = lineasDeCuadro(c, d);
      var corto = { '^GSPC':'SPX', '^MXX':'IPC', '^N225':'NIKKEI', '^KS11':'KOSPI', '^GDAXI':'DAX' }[sym] || sym;
      return '<span><b>' + esc(corto) + '</b> ' + l.grande + '</span>';
    }).join('') + '</div>';

    // ── El titular, con el día y el estado en hora de México ──────────
    var hoy = new Date();
    var diaTxt = hoy.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short', timeZone:'America/Mexico_City' });
    var reg = {};
    ['america','europa','asia'].forEach(function(k){
      var cierres = {};
      var claves = [];
      m.regiones.forEach(function(r){ if(r.clave!==k) return; r.cuadros.forEach(function(c){
        if(c.es24h) return;
        claves.push(c.bolsa); cierres[c.bolsa] = c.fecha_dato || c.ultimo_cierre;
      }); });
      BOLSAS_POR_REGION[k] = claves;
      reg[k] = estadoDeRegion(claves, hoy, { cierres: cierres, datoIntradia: true });
    });
    reg.otros = { etiqueta: '24/7 · abierto' };
    var sub = diaTxt + (reg.america && reg.america.etiqueta ? ' · ' + reg.america.etiqueta : '')
      + (reg.asia && reg.asia.proxima ? ' · Asia ' + reg.asia.proxima.etiqueta : '');
    html += '<div class="titular"><h1>El mundo, ahora</h1><div class="sub">' + esc(sub) + '</div></div>';

    if(estado.moneda === 'mxn'){
      var fx = d && d.fix;
      html += '<div class="nota">' + (fx && fx.fecha
        ? 'Rendimiento en pesos: índice local convertido con su tipo de cambio del periodo · FIX del ' + esc(fx.fecha)
        : 'Rendimiento en pesos: NO disponible — ' + esc((fx && fx.motivo) || 'no llegó el FIX de Banxico')) + '</div>';
    }

    // ── Las cuatro regiones ───────────────────────────────────────────
    m.regiones.forEach(function(r){
      if(!r.cuadros.length && !r.aviso) return;
      var e = reg[r.clave] || {};
      html += '<div class="reg">' + esc(r.nombre) + '<span>'
        + esc(r.clave==='america' ? (e.etiqueta||'') : (e.etiqueta||''))
        + (r.aviso ? ' · ' + esc(r.aviso) : '') + '</span></div>';
      html += '<div class="grid">';
      r.cuadros.forEach(function(c){
        var l = lineasDeCuadro(c, d);
        var sinPct = !Number.isFinite(l.pct);
        html += '<div class="c' + (sinPct ? ' punteado' : '') + '"'
          + ' style="background:' + (sinPct ? COLOR_SIN_DATO : colorDe(l.pct)) + '"'
          + ' data-sym="' + esc(c.symbol) + '" role="button" tabindex="0"'
          + ' aria-label="' + esc(c.nombre) + '">'
          + '<div><div class="n">' + esc(c.nombre) + '</div>'
          + '<div class="r">' + esc(c.pais || '') + '</div></div>'
          + '<div><div class="v">' + l.grande + '</div>'
          + '<div class="l">' + esc(l.chico) + '</div></div>'
          + '</div>';
      });
      html += '</div>';
    });

    // Lo que no se pudo pintar se DICE, con su causa (regla 2).
    if(m.faltantes.length){
      html += '<div class="reg">sin dato<span>' + m.faltantes.length + ' de '
        + (m.faltantes.length + m.regiones.reduce(function(a,r){ return a + r.cuadros.length; },0)) + '</span></div>'
        + '<div class="nota">'
        + m.faltantes.map(function(f){ return esc(f.nombre + ' (' + f.symbol + '): ' + f.motivo); }).join('<br>')
        + '</div>';
    }
    cont.innerHTML = html;
  }

  // El chip de arriba en Mundo no puede ser de una bolsa: hay trece en
  // pantalla. Dice cuántas están abiertas, y el detalle vive en cada región.
  function pintarChipMundo(d){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    // CUENTA BOLSAS, NO CUADROS. Decía "5 de 14 bolsas abiertas" contando
    // índices: el S&P 500 y el Nasdaq 100 son DOS cuadros y UNA bolsa, y Nueva
    // York no abre dos veces. Se cuenta por clave de bolsa, sin repetir.
    var bolsas = {};
    m.regiones.forEach(function(r){ r.cuadros.forEach(function(c){
      if(c.es24h || !c.bolsa) return;
      if(bolsas[c.bolsa] === undefined) bolsas[c.bolsa] = estadoDeCuadro(c).abierta === true;
    }); });
    var claves = Object.keys(bolsas);
    var total = claves.length;
    var abiertas = claves.filter(function(k){ return bolsas[k]; }).length;
    var el = document.getElementById('chip');
    el.className = 'chip' + (abiertas > 0 ? ' abierto' : '');
    el.textContent = (abiertas > 0 ? '● ' : '○ ')
      + (total ? abiertas + ' de ' + total + ' bolsas abiertas' : 'sin bolsas con dato');
    el.title = 'el estado de cada bolsa va en el encabezado de su región: con trece husos, un solo chip mentiría en alguno';
  }

  function pintarMonedaToggle(){
    var t = document.getElementById('moneda');
    // EE.UU. y Mundo sí; MÉXICO NO: esas acciones ya cotizan en pesos y un
    // toggle que no puede hacer nada es un botón que miente.
    t.hidden = (estado.mapa !== 'mundo' && estado.mapa !== 'us');
    if(t.hidden) return;
    t.innerHTML = [['usd','Local'],['mxn','MXN']].map(function(x){
      return '<button type="button" data-mon="'+x[0]+'" aria-pressed="'+(x[0]===estado.moneda)+'">'+x[1]+'</button>';
    }).join('');
  }

  function pintarPieMundo(d){
    var gen = d && d.generated_at ? new Date(d.generated_at) : null;
    document.getElementById('pie').textContent =
      'fuente: yahoo v8/chart vía /api/macro-markets · índices con retraso · el estado (abierto/cerrado) es por bolsa, no global'
      + (estado.moneda==='mxn' && d && d.fix && d.fix.fecha ? ' · pesos con el FIX de Banxico del ' + d.fix.fecha : '')
      + (gen && Number.isFinite(gen.getTime()) ? ' · generado ' + gen.toLocaleString('es-MX') : '')
      + ' · Información, no asesoría';
  }

  function abrirHojaMundo(d, symbol){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    var c = null;
    m.regiones.forEach(function(r){ r.cuadros.forEach(function(x){ if(x.symbol===symbol) c = x; }); });
    if(!c) return;
    var local = cambioLocal(c);
    var mx = enPesosDe(c, d);
    var e = estadoDeCuadro(c);
    var filas = [
      ['cambio local', qdPctTag(local.pct, estado.periodo, { motivo: local.motivo })],
      // La línea que el encargo pide que se active en la hoja.
