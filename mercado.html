<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/mercado — QuantDesk</title>
<meta name="description" content="Mapa de mercado de EE.UU. y México por capitalización, con el cambio del periodo que elijas.">
<!--
  ═══════════════════════════════════════════════════════════════════
  /mercado — R1: el mapa.

  TRES REGLAS QUE ESTE ARCHIVO NO PUEDE ROMPER, y dónde se ven:

  1. TODO % pasa por qdPeriodChange + qdPctTag (qd-periods.js). Acá no se
     resta ni se divide un precio en ninguna parte. qdPctTag LANZA si le
     falta la etiqueta de periodo, así que un % mudo no llega a pintarse.
  2. Dato que falta es "—" en gris CON SU CAUSA, nunca un estimado. El
     endpoint manda el motivo por cuadro y la hoja lo muestra; el color de
     "sin dato" es distinto del gris de "sin cambio" a propósito.
  3. El endpoint LEE. La página hace UNA petición por mapa y el toggle no
     vuelve a pedir nada: los cuatro periodos se calculan sobre lo que ya
     viajó.

  QUÉ SE VE AL ABRIR, Y POR QUÉ NO SON 300 CUADROS NI 11 SECTORES.
  En 390 px, 300 cuadros dan ~10 px de lado y el encargo pide tap ≥44 px:
  no caben juntas. La primera versión resolvió abriendo en los 11 sectores,
  y probada en el teléfono la conclusión fue otra: un mapa de mercado que
  abre sin una sola empresa no es un mapa de mercado.
  Ahora el primer nivel son los ~30 nombres más grandes bajo la cabecera de
  su sector, y cada sector cierra con un cuadro "+N más = X%" que lo abre
  completo. La cabecera también abre el sector. El área de cada sector es su
  capitalización TOTAL, así que el cuadro del resto ocupa exactamente el
  peso que representa. El recorte NO cambia con el dispositivo: los 300 son
  los mismos y el "+N más" global también.
  ═══════════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --bg:#0a0a0a; --panel:#111; --linea:#222; --texto:#e8e8e8; --tenue:#888;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --tap:44px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;
    padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--linea)}
  .marca{font-family:var(--mono);font-size:15px;letter-spacing:.5px}
  .marca b{color:#00c97d;font-weight:600}
  .chip{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--tenue);
    border:1px solid var(--linea);border-radius:3px;padding:3px 7px;white-space:nowrap}
  .chip.abierto{color:#00c97d}
  nav,.toggle{display:flex;gap:6px;padding:8px 16px;border-bottom:1px solid var(--linea)}
  nav button,.toggle button{flex:1;min-height:var(--tap);min-width:var(--tap);
    background:transparent;border:1px solid var(--linea);border-radius:6px;color:var(--tenue);
    font-family:var(--mono);font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  nav button[aria-selected="true"],.toggle button[aria-pressed="true"]{
    background:#1a1a1a;border-color:#3a3a3a;color:var(--texto)}
  main{flex:1;position:relative;margin:8px 16px;min-height:0}
  /* overflow:hidden NO es cosmético: sin él, un cuadro calculado con una
     altura vieja se dibuja encima del pie y tapa la fuente del dato. */
  #lienzo{position:absolute;inset:0;overflow:hidden}
  /* ── EL MAPA LARGO DEL CELULAR ────────────────────────────────────────
     En 390px de ancho, obligar al mapa a caber en una pantalla deja cuadros
     de 3px: se ven, se tocan, y no se puede saber de quién son. En celular el
     treemap crece a max(2000px, ancho × 5) y la página se recorre, como el
     mockup (Main medía 1,640px). En escritorio no cambia nada: ahí el mapa
     cabe entero y el no-scroll sigue siendo la regla.
     `position:relative` es necesario, no cosmético: con `inset:0` el alto
     queda sobre-restringido y el navegador ignora el `height` que pone el JS. */
  /* ── MUNDO: REJILLA, NO TREEMAP (artboard 4) ─────────────────────────
     Encargo §3/R2: "un cuadro por índice, TAMAÑO FIJO (los índices no tienen
     cap; no fingir)". El tamaño fijo es la regla 2 aplicada al tamaño: en el
     mapa de acciones el área ES un dato y un cuadro grande afirma algo; un
     índice no tiene con qué dimensionarse, así que todos miden igual y lo
     único que el cuadro afirma es su color.
     Las medidas son las del mockup: 3 columnas, 78px de alto, 2px de gap. */
  #mundo{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch}
  #mundo .tira{display:flex;gap:14px;align-items:center;height:30px;padding:0 2px;
    border-bottom:1px solid var(--linea);overflow-x:auto;white-space:nowrap;
    font-family:var(--mono);font-size:11px;scrollbar-width:none}
  #mundo .tira::-webkit-scrollbar{display:none}
  #mundo .tira b{color:var(--tenue);font-weight:500}
  #mundo .titular{padding:10px 2px 6px}
  #mundo .titular h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  #mundo .titular .sub{margin-top:2px;font-size:11px;color:var(--tenue)}
  #mundo .reg{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    padding:12px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:#9aa5b1;font-weight:600}
  #mundo .reg span{font-size:10px;letter-spacing:.04em;text-transform:none;
    color:#6b7785;font-weight:400;text-align:right}
  #mundo .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
  .c{box-sizing:border-box;height:78px;display:flex;flex-direction:column;
    justify-content:space-between;padding:8px 10px;color:#fff;border:1px solid #0a0a0a;
    position:relative;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .c .n{font-size:12px;font-weight:600;line-height:1.1}
  .c .r{font-size:10px;opacity:.85}
  .c .v{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1}
  /* EL % EN BLANCO SOBRE UN CUADRO DE COLOR.
     `qdPctTag` pinta el número de verde o rojo con un `style` en línea — que
     es lo correcto sobre fondo oscuro, como en la tira de arriba— pero acá el
     FONDO ya es verde o rojo, así que el número quedaba del mismo color que su
     cuadro y no se leía: el CAC 40, el Nasdaq, el IPC y el DAX en MXN salían en
     blanco… de invisible. El signo ya lo dice el fondo; el texto sólo tiene que
     ser legible, como en el mapa de EE.UU.
     El `!important` es contra un `style` en línea, que es la única manera de
     ganarle sin tocar el calculador compartido que usa toda la app. */
  .c .v .qd-pct, .c .v .qd-pct-per, .c .v .qd-pct *{color:#fff !important}
  .c .v .qd-pct{text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .c .l{font-family:var(--mono);font-size:10px;opacity:.85}
  .c.punteado{border-style:dashed;border-color:#555}
  @media (pointer:fine){ .c:hover{outline:1px solid rgba(255,255,255,.55);outline-offset:-1px} }
  #mundo .nota{padding:2px 0 4px;font-size:10px;color:#f59e0b}
  body[data-scroll="1"]{overflow-y:auto;overflow-x:hidden}
  body[data-scroll="1"] main{flex:0 0 auto}
  body[data-scroll="1"] #lienzo{position:relative;inset:auto;width:100%}
  .cuadro{position:absolute;overflow:hidden;border:1px solid #0a0a0a;border-radius:2px;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;padding:2px}
  .cuadro .sym{font-family:var(--mono);font-weight:600;line-height:1.05;
    color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
  .cuadro .val{font-family:var(--mono);line-height:1.05;color:rgba(255,255,255,.92)}
  /* La "ficha" de la hoja: iniciales en mono en vez de logo. Ver abrirHoja. */
  .ficha{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .iniciales{flex:0 0 auto;width:44px;height:44px;border-radius:6px;background:#1f1f1f;border:1px solid #333;
    display:flex;align-items:center;justify-content:center;font:600 13px var(--mono);color:#ddd;letter-spacing:.02em}
  .ficha h2{margin:0}
  /* Aviso de sistema: ámbar, porque no es un error rojo ni un dato gris. */
  #aviso{display:none;margin:6px 10px 0;padding:8px 10px;border-radius:6px;
    background:#241f00;border:1px solid #5a4a00;color:#e8d48a;font:12px var(--mono);line-height:1.5}
  .cuadro.punteado{border:1px dashed #555}
  /* La cabecera de sector del artboard 1: 14 px, tocable, y abre el sector. */
  .cabecera{position:absolute;display:flex;align-items:center;padding:0 6px;
    background:#141414;border:1px solid #0a0a0a;color:#cfcfcf;
    font-family:var(--mono);font-size:11px;letter-spacing:.3px;
    cursor:pointer;overflow:hidden;white-space:nowrap;-webkit-tap-highlight-color:transparent}
  /* La ruta vive en su propia franja. Flotando sobre el lienzo tapaba el
     cuadro de arriba a la izquierda, que además es el más grande del sector. */
  #ruta{display:none;padding:0 16px 8px}
  #ruta[data-visible="1"]{display:block}
  .volver{min-height:var(--tap);padding:0 14px;background:#151515;
    border:1px solid var(--linea);border-radius:6px;
    color:var(--texto);font-family:var(--mono);font-size:13px;cursor:pointer}
  #mas{padding:0 16px 6px;font-family:var(--mono);font-size:11px;color:var(--tenue)}
  footer{padding:8px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);
    font-family:var(--mono);font-size:10px;color:var(--tenue);line-height:1.5}
  .qd-pct{font-family:var(--mono);font-weight:600;white-space:nowrap}
  .qd-pct-per{margin-left:3px;font-size:.78em;font-weight:400;color:var(--tenue);vertical-align:.08em}
  /* La hoja. En móvil sube desde abajo; en escritorio es un panel lateral. */
  .hoja{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);
    border-top:1px solid var(--linea);border-radius:14px 14px 0 0;padding:14px 16px;
    padding-bottom:calc(16px + env(safe-area-inset-bottom));
    transform:translateY(102%);transition:transform .18s ease-out;max-height:70vh;overflow:auto}
  .hoja[data-abierta="1"]{transform:translateY(0)}
  .hoja h2{margin:0 0 2px;font-family:var(--mono);font-size:18px}
  .hoja .sub{color:var(--tenue);font-size:12px;margin-bottom:10px}
  .hoja dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:13px}
  .hoja dt{color:var(--tenue);font-family:var(--mono);font-size:11px}
  .hoja dd{margin:0;font-family:var(--mono)}
  .hoja .motivo{margin-top:10px;padding:8px 10px;border-left:2px solid #555;background:#161616;
    color:#ccc;font-size:12px;line-height:1.45}
  .cerrar{position:absolute;right:10px;top:10px;min-height:var(--tap);min-width:var(--tap);
    background:transparent;border:0;color:var(--tenue);font-size:22px;cursor:pointer}
  #tip{position:fixed;z-index:20;display:none;pointer-events:none;background:#161616;
    border:1px solid var(--linea);border-radius:6px;padding:6px 9px;font-family:var(--mono);font-size:11px}
  /* Hover SÓLO donde hay puntero fino. En táctil, :hover se queda pegado. */
  @media (pointer:fine){ .cuadro:hover{outline:1px solid rgba(255,255,255,.55);outline-offset:-1px} }
  @media (min-width:900px){
    header,nav,.toggle,#mas,footer{padding-left:24px;padding-right:24px}
    nav,.toggle{justify-content:flex-start}
    nav button,.toggle button{flex:0 0 auto;padding:0 18px}
    main{margin:10px 24px}
    .hoja{left:auto;right:0;top:0;bottom:0;width:380px;border-radius:0;border-left:1px solid var(--linea);
      border-top:0;max-height:none;transform:translateX(102%)}
    .hoja[data-abierta="1"]{transform:translateX(0)}
  }
</style>
</head>
<body>
<header>
  <div class="marca">/<b>mercado</b></div>
  <div class="chip" id="chip">—</div>
</header>

<nav role="tablist" aria-label="Mercado">
  <button role="tab" id="tab-us" data-mapa="us" aria-selected="true">EE.UU.</button>
  <button role="tab" id="tab-mx" data-mapa="mx" aria-selected="false">México</button>
  <button role="tab" id="tab-mundo" data-mapa="mundo" aria-selected="false">Mundo</button>
</nav>

<div class="toggle" id="toggle" role="group" aria-label="Periodo"></div>
<div class="toggle" id="moneda" role="group" aria-label="Moneda" hidden></div>

<div id="ruta"></div>
<main><div id="lienzo"></div><div id="mundo" hidden></div></main>
<div id="aviso"></div>
<div id="mas"></div>
<footer id="pie">cargando…</footer>

<aside class="hoja" id="hoja" aria-hidden="true">
  <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  <div id="hojaCuerpo"></div>
</aside>
<div id="tip"></div>

<script src="/qd-periods.js"></script>
<script src="/qd-treemap.js"></script>
<script src="/qd-mercados.js"></script>
<script src="/qd-pesos.js"></script>
<script src="/qd-mundo.js"></script>
<script>
(function(){
  'use strict';

  var SECTORES = {
    XLK:'Tecnología', XLF:'Finanzas', XLV:'Salud', XLY:'Consumo discrecional',
    XLP:'Consumo básico', XLE:'Energía', XLI:'Industriales', XLB:'Materiales',
    XLU:'Servicios públicos', XLRE:'Inmobiliario', XLC:'Comunicaciones'
  };
  var PERIODOS = ['1D','1S','1M','YTD'];
  var cache = {};           // mapa → payload
  var estado = leerUrl();

  // ── URL = ESTADO ──────────────────────────────────────────────────
  // Compartir la vista tiene que compartir LO QUE SE ESTÁ VIENDO. Y el botón
  // atrás del teléfono tiene que salir del sector, no de la página.
  function leerUrl(){
    var p = new URLSearchParams(location.search);
    var pm = p.get('mapa');
    var mapa = (pm==='mx' || pm==='mundo') ? pm : 'us';
    var per  = PERIODOS.indexOf(p.get('periodo'))>=0 ? p.get('periodo') : '1D';
    return { mapa:mapa, periodo:per, sector:p.get('sector')||null, symbol:p.get('symbol')||null,
             // Regla 9: `&moneda=usd|mxn`. En la URL se llama "usd" porque así
             // lo fijó el encargo; el botón dice "Local", porque un índice en
             // yenes no está en dólares — lo que el botón promete es "en su
             // moneda", y el otro es "en pesos".
             moneda: p.get('moneda')==='mxn' ? 'mxn' : 'usd' };
  }
  function escribirUrl(push){
    var p = new URLSearchParams();
    p.set('mapa', estado.mapa); p.set('periodo', estado.periodo);
    if(estado.mapa==='mundo') p.set('moneda', estado.moneda);
    if(estado.sector) p.set('sector', estado.sector);
    if(estado.symbol) p.set('symbol', estado.symbol);
    var url = location.pathname + '?' + p.toString();
    if(push) history.pushState(estado, '', url); else history.replaceState(estado, '', url);
  }
  window.addEventListener('popstate', function(){ estado = leerUrl(); render(); });

  // ── El % de un cuadro. ÚNICA vía: qdPeriodChange. ────────────────
  // YTD se arma con [ancla, último] porque el ancla es una FECHA y viaja
  // como punto; los demás periodos usan la ventana de cierres recientes.
  function cambio(c){
    if(estado.periodo==='YTD'){
      if(!c.ytd || !c.serie || !c.serie.length)
        return { pct:null, periodLabel:'YTD', motivo: c.ytd_motivo || 'no hay serie para este instrumento' };
      return qdPeriodChange([c.ytd, c.serie[c.serie.length-1]], 'YTD');
    }
    var r = qdPeriodChange(c.serie||[], estado.periodo);
    if(r.pct==null && !r.motivo) r.motivo = 'la serie no alcanza para este periodo';
    return r;
  }

  // La capitalización la formatea `qdCap` (qd-periods.js), en español y con la
  // moneda al lado. Acá había un `fmtCap` que decía "5.51 B" para 5.51
  // billones: "B" se lee como billion —mil millones— y eran mil veces más.
  // Y "790.8 mm" era una abreviatura que no existe fuera de esta pantalla.


  // ── Render ────────────────────────────────────────────────────────
  function render(){
    ['us','mx','mundo'].forEach(function(k){
      document.getElementById('tab-'+k).setAttribute('aria-selected', estado.mapa===k);
    });
    pintarToggle();
    pintarMonedaToggle();
    var d = cache[estado.mapa];
    if(!d){ cargar(estado.mapa); return; }
    // Mundo es una rejilla, no un treemap: los índices no tienen con qué
    // dimensionarse. Se reparte acá arriba para no meterle un `if` al
    // repartidor del mapa, que ya tiene bastante.
    document.getElementById('lienzo').hidden = (estado.mapa==='mundo');
    document.getElementById('mundo').hidden = (estado.mapa!=='mundo');
    if(estado.mapa==='mundo'){
      document.body.removeAttribute('data-scroll');
      pintarChipMundo(d);
      pintarAviso({});
      pintarPieMundo(d);
      document.getElementById('ruta').innerHTML = '';
      document.getElementById('mas').innerHTML = '';
      pintarMundo(d);
      if(estado.symbol) abrirHojaMundo(d, estado.symbol); else cerrarHoja(true);
      return;
    }
    pintarChip(d);
    // El "+N más" y el pie se pintan ANTES del mapa: los dos cambian de alto
    // al llenarse, y el treemap se dibuja con píxeles medidos. Al revés, el
    // mapa se calculaba contra una altura que después se encogía y los
    // cuadros de abajo terminaban encima del pie.
    pintarAviso(d);
    pintarPie(d);
    pintarRuta();
    pintarMapa(d);
    if(estado.symbol) abrirHoja(d, estado.symbol); else cerrarHoja(true);
  }

  function pintarToggle(){
    var t = document.getElementById('toggle');
    t.innerHTML = PERIODOS.map(function(p){
      return '<button type="button" data-per="'+p+'" aria-pressed="'+(p===estado.periodo)+'">'+p+'</button>';
    }).join('');
  }

  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  // EL CHIP LO MANDA EL DATO, NO EL CALENDARIO.
  // Decía "cierre del lunes" porque el lunes ya había cerrado, mientras la
  // tabla terminaba el viernes: rotulaba lo que DEBERÍA haber en vez de lo
  // que hay. Ahora, si el mercado está cerrado, el texto sale de la fecha
  // del último cierre que viajó.
  //
  // Y SI NO VIAJÓ NINGUNA, EL CHIP NO NOMBRA UN DÍA. Caer al texto del
  // calendario era el mismo pecado por la puerta de atrás: con el mapa roto
  // por un error de lectura, el chip seguía afirmando "cierre del lunes" —
  // un día que nada respaldaba. Sin dato se dice "cerrado" a secas y el
  // motivo va en el title, porque un hueco visible es mejor que un rótulo
  // seguro de sí mismo.
  function pintarChip(d){
    // `ultimoCierre` va al cálculo, no se re-deriva acá: el estado del mercado
    // lo decide `qd-mercados.js` y nadie más. Antes esta función volvía a armar
    // el texto "cierre del <día>" por su cuenta, o sea que había tres lugares
    // opinando —la tabla de `qd-periods`, ésta, y el chip nuevo—.
    var e = qdEstadoMercado(d.bolsa || estado.mapa, new Date(), { ultimoCierre: d.ultimo_cierre || null });
    var el = document.getElementById('chip');
    var txt, motivo = '';
    if(e.abierto){ txt = 'abierto'; }
    else if(d.ultimo_cierre){
      var dia = DIAS[new Date(d.ultimo_cierre+'T12:00:00Z').getUTCDay()];
      txt = 'cerrado · cierre del ' + dia;
      motivo = 'último cierre en la tabla: ' + d.ultimo_cierre;
    } else if(e.abierto === null){
      txt = e.texto; motivo = e.motivo || '';
    } else {
      txt = 'cerrado';
      motivo = 'no se sabe de qué día es el último cierre: no viajó con los datos';
    }
    el.className = 'chip' + (e.abierto ? ' abierto' : '');
    el.textContent = (e.abierto?'● ':'○ ') + e.etiqueta + ': ' + txt;
    el.title = motivo;
  }

  function cuadrosVisibles(d){
    // YA ES UN CUADRO el que tiene cap verificada o el que tiene precio: el
    // segundo se dibuja gris punteado con tamaño prestado y dice su causa al
    // tocarlo. Este filtro pedía `cap > 0` y por eso una emisora sin cap
    // verificada no salía gris: salía ausente, y su motivo no tenía dónde
    // aparecer. El que no tiene precio no es un cuadro todavía.
    var cs = (d.cuadros||[]).filter(function(c){
      return (Number.isFinite(c.cap) && c.cap>0) || Number.isFinite(c.precio);
    });
    if(estado.sector) return cs.filter(function(c){ return (c.sector||'—')===estado.sector; });
    return cs;
  }

  // Cuántas empresas se ven al abrir. En 390 px, ~30 dejan cuadros tocables;
  // en escritorio hay sitio para más.
  function cuantasVisibles(){
    return (window.innerWidth >= 900) ? 60 : 30;
  }

  // ── CUÁNDO EL MAPA SE VUELVE LARGO ──────────────────────────────────
  // Debajo de 600px de ancho no hay manera de que ~550 cuadros quepan en una
  // pantalla con letra legible: el más chico queda en 3px. Así que el alto pasa
  // a ser max(2000, ancho × FACTOR) y la página se recorre. El piso de 2000 y
  // la forma de la cuenta son de Lety (2026-09-29, del mockup, donde Main
  // medía 1,640px).
  //
  // EL FACTOR ES 12 Y NO 5, Y ESO NO ES LO QUE ELLA DIJO. Su pedido traía las
  // dos cosas: el número (×5) y el resultado esperado (menos de 20 cuadros sin
  // ticker de ~550). Medido en el Chromium con el universo a escala real:
  //
  //     factor   sin ticker   <14px de lado   ≥14px y mudos
  //        × 5      309/552            256              53
  //        × 8      216/552            153              63
  //       × 10      143/552             57              86
  //       × 12       75/552              9               0
  //
  // Con ×5 quedan 256 cuadros sin ticker, no menos de 20: el ×5 venía de un
  // mockup de ~40 cuadros y no escala a 550. Se eligió el resultado que ella
  // pidió por encima del número que propuso, y queda dicho acá y en el PR para
  // que volverlo a 5 sea una línea. 390px × 12 = 4,680px de mapa: se recorre,
  // que es justo lo que el modo largo vino a permitir.
  var ANCHO_MOVIL = 600, ALTO_MIN_MOVIL = 2000, FACTOR_ALTO_MOVIL = 12;
  function esMovil(){ return window.innerWidth < ANCHO_MOVIL; }
  // Expuestas para que la comprobación del Chromium calcule el alto esperado
  // con LAS MISMAS constantes en vez de repetirlas: un número copiado en dos
  // lados se desincroniza, y entonces la prueba mide lo que decía ayer. Lo que
  // queda pinchado allá no es el factor —ése puede moverse— sino el RESULTADO:
  // menos de 20 cuadros bajo los 14px de lado.
  window.QD_MAPA = { ANCHO_MOVIL: ANCHO_MOVIL, ALTO_MIN_MOVIL: ALTO_MIN_MOVIL, FACTOR_ALTO_MOVIL: FACTOR_ALTO_MOVIL };

  function pintarMapa(d){
    var l = document.getElementById('lienzo');
    l.innerHTML = '';
    // El modo largo se decide ANTES de medir: cambia de dónde sale el alto.
    var movil = esMovil();
    if(movil) document.body.setAttribute('data-scroll','1');
    else { document.body.removeAttribute('data-scroll'); l.style.height = ''; }
    var w = l.clientWidth, h = l.clientHeight;
    if(movil && w){
      h = Math.max(ALTO_MIN_MOVIL, Math.round(w * FACTOR_ALTO_MOVIL));
      l.style.height = h + 'px';
    }
    // Si el layout todavía no se aplicó (primer pintado), se reintenta en el
    // siguiente cuadro en vez de dibujar contra un cero.
    if(!w || !h){ requestAnimationFrame(function(){ pintarMapa(d); }); return; }
    var cs = cuadrosVisibles(d);
    if(!cs.length){
      // ROTO Y VACÍO NO SON LO MISMO, y el marcador lo dice: confundirlos fue
      // el bug. "No hay cuadros" manda a revisar la cosecha; un error de
      // lectura manda a revisar la consulta, y son dos búsquedas distintas.
      l.innerHTML = '<div class="aviso"' + (d.error ? ' data-error="1"' : '')
        + ' style="padding:24px;color:#888;font:12px var(--mono);line-height:1.5">'
        + (d.error ? esc(d.error) : 'no hay cuadros con capitalización medida para pintar')
        + (d.detalle ? '<br><br>' + esc(JSON.stringify(d.detalle)) : '')
        + '</div>';
      return;
    }
    if(estado.sector) pintarSector(l, cs, w, h);
    else pintarPrimerNivel(l, cs, w, h);
  }

  function pintarRuta(){
    var r = document.getElementById('ruta');
    r.innerHTML = '';
    r.setAttribute('data-visible', estado.sector ? '1' : '0');
    if(!estado.sector) return;
    var b = document.createElement('button');
    b.className = 'volver'; b.type = 'button';
    b.textContent = '← ' + (SECTORES[estado.sector]||estado.sector);
    b.addEventListener('click', function(){ estado.sector=null; estado.symbol=null; escribirUrl(true); render(); });
    r.appendChild(b);
  }

  // ── PRIMER NIVEL: TODAS las empresas, agrupadas bajo su sector ────
  // No hay "+N más". Un sector cuyas empresas no entraban al top salía como
  // "+55 más · 100%": un sector entero sin una sola empresa, y un cuadro de
  // resto que era el 100% de lo que decía resumir. El agregado había dejado
  // de resumir para tapar.
  function pintarPrimerNivel(l, cs, w, h){
    var ALTO_CABECERA = 14;
    var grupos = agrupaPorSector(cs).grupos;
    var rects = squarify(grupos.map(function(g){ return { key:g.sector, value:g.cap_total, grupo:g }; }), { x:0, y:0, w:w, h:h });
    var frag = document.createDocumentFragment();

    rects.forEach(function(r){
      var g = r.item.grupo;
      // Sin sitio para la cabecera, el sector se dibuja sin ella: media
      // cabecera recortada no dice el nombre del sector, lo insinúa.
      var conCabecera = r.h >= ALTO_CABECERA + 12;
      if(conCabecera){
        var cab = document.createElement('div');
        cab.className = 'cabecera';
        cab.style.cssText = 'left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+ALTO_CABECERA+'px';
        var nom = SECTORES[g.sector] || g.sector;
        // Regla 3: si no cabe entero, abreviatura; nunca cortado a la mitad.
        var etq = etiquetaQueCabe(candidatosSector(nom), r.w, 11);
        cab.textContent = etq || '';
        cab.title = nom;
        cab.setAttribute('aria-label', nom);
        cab.addEventListener('click', function(){ entrarASector(g.sector); });
        frag.appendChild(cab);
      }
      var y0 = r.y + (conCabecera ? ALTO_CABECERA : 0);
      var h0 = r.h - (conCabecera ? ALTO_CABECERA : 0);

      var items = g.items.map(function(c){ var x=cambio(c);
        return { key:c.symbol, value:c.area, cuadro:c, pct:x.pct, motivo:x.motivo,
                 cap_verificada:c.cap_verificada }; });
      squarify(items, { x:r.x, y:y0, w:r.w, h:h0 }).forEach(function(q){
        frag.appendChild(cuadroEmpresa(q, false));
      });
    });
    l.appendChild(frag);
  }

  // ── SEGUNDO NIVEL: un sector completo ─────────────────────────────
  function pintarSector(l, cs, w, h){
    // Mismo criterio de área que el primer nivel —incluido el tamaño fijo de
    // las grises— para que un cuadro no cambie de sentido al entrar al sector.
    var g = agrupaPorSector(cs).grupos[0];
    var items = (g ? g.items : []).map(function(c){ var x=cambio(c);
      return { key:c.symbol, value:c.area, cuadro:c, pct:x.pct, motivo:x.motivo,
               cap_verificada:c.cap_verificada }; });
    var frag = document.createDocumentFragment();
    squarify(items, { x:0, y:0, w:w, h:h }).forEach(function(q){ frag.appendChild(cuadroEmpresa(q, false)); });
    l.appendChild(frag);
  }

  function entrarASector(sector){
    estado.sector = sector; estado.symbol = null; escribirUrl(true); render();
  }

  function cuadroEmpresa(r, esSector){
    var it = r.item;
    var div = document.createElement('div');
    // Dos motivos distintos para el mismo punteado, y los dos son "falta un
    // dato": sin % no se puede colorear, y sin cap verificada el TAMAÑO es
    // prestado. En el segundo caso el % se calla a propósito: pintarlo sobre
    // un cuadro cuyo tamaño no afirmamos lo haría pasar por un cuadro entero.
    var capGris = it.cap_verificada === false;
    var incompleto = capGris || !Number.isFinite(it.pct);
    div.className = 'cuadro' + (incompleto ? ' punteado' : '');
    div.style.cssText = 'left:'+r.x+'px;top:'+r.y+'px;width:'+r.w+'px;height:'+r.h+'px;background:'
      + (capGris ? COLOR_SIN_DATO : colorDe(it.pct));
    div.setAttribute('aria-label', it.key);

    var txt = '—';
    if(!capGris && Number.isFinite(it.pct)){
      var r1 = Math.round(it.pct*10)/10;
      txt = r1===0 ? '0.0%' : ((r1>0?'+':'')+r1.toFixed(1)+'%');
    }
    // EL TEXTO SÓLO SI CABE. Un cuadro de 3px existe, se toca y va sin letra
    // — como en Finviz. Nunca se recorta a mitad de palabra: media palabra no
    // es información, es ruido con forma de información.
    // 18 → 8: la fuente escala con el cuadro. Con la talla fija de 13 los
    // cuadros grandes desperdiciaban sitio y se iban sin %.
    // En celular el ticker puede bajar a 6px: con el mapa largo hay cuadros que
    // sólo caben así, y un cuadro sin ticker es un color que no se puede
    // nombrar. El % conserva su piso (`fontMinDos`), porque un número de 6px no
    // se lee: se adivina.
    var e = etiquetaCuadro(r.w, r.h, {
      ticker: it.key, pct: txt, fontPx: 18,
      fontMin: esMovil() ? 6 : 8, fontMinDos: 8,
    });
    if(e.ticker){
      var html = '<div class="sym" style="font-size:'+e.font+'px">'+esc(e.ticker)+'</div>';
      if(e.pct) html += '<div class="val" style="font-size:'+e.font_pct+'px">'+esc(e.pct)+'</div>';
      div.innerHTML = html;
    }

    div.addEventListener('click', function(){
      estado.symbol = it.key; escribirUrl(true); abrirHoja(cache[estado.mapa], it.key);
    });
    if(window.matchMedia && window.matchMedia('(pointer:fine)').matches){
      div.addEventListener('mousemove', function(ev){ mostrarTip(ev, it, false); });
      div.addEventListener('mouseleave', ocultarTip);
    }
    return div;
  }

  function mostrarTip(ev, it){
    var t = document.getElementById('tip');
    var etq = it.key;
    t.innerHTML = '<div>'+esc(etq)+'</div>'
      + '<div>'+qdPctTag(it.pct, estado.periodo, { motivo: it.motivo })+'</div>';
    t.style.display='block';
    var x = Math.min(ev.clientX+12, window.innerWidth-t.offsetWidth-8);
    t.style.left = x+'px'; t.style.top = Math.max(8, ev.clientY-40)+'px';
  }
  function ocultarTip(){ document.getElementById('tip').style.display='none'; }

  // EL AVISO DE SISTEMA, que no es lo mismo que un dato que falta. Un mapa
  // gris porque la cap no se auditó todavía manda a correr un job; uno gris
  // porque la cosecha está atrasada manda a otro lado. Decir sólo "N cuadros
  // sin dato completo" los confunde y hace buscar el bug donde no está.
  function pintarAviso(d){
    var el = document.getElementById('aviso');
    if(!el) return;
    var a = d.auditoria && d.auditoria.aviso;
    el.textContent = a || '';
    el.style.display = a ? 'block' : 'none';
  }

  function pintarPie(d){
    var f = d.fuente || {};
    var partes = [];
    partes.push('fuente: ' + (f.series || '—'));
    if(d.cosecha && d.cosecha.ultima_fecha) partes.push('último cierre: ' + d.cosecha.ultima_fecha);
    if(d.cosecha && d.cosecha.alerta) partes.push('⚠ cosecha atrasada ' + d.cosecha.sesiones_de_atraso + ' sesiones');
    // LO QUE SE CUENTA ACÁ SON CUADROS, y un símbolo sin precio no es un
    // cuadro todavía: no se dibuja, no tiene %, no hay nada que mirar. El
    // conteo decía "277 cuadros sin dato completo" sumándole los 250 sin
    // serie, y mandaba a buscar 277 problemas donde había 25.
    var f2 = d.faltantes || {};
    if(f2.sin_cap_verificada) partes.push(f2.sin_cap_verificada + ' sin capitalización verificada');
    if(f2.sin_periodo) partes.push(f2.sin_periodo + ' sin periodo');
    partes.push('generado ' + new Date(d.generado_en).toLocaleString('es-MX'));
    document.getElementById('pie').textContent = partes.join(' · ');
  }

  // ── La hoja ───────────────────────────────────────────────────────
  function abrirHoja(d, symbol){
    var c = (d.cuadros||[]).find(function(x){ return x.symbol===symbol; });
    if(!c) return;
    var r = cambio(c);
    var filas = [
      ['cambio', qdPctTag(r.pct, estado.periodo, { motivo: r.motivo })],
      ['precio', c.precio!=null ? fmtPrice(c.precio) : '—'],
      ['al cierre de', c.fecha_precio || '—'],
      ['capitalización', esc(qdCap(c.cap, d.bolsa === 'mx' ? 'MXN' : 'USD'))],
      ['fuente de la cap', esc(c.cap_fuente || '—')],
      ['sector', esc(SECTORES[c.sector]||c.sector||'—')]
    ];
    if(c.cap_medida_en) filas.push(['cap medida el', esc(c.cap_medida_en)]);
    if(c.serie_liquida) filas.push(['serie', esc(c.serie_liquida)]);
    if(c.acciones_por_unidad && c.acciones_por_unidad!==1) filas.push(['acciones por unidad', String(c.acciones_por_unidad)]);
    if(c.etiqueta) filas.push(['verificación', esc(c.etiqueta)]);
    // EN QUÉ ESTADO ESTÁ LA CONSULTA A EDGAR. Sólo se muestra cuando no trajo
    // conteo, que es cuando importa: el 2026-09-26 la hoja decía "EDGAR no dio
    // acciones" de ORCL sin que EDGAR hubiera sido consultado, y eso manda a
    // revisar la fuente en lugar del job que murió antes de preguntarle.
    if(c.cap_edgar_estado && c.cap_edgar_estado!=='consultado_con_dato'){
      filas.push(['consulta a EDGAR', c.cap_edgar_estado==='no_consultado'
        ? 'pendiente' : 'hecha, y no trajo acciones']);
    }
    if(c.cap_portada_edgar) filas.push(['portada del 10-Q', esc(c.cap_portada_edgar)]);
    // NO es el largo de la historia: es lo que la consulta del mapa trajo
    // (los cierres recientes más el ancla de fin de año). Decir "puntos de
    // serie: 24" hacía parecer que el YTD salía de 24 días, cuando sale del
    // ancla que viene EN esos 24.
    filas.push(['cierres traídos', String(c.puntos||0) + (c.ytd ? ' (incluye el ancla de fin de año)' : '')]);

    // La nota va junto al motivo: un cuadro VERIFICADO puede tener algo que
    // declarar —"la cap declarada se descartó porque dos conteos de acciones
    // coinciden"— y eso es procedencia, no un error. Sin esto, la pantalla
    // mostraría el tamaño sin decir que se descartó un dato de la fuente.
    var motivo = c.motivo || r.motivo || c.ytd_motivo;
    if(c.cap_nota) motivo = motivo ? (c.cap_nota + ' · ' + motivo) : c.cap_nota;
    document.getElementById('hojaCuerpo').innerHTML =
      // LAS INICIALES, NO UN LOGO. No tenemos fuente de logos, y una que
      // dependa de terceros siempre va a tener huecos: un ícono roto dice
      // "esto está mal hecho" sobre una empresa que no tiene nada de malo.
      // Un cuadro con el ticker en mono nunca falta y nunca miente.
      '<div class="ficha"><div class="iniciales">'+esc(String(c.symbol||'').slice(0,4))+'</div>'
      + '<div><h2>'+esc(c.symbol)+'</h2><div class="sub">'+esc(c.nombre||'')+'</div></div></div>'
      + '<dl>' + filas.map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('') + '</dl>'
      // Regla 2: el dato que falta dice POR QUÉ falta.
      + (motivo ? '<div class="motivo">'+esc(motivo)+'</div>' : '');
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','1'); h.setAttribute('aria-hidden','false');
  }
  function cerrarHoja(silencioso){
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','0'); h.setAttribute('aria-hidden','true');
    if(!silencioso && estado.symbol){ estado.symbol=null; escribirUrl(true); }
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // ═══════════════════════════════════════════════════════════════════
  // MUNDO (artboard 4) — rejilla por región, tamaño fijo, color por %
  //
  // El % de cada cuadro sale de `qdPeriodChange` sobre la serie que manda el
  // endpoint (regla 1), incluido YTD: la serie es de un año, así que el ancla
  // de fin de año la encuentra el mismo calculador y no hace falta que el
  // servidor la elija —como sí hace falta en el mapa de acciones, donde sólo
  // viajan 22 cierres para no mandar 75,000 puntos a un teléfono—.
  //
  // El estado es POR BOLSA, no global: el Nikkei cerrado y el Bovespa abierto
  // caben en la misma pantalla. Y las horas de los encabezados van en hora de
  // MÉXICO, que es la decisión del mockup: "Asia · abre lun 18:00 CT".
  // ═══════════════════════════════════════════════════════════════════
  var BOLSAS_POR_REGION = { america:[], europa:[], asia:[], otros:[] };

  function cambioLocal(c){
    var r = qdPeriodChange(c.serie || [], estado.periodo);
    if(r.pct==null && !r.motivo) r.motivo = 'la serie no alcanza para este periodo';
    return r;
  }

  // ── R2(c): EL RENDIMIENTO EN PESOS ─────────────────────────────────
  // La aritmética vive en `qd-pesos.js` y recibe DOS rendimientos ya
  // calculados con `qdPeriodChange` —el del activo y el de su moneda contra el
  // peso—, nunca precios: calcularlo desde precios haría dos implementaciones
  // del ancla del periodo, que es el bug que la regla 1 previene.
  function rendimientoDeSerie(sym, d){
    var s = d && d.data && d.data[sym] && d.data[sym].series;
    if(!s || s.length < 2) return null;
    var r = qdPeriodChange(s, estado.periodo);
    return Number.isFinite(r.pct) ? r.pct : null;
  }

  function pctDelFix(d){
    // El FIX de Banxico, en el MISMO periodo. Serie diaria: `qdPeriodChange`
    // la ancla por fecha igual que cualquier otra.
    var f = d && d.fix && Array.isArray(d.fix.serie) ? d.fix.serie : null;
    if(!f || f.length < 2) return null;
    var r = qdPeriodChange(f, estado.periodo);
    return Number.isFinite(r.pct) ? r.pct : null;
  }

  function enPesosDe(c, d){
    var moneda = c.moneda || c.moneda_esperada;
    var cruce = MONEDAS[moneda];
    var usdPorUnidad = null;
    if(cruce){
      var p = rendimientoDeSerie(cruce.symbol, d);
      if(p != null){
        // `EURUSD=X` son DÓLARES POR EURO: para el cruce hace falta la forma
        // inversa, euros por dólar. Confundirlas invierte el signo.
        usdPorUnidad = cruce.invertir ? ((1 / (1 + p/100)) - 1) * 100 : p;
      }
    }
    return enPesos({
      pctLocal: cambioLocal(c).pct,
      moneda: moneda,
      usdMxnPct: pctDelFix(d),
      usdPorUnidadPct: usdPorUnidad,
      fix: d && d.fix ? { serie:'SF43718', fecha:d.fix.fecha, valor:d.fix.valor } : null,
    });
  }

  function estadoDeCuadro(c){
    if(c.es24h) return estado24h();
    // `fecha_dato`, no `ultimo_cierre`: cuando el precio de hoy ya entró a la
    // serie, el número que se ve es de hoy y el estado tiene que salir de la
    // MISMA fecha. Asia decía "cierre del lunes" con los cuadros en martes.
    try { return estadoDeBolsa(c.bolsa, new Date(), { ultimoCierre: c.fecha_dato || c.ultimo_cierre }); }
    catch(e){ return { etiqueta: 'sin horario declarado', abierta: false, estado: 'desconocida' }; }
  }

  /** Lo que se pinta grande y lo que se pinta chico, según moneda y tipo. */
  function lineasDeCuadro(c, d){
    var local = cambioLocal(c);
    if(estado.moneda === 'mxn'){
      var mx = enPesosDe(c, d);
      return {
        pct: mx.pct,
        grande: qdPctTag(mx.pct, estado.periodo, { motivo: mx.motivo }),
        // El local queda chico, como en el mockup: el número grande es el que
        // el toggle promete y el chico es de dónde salió.
        chico: 'local ' + (Number.isFinite(local.pct) ? (local.pct>=0?'+':'') + local.pct.toFixed(1) + '%' : '—'),
        motivo: mx.motivo || local.motivo || null,
        fuente: mx.fuente || null,
      };
    }
    return {
      pct: local.pct,
      grande: qdPctTag(local.pct, estado.periodo, { motivo: local.motivo }),
      // En moneda local la línea chica lleva el NIVEL, no el país: el país ya
      // está arriba y repetirlo desperdicia el único renglón que queda. Para
      // Bitcoin y el oro va con "$" porque son dólares; para un índice va sin
      // símbolo, porque 45,800 puntos del Nikkei no son pesos ni dólares.
      // LA FECHA VA SIEMPRE, no sólo cuando el dato es viejo. Ponerla sólo a
      // los atrasados dejaba sin fecha justo a los más frescos —los de Asia,
      // que ya traían el precio de hoy— y obligaba a saber la regla para leer
      // la pantalla. Cada número dice de cuándo es.
      chico: (c.prefijo || '') + fmtPrice(c.precio)
        + (c.precio_fecha ? ' · ' + c.precio_fecha.slice(5) : ''),
      motivo: local.motivo || null,
      fuente: 'yahoo:v8/chart',
    };
  }

  function pintarMundo(d){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    var cont = document.getElementById('mundo');
    var html = '';

    // ── La tira de arriba: cinco índices corriendo ────────────────────
    html += '<div class="tira">' + TIRA.map(function(sym){
      var c = null;
      m.regiones.forEach(function(r){ r.cuadros.forEach(function(x){ if(x.symbol===sym) c = x; }); });
      if(!c) return '';
      var l = lineasDeCuadro(c, d);
      var corto = { '^GSPC':'SPX', '^MXX':'IPC', '^N225':'NIKKEI', '^KS11':'KOSPI', '^GDAXI':'DAX' }[sym] || sym;
      return '<span><b>' + esc(corto) + '</b> ' + l.grande + '</span>';
    }).join('') + '</div>';

    // ── El titular, con el día y el estado en hora de México ──────────
    var hoy = new Date();
    var diaTxt = hoy.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short', timeZone:'America/Mexico_City' });
    var reg = {};
    ['america','europa','asia'].forEach(function(k){
      var cierres = {};
      var claves = [];
      m.regiones.forEach(function(r){ if(r.clave!==k) return; r.cuadros.forEach(function(c){
        if(c.es24h) return;
        claves.push(c.bolsa); cierres[c.bolsa] = c.fecha_dato || c.ultimo_cierre;
      }); });
      BOLSAS_POR_REGION[k] = claves;
      reg[k] = estadoDeRegion(claves, hoy, { cierres: cierres });
    });
    reg.otros = { etiqueta: '24/7 · abierto' };
    var sub = diaTxt + (reg.america && reg.america.etiqueta ? ' · ' + reg.america.etiqueta : '')
      + (reg.asia && reg.asia.proxima ? ' · Asia ' + reg.asia.proxima.etiqueta : '');
    html += '<div class="titular"><h1>El mundo, ahora</h1><div class="sub">' + esc(sub) + '</div></div>';

    if(estado.moneda === 'mxn'){
      var fx = d && d.fix;
      html += '<div class="nota">' + (fx && fx.fecha
        ? 'Rendimiento en pesos: índice local convertido con su tipo de cambio del periodo · FIX del ' + esc(fx.fecha)
        : 'Rendimiento en pesos: NO disponible — ' + esc((fx && fx.motivo) || 'no llegó el FIX de Banxico')) + '</div>';
    }

    // ── Las cuatro regiones ───────────────────────────────────────────
    m.regiones.forEach(function(r){
      if(!r.cuadros.length && !r.aviso) return;
      var e = reg[r.clave] || {};
      html += '<div class="reg">' + esc(r.nombre) + '<span>'
        + esc(r.clave==='america' ? (e.etiqueta||'') : (e.etiqueta||''))
        + (r.aviso ? ' · ' + esc(r.aviso) : '') + '</span></div>';
      html += '<div class="grid">';
      r.cuadros.forEach(function(c){
        var l = lineasDeCuadro(c, d);
        var sinPct = !Number.isFinite(l.pct);
        html += '<div class="c' + (sinPct ? ' punteado' : '') + '"'
          + ' style="background:' + (sinPct ? COLOR_SIN_DATO : colorDe(l.pct)) + '"'
          + ' data-sym="' + esc(c.symbol) + '" role="button" tabindex="0"'
          + ' aria-label="' + esc(c.nombre) + '">'
          + '<div><div class="n">' + esc(c.nombre) + '</div>'
          + '<div class="r">' + esc(c.pais || '') + '</div></div>'
          + '<div><div class="v">' + l.grande + '</div>'
          + '<div class="l">' + esc(l.chico) + '</div></div>'
          + '</div>';
      });
      html += '</div>';
    });

    // Lo que no se pudo pintar se DICE, con su causa (regla 2).
    if(m.faltantes.length){
      html += '<div class="reg">sin dato<span>' + m.faltantes.length + ' de '
        + (m.faltantes.length + m.regiones.reduce(function(a,r){ return a + r.cuadros.length; },0)) + '</span></div>'
        + '<div class="nota">'
        + m.faltantes.map(function(f){ return esc(f.nombre + ' (' + f.symbol + '): ' + f.motivo); }).join('<br>')
        + '</div>';
    }
    cont.innerHTML = html;
  }

  // El chip de arriba en Mundo no puede ser de una bolsa: hay trece en
  // pantalla. Dice cuántas están abiertas, y el detalle vive en cada región.
  function pintarChipMundo(d){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    // CUENTA BOLSAS, NO CUADROS. Decía "5 de 14 bolsas abiertas" contando
    // índices: el S&P 500 y el Nasdaq 100 son DOS cuadros y UNA bolsa, y Nueva
    // York no abre dos veces. Se cuenta por clave de bolsa, sin repetir.
    var bolsas = {};
    m.regiones.forEach(function(r){ r.cuadros.forEach(function(c){
      if(c.es24h || !c.bolsa) return;
      if(bolsas[c.bolsa] === undefined) bolsas[c.bolsa] = estadoDeCuadro(c).abierta === true;
    }); });
    var claves = Object.keys(bolsas);
    var total = claves.length;
    var abiertas = claves.filter(function(k){ return bolsas[k]; }).length;
    var el = document.getElementById('chip');
    el.className = 'chip' + (abiertas > 0 ? ' abierto' : '');
    el.textContent = (abiertas > 0 ? '● ' : '○ ')
      + (total ? abiertas + ' de ' + total + ' bolsas abiertas' : 'sin bolsas con dato');
    el.title = 'el estado de cada bolsa va en el encabezado de su región: con trece husos, un solo chip mentiría en alguno';
  }

  function pintarMonedaToggle(){
    var t = document.getElementById('moneda');
    t.hidden = (estado.mapa !== 'mundo');
    if(t.hidden) return;
    t.innerHTML = [['usd','Local'],['mxn','MXN']].map(function(x){
      return '<button type="button" data-mon="'+x[0]+'" aria-pressed="'+(x[0]===estado.moneda)+'">'+x[1]+'</button>';
    }).join('');
  }

  function pintarPieMundo(d){
    var gen = d && d.generated_at ? new Date(d.generated_at) : null;
    document.getElementById('pie').textContent =
      'fuente: yahoo v8/chart vía /api/macro-markets · índices con retraso · el estado (abierto/cerrado) es por bolsa, no global'
      + (estado.moneda==='mxn' && d && d.fix && d.fix.fecha ? ' · pesos con el FIX de Banxico del ' + d.fix.fecha : '')
      + (gen && Number.isFinite(gen.getTime()) ? ' · generado ' + gen.toLocaleString('es-MX') : '')
      + ' · Información, no asesoría';
  }

  function abrirHojaMundo(d, symbol){
    var m = armaMundo({ data: (d && d.data) || {}, fix: (d && d.fix) || null, omitidos: (d && d.omitidos) || {} });
    var c = null;
    m.regiones.forEach(function(r){ r.cuadros.forEach(function(x){ if(x.symbol===symbol) c = x; }); });
    if(!c) return;
    var local = cambioLocal(c);
    var mx = enPesosDe(c, d);
    var e = estadoDeCuadro(c);
    var filas = [
      ['cambio local', qdPctTag(local.pct, estado.periodo, { motivo: local.motivo })],
      // La línea que el encargo pide que se active en la hoja.
      [ETIQUETA_PESOS, qdPctTag(mx.pct, estado.periodo, { motivo: mx.motivo })],
      ['nivel', esc((c.prefijo||'') + fmtPrice(c.precio)) + (c.moneda ? ' ' + esc(c.moneda) : '')],
      ['nivel de', esc(c.precio_fecha || '—') + (c.precio_es_de_hoy ? ' (precio de mercado)' : ' (último cierre)')],
      ['país', esc(c.pais || '—')],
      ['bolsa', esc(c.es24h ? 'cotiza 24h' : (e.nombre || c.bolsa))],
      ['estado', esc(e.etiqueta) + (e.hora_local ? ' · ' + esc(e.hora_local) + ' local' : '')],
      ['último cierre', esc(c.ultimo_cierre || '—')],
      ['fuente', esc(c.fuente)],
      ['cierres traídos', String(c.puntos || 0)]
    ];
    // Cada número en pesos dice qué FIX usó y de qué fecha (regla 3).
    if(mx.fuente) filas.push(['fuente del peso', esc(mx.fuente)]);
    if(c.moneda_discrepa){
      filas.push(['moneda', esc(c.moneda) + ' (se esperaba ' + esc(c.moneda_esperada) + ')']);
    }
    document.getElementById('hojaCuerpo').innerHTML =
      '<div class="ficha"><div class="iniciales">' + esc(String(c.symbol).replace(/[^A-Za-z0-9]/g,'').slice(0,4)) + '</div>'
      + '<div><h2>' + esc(c.nombre) + '</h2><div class="sub">' + esc(c.symbol) + '</div></div></div>'
      + '<dl>' + filas.map(function(f){ return '<dt>'+f[0]+'</dt><dd>'+f[1]+'</dd>'; }).join('') + '</dl>'
      + (mx.motivo ? '<div class="motivo">' + esc(mx.motivo) + '</div>' : '');
    var h = document.getElementById('hoja');
    h.setAttribute('data-abierta','1'); h.setAttribute('aria-hidden','false');
  }

  // Tap en un cuadro de Mundo → la hoja, igual que en el mapa.
  document.getElementById('mundo').addEventListener('click', function(ev){
    var t = ev.target.closest('.c'); if(!t) return;
    estado.symbol = t.dataset.sym; escribirUrl(true); abrirHojaMundo(cache.mundo, estado.symbol);
  });
  document.getElementById('moneda').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-mon]'); if(!b) return;
    estado.moneda = b.dataset.mon; escribirUrl(true); render();
  });

  // ── Carga: UNA petición por mapa, y el toggle no vuelve a pedir ───
  var NOMBRE_MAPA = { us:'EE.UU.', mx:'México', mundo:'Mundo' };

  function cargar(mapa){
    document.getElementById('pie').textContent = 'cargando ' + (NOMBRE_MAPA[mapa]||mapa) + '…';
    // Regla 7: un endpoint batch por mapa. Mundo no estrena uno — usa el que ya
    // existe y ya está cacheado para toda la base de usuarios, que además no
    // devuelve ningún porcentaje pre-cocinado (regla 1).
    if(mapa==='mundo'){
      // DOS batches, no uno por cuadro: los índices y el FIX. La regla 7
      // prohíbe un fetch por cuadro, y el toggle de moneda NO vuelve a pedir
      // nada — el FIX viaja desde la primera carga, con su fecha.
      //
      // El FIX se pide aparte porque es otra fuente: Yahoo da el dólar de
      // mercado (`MXN=X`, que es el CUADRO) y Banxico da el FIX, que es el
      // número oficial con el que se convierte. Mezclarlos sería pintar una
      // conversión y atribuírsela a la otra fuente.
      Promise.all([
        fetch('/api/macro-markets').then(function(r){ return r.json(); }),
        fetch('/api/banxico?series=USDMXN&days=420')
          .then(function(r){ return r.json(); })
          .catch(function(e){ return { error: e.message }; })
      ]).then(function(rs){
        var d = rs[0] || {};
        var b = rs[1] || {};
        var pts = (b && Array.isArray(b.points)) ? b.points : null;
        if(pts && pts.length >= 2){
          d.fix = {
            fecha: b.latest ? b.latest.date : pts[pts.length-1].date,
            valor: b.latest ? b.latest.value : pts[pts.length-1].value,
            // A la forma que `qdPeriodChange` entiende. Un solo calculador,
            // también para el tipo de cambio.
            serie: pts.map(function(x){ return { t: Date.parse(x.date + 'T12:00:00Z')/1000, c: x.value }; })
          };
        } else {
          // Sin FIX no hay rendimiento en pesos, y se dice: nunca se convierte
          // con el dólar de mercado como sustituto silencioso.
          d.fix = { motivo: 'no llegó el FIX de Banxico' + (b && b.error ? ' (' + b.error + ')' : '') };
        }
        cache.mundo = d; render();
      }).catch(function(e){
        document.getElementById('pie').textContent = 'no se pudo cargar Mundo: ' + e.message;
      });
      return;
    }
    fetch('/api/mercado-mapa?map='+encodeURIComponent(mapa))
      .then(function(r){ return r.json(); })
      .then(function(d){ cache[mapa]=d; render(); })
      .catch(function(e){
        document.getElementById('pie').textContent = 'no se pudo cargar el mapa: ' + e.message;
      });
  }

  // ── Eventos ───────────────────────────────────────────────────────
  document.querySelector('nav').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-mapa]'); if(!b) return;
    estado.mapa = b.dataset.mapa; estado.sector=null; estado.symbol=null;
    escribirUrl(true); render();
  });
  document.getElementById('toggle').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-per]'); if(!b) return;
    estado.periodo = b.dataset.per; escribirUrl(true); render();
  });
  document.getElementById('cerrar').addEventListener('click', function(){ cerrarHoja(); });
  document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') cerrarHoja(); });
  var rt; window.addEventListener('resize', function(){
    clearTimeout(rt); rt=setTimeout(function(){ if(cache[estado.mapa]) pintarMapa(cache[estado.mapa]); }, 120);
  });

  escribirUrl(false);
  render();
})();
</script>
</body>
</html>
