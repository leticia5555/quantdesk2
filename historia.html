<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>HISTORIA — QuantDesk · la empresa contada por sus documentos</title>
<meta name="description" content="Siete preguntas sobre una empresa, contestadas solo con filings de la SEC. Cada dato con su accession, y lo que no cubrimos dicho en la pantalla."/>
<meta name="theme-color" content="#050505"/>
<meta property="og:title" content="HISTORIA — QuantDesk"/>
<meta property="og:description" content="La historia de una empresa en documentos citables. Sin narración, sin veredicto."/>
<meta property="og:type" content="website"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#050505; --bg1:#0d0d0d; --bg2:#141414;
  --border:#1e1e1e; --border2:#2a2a2a;
  --text:#f0ede8; --text2:#8a8a82; --text3:#4a4a44;
  --green:#00c97d; --red:#ff4545; --blue:#4a9eff; --amber:#ffb347;
  --purple:#a78bfa; --gold:#ffd35a;
  --mono:'Space Mono',monospace; --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
a{color:inherit;}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 72px;}

header{padding:22px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.14em;}
.logo span{color:var(--purple);}
.hero{padding:6px 0 14px;border-bottom:1px solid var(--border);}
.hero h1{font-family:var(--mono);font-size:clamp(22px,7vw,30px);font-weight:700;line-height:1.14;letter-spacing:-.01em;}
.hero h1 .accent{color:var(--purple);}
.hero p{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.5;}

.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 2px;align-items:center;}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text2);text-transform:uppercase;
  background:var(--bg1);border:1px solid var(--border2);border-radius:20px;padding:7px 13px;cursor:pointer;
  -webkit-user-select:none;user-select:none;}
.pill.on{color:#000;background:var(--purple);border-color:var(--purple);font-weight:700;}
input.tick{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--text);
  background:var(--bg1);border:1px solid var(--border2);border-radius:20px;padding:7px 14px;width:132px;outline:none;}
input.tick:focus{border-color:var(--purple);}

/* PERÍMETRO — lo que NO cubrimos, arriba y siempre visible. */
.perimetro{background:var(--bg1);border:1px solid var(--border2);border-left:3px solid var(--text3);
  border-radius:8px;padding:12px 14px;margin:16px 0;}
.perimetro h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.perimetro li{font-size:12px;color:var(--text2);line-height:1.55;margin-left:16px;margin-bottom:3px;}

.cobertura{background:rgba(255,179,71,.07);border:1px solid rgba(255,179,71,.34);border-left:3px solid var(--amber);
  border-radius:8px;padding:12px 14px;margin:16px 0;}
.cobertura b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:6px;}
.cobertura p{font-size:12.5px;color:var(--text2);line-height:1.55;}

.emisor{font-family:var(--mono);font-size:11px;color:var(--text2);margin:14px 0 2px;line-height:1.7;}
.emisor .cik{color:var(--text3);}

/* LOS PANELES DE LAS PREGUNTAS — contexto, no una segunda lista.
   Los documentos viven UNA vez, en la línea. Acá va lo que la pregunta
   agrega: cuántos hay, qué no cubrimos, y —en la 3 y la 2— la serie y los
   episodios, que no son documentos sueltos. */
.sec{border-top:1px solid var(--border);padding:20px 0 6px;}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.sec-num{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--purple);letter-spacing:.08em;}
.sec-head h2{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.25;}
.badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:12px;
  border:1px solid var(--border2);color:var(--text3);white-space:nowrap;}
.badge.ok{color:var(--green);border-color:rgba(0,201,125,.35);}
.badge.vacio{color:var(--text2);}
.badge.nocubre{color:var(--amber);border-color:rgba(255,179,71,.35);}
.badge.fuera{color:var(--blue);border-color:rgba(74,158,255,.35);}

/* Los tres vacíos se ven DISTINTO: el que dice algo de la empresa, el que
   dice algo de nosotros, y el que manda a otro panel. */
.sindocs{font-size:12.5px;color:var(--text2);line-height:1.55;background:var(--bg1);border:1px dashed var(--border2);
  border-radius:8px;padding:11px 13px;margin-top:8px;}
.sindocs .q{color:var(--text3);font-size:11.5px;display:block;margin-top:4px;}
.decl{font-size:12.5px;line-height:1.55;border-radius:8px;padding:11px 13px;margin-top:8px;}
.decl.nocubre{color:#ffd9a8;background:rgba(255,179,71,.06);border:1px solid rgba(255,179,71,.26);}
.decl.fuera{color:#bcd9ff;background:rgba(74,158,255,.06);border:1px solid rgba(74,158,255,.24);}
.decl.nota{color:var(--text2);background:var(--bg1);border:1px solid var(--border2);}

/* RESUMEN — contar lo que ya está */
.resumen{font-size:12.5px;color:var(--text);line-height:1.5;margin:8px 0 2px;}
.resumen b{font-family:var(--mono);font-size:13px;}
.resumen .rango{font-family:var(--mono);font-size:11px;color:var(--text2);}
.resumen .desglose{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-top:3px;letter-spacing:.03em;}

/* EPISODIO — la pelea por el consejo, que en una lista plana se pierde */
.episodio{background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.28);
  border-left:3px solid var(--purple);border-radius:8px;padding:11px 13px;margin:12px 0 4px;}
.episodio b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--purple);display:block;margin-bottom:5px;}
.episodio .cuenta{font-size:13px;color:var(--text);line-height:1.45;}
.episodio .formas{font-family:var(--mono);font-size:10.5px;color:var(--text2);margin-top:5px;letter-spacing:.03em;}
.episodio .umbral{font-size:11px;color:var(--text3);line-height:1.5;margin-top:7px;}

/* LA LECTURA ESCRITA — lo que la Fase B agrega. Va arriba porque es el
   producto, y con su procedencia a la vista: qué modelo, qué versión de
   prompt. Una narración sin procedencia es una opinión anónima. */
.lectura{border:1px solid var(--border2);border-left:3px solid var(--purple);background:var(--bg1);
  border-radius:10px;padding:16px 16px 12px;margin:18px 0 6px;}
.lectura h3{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--purple);margin-bottom:10px;}
.lectura .parte{margin-bottom:12px;}
.lectura .parte:last-of-type{margin-bottom:6px;}
.lectura .parte b{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);display:block;margin-bottom:3px;}
.lectura .parte p{font-size:13.5px;line-height:1.62;color:var(--text);}
.lectura .parte.rompe-parte{border-top:1px solid var(--border);padding-top:11px;margin-top:14px;}
.lectura .parte.rompe-parte b{color:#ffb0b0;}
/* LA CITA SALE DE LA FRASE, PERO NO DEJA DE ESTAR.
   Nueve accessions dentro de una oración la vuelven ilegible — era la razón
   número uno de que no se leyera como historia. Queda una marca al margen
   del texto, numerada, que enlaza al documento y lo nombra en el hover; el
   accession completo vive en la línea de fuentes de la sección, debajo.
   Sigue siendo verificable a un clic, que es lo que no se negocia. */
.lectura sup.c{font-size:9px;line-height:0;margin-left:1px;}
.lectura sup.c a{font-family:var(--mono);color:var(--purple);text-decoration:none;padding:0 1px;}
.lectura sup.c a:hover{color:var(--green);}
.lectura sup.c + sup.c{margin-left:0;}
.lectura .fuentes{font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.8;
  margin-top:5px;letter-spacing:.02em;}
.lectura .fuentes a{color:var(--text3);text-decoration:none;border-bottom:1px dotted var(--text3);}
.lectura .fuentes a:hover{color:var(--green);border-bottom-color:var(--green);}
.lectura .fuentes b{color:var(--purple);font-weight:400;
  /* display:inline explícito: `.parte b` es block —es el título de la
     sección— y las fuentes viven adentro de `.parte`, así que sin esto cada
     número se iba a su propia línea. */
  display:inline;}
.lectura .proc{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.04em;
  border-top:1px solid var(--border);padding-top:9px;margin-top:12px;line-height:1.6;}
.lectura.falta{border-left-color:var(--text3);}
.lectura.falta h3{color:var(--text3);}
.lectura.retenida{border-left-color:var(--amber);background:rgba(255,179,71,.05);}
.lectura.retenida h3{color:var(--amber);}
/* Se intentó y salió mal. No es lo mismo que no haberlo intentado, y verlos
   iguales borra justo el dato que decide qué hacer: esperar, o ir a mirar. */
.lectura.fallida{border-left-color:var(--red);background:rgba(255,69,69,.05);}
.lectura.fallida h3{color:#ffb0b0;}
.lectura .porque{font-family:var(--mono);font-size:10.5px;color:var(--text3);margin-top:7px;letter-spacing:.03em;}
.lectura .motivo{font-size:12.5px;color:var(--text2);line-height:1.55;}
.lectura .cuales{font-family:var(--mono);font-size:10.5px;color:var(--amber);margin-top:7px;}

/* LOS SIETE FILTROS — no siete cubetas. La misma línea, mirada de siete
   maneras. Una pregunta sin documentos sigue siendo clickeable: ahí es
   donde vive la explicación de por qué no los hay. */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 2px;}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--text2);
  background:var(--bg1);border:1px solid var(--border2);border-radius:16px;padding:6px 11px;
  cursor:pointer;-webkit-user-select:none;user-select:none;line-height:1.3;}
.chip:hover{border-color:var(--text3);color:var(--text);}
.chip.on{color:#000;background:var(--purple);border-color:var(--purple);font-weight:700;}
.chip .n{color:var(--text3);margin-left:5px;}
.chip.on .n{color:rgba(0,0,0,.6);}
.chip.nada{color:var(--text3);}
.chip.nada.on{color:#000;}
.chips-nota{font-size:11.5px;color:var(--text3);line-height:1.5;margin:7px 0 0;}

/* LA LÍNEA DE TIEMPO — un documento, un renglón, una vez.
   El orden cronológico cuenta más que el orden por categoría: lo de marzo
   se entiende junto a lo de abril, no junto a otro 5.02 de hace siete años. */
.linea{margin-top:14px;border-top:1px solid var(--border);}
.linea-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 0 2px;}
.linea-head h2{font-family:var(--mono);font-size:14px;font-weight:700;}
.linea-head .cuantos{font-family:var(--mono);font-size:11px;color:var(--text2);}
.anio{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--text3);
  padding:14px 0 5px;border-bottom:1px solid var(--border);}
.ev{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.ev-d{font-family:var(--mono);font-size:11px;color:var(--text2);min-width:80px;flex:none;padding-top:1px;}
.ev-b{flex:1;min-width:0;}
.ev .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.ev .f{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);}
.ev .cod{font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.04em;}
.ev .cita{font-family:var(--mono);font-size:10px;color:var(--text3);text-decoration:none;
  border-bottom:1px dotted var(--text3);margin-left:auto;}
.ev .cita:hover{color:var(--green);border-bottom-color:var(--green);}
/* La traducción del código: lo que hace legible la fila. */
.ev .glosa{font-size:12.5px;color:var(--text);line-height:1.45;margin-top:3px;}
.ev .glosa .sin{color:var(--text3);font-style:italic;}
/* El sobre, no el evento. El 9.01 sale en 30 de 30 filings y solo dice
   "adjunté un archivo": va al final y en gris, pero NO se borra. */
.ev .sobre{font-size:11px;color:var(--text3);line-height:1.45;margin-top:3px;}
.ev.rota{border-left:2px solid var(--red);padding-left:10px;margin-left:-12px;}
.ev.rota .f{color:#ffb0b0;}
/* Bajo qué preguntas se ve este MISMO papel. Son etiquetas, no copias. */
.qs{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.qs span{font-family:var(--mono);font-size:9px;line-height:1;padding:3px 5px;border-radius:9px;
  border:1px solid var(--border2);color:var(--text3);cursor:pointer;}
.qs span:hover{color:var(--purple);border-color:var(--purple);}
.qs span.on{color:#000;background:var(--purple);border-color:var(--purple);}
.mas{font-family:var(--mono);font-size:10px;color:var(--text2);padding:12px 0;cursor:pointer;
  background:var(--bg1);border:1px solid var(--border2);border-radius:8px;margin-top:10px;text-align:center;}
.mas:hover{border-color:var(--purple);color:var(--text);}

/* SERIE */
.serie{margin-top:12px;}
.fam{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);
  margin:12px 0 4px;padding-top:8px;border-top:1px solid var(--border);}
.pt{display:flex;align-items:baseline;gap:10px;padding:6px 0;flex-wrap:wrap;}
.pt .per{font-family:var(--mono);font-size:11px;color:var(--text2);min-width:84px;}
.pt .val{font-family:var(--mono);font-size:12.5px;font-weight:700;min-width:132px;}
.pt .yoy{font-family:var(--mono);font-size:11px;min-width:64px;}
.pt .yoy.up{color:var(--green);} .pt .yoy.down{color:var(--red);}
.pt .yoy.na{color:var(--text3);}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:10px;}
.tag.rev{color:var(--amber);border:1px solid rgba(255,179,71,.32);}
.tag.der{color:var(--blue);border:1px solid rgba(74,158,255,.3);}
.citas{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.citas a{font-family:var(--mono);font-size:10px;color:var(--text3);text-decoration:none;border-bottom:1px dotted var(--text3);}
.citas a:hover{color:var(--green);border-bottom-color:var(--green);}

/* DÓNDE SE ROMPE */
.rompe{border:1px solid rgba(255,69,69,.26);background:rgba(255,69,69,.04);border-radius:10px;padding:14px;margin-top:26px;}
.rompe h2{font-family:var(--mono);font-size:13px;font-weight:700;color:#ffb0b0;margin-bottom:8px;}
.rompe .por{font-size:12px;color:var(--text2);line-height:1.55;margin-bottom:10px;}
.rompe .por.repetido{font-size:11.5px;color:var(--text3);font-style:italic;margin-bottom:6px;}
.rompe.limpio{border-color:var(--border2);background:var(--bg1);}
.rompe.limpio h2{color:var(--text);}

.estado{background:var(--bg1);border:1px solid var(--border2);border-radius:10px;padding:18px 16px;margin-top:22px;}
.estado h2{font-family:var(--mono);font-size:14px;margin-bottom:8px;}
.estado p{font-size:13px;color:var(--text2);line-height:1.6;}
.estado code{font-family:var(--mono);font-size:11.5px;color:var(--purple);}

footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--text3);line-height:1.8;letter-spacing:.04em;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">QUANT<span>DESK</span></div>
    <div class="controls" style="margin:0">
      <input class="tick" id="tk" placeholder="TICKER" autocomplete="off" spellcheck="false"/>
      <div class="pill" id="lang">EN</div>
    </div>
  </header>

  <div class="hero">
    <h1 id="h1">HISTORIA<span class="accent">.</span></h1>
    <p id="sub"></p>
  </div>

  <div id="app"></div>

  <footer id="foot"></footer>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// HISTORIA — la página. UNA línea de tiempo, siete filtros.
//
// La versión anterior dibujaba siete listas, y el 8-K del 2022-03-29 salía
// en la 1, en la 3 y en la 7 sin decir que era el mismo papel. Siete listas
// tampoco son una historia: el orden cronológico cuenta más que el orden por
// categoría, porque lo que pasó en marzo se entiende junto a lo de abril y
// no junto a otro 5.02 de hace siete años.
//
// Ahora hay una sola línea. Cada documento sale UNA vez con todos sus temas
// y lleva las etiquetas de las preguntas que contesta; las siete preguntas
// son chips que filtran esa línea, y sus paneles traen lo que la pregunta
// agrega —el conteo, lo que no cubrimos, la serie, los episodios— en vez de
// una segunda copia de los documentos.
//
// NO NARRA. No hay IA acá: los documentos se listan, la serie se tabula, y
// nada se interpreta. El lector con prompt congelado es la Fase B.
//
// LAS TRES REGLAS QUE ESTA PÁGINA TIENE QUE SOSTENER:
//
//  1. Ningún número sin su cita visible. La `[accession]` se ve y enlaza al
//     documento; un Q4 derivado muestra SUS DOS citas, porque salió de una
//     resta entre dos filings y enseñar solo el 10-K sería citar la mitad.
//  2. Los tres vacíos se ven distinto. "Sin documentos" (buscamos y no hay)
//     no se parece a "no cubierta" (no miramos esa fuente) ni a "fuera del
//     módulo" (está en otro panel). Un hueco sin etiqueta es indistinguible
//     de un error, y el usuario llena el silencio con lo que le conviene.
//  3. Un YoY nulo NO se dibuja como 0%. Cuando falta el trimestre de
//     comparación el endpoint manda null, y acá se muestra "—" con su
//     motivo. Un cero inventado en una serie de ingresos no se ve nunca.
//  4. El 9.01 se apaga, no se borra. Aparece en casi todos los 8-K y solo
//     dice "adjunté un archivo": va al final y en gris. Esconderlo sería
//     decidir por el lector qué hay en el papel.
//
// El perímetro de lo NO cubierto va ARRIBA, no en el pie: §8 del memo pide
// que se diga donde el usuario está por sacar una conclusión.
// ═══════════════════════════════════════════════════════════════
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let LANG = (localStorage.getItem('historia:lang') === 'en') ? 'en' : 'es';

// El estado de la vista. `FILTRO` null = la línea entera.
const TOPE_INICIAL = 120;
let DATOS = null;
let FILTRO = null;
let TOPE = TOPE_INICIAL;

// Las siete preguntas van en el orden del esqueleto y ese orden es el
// contrato: la pregunta N es la sección N-ésima.
const ID_DE_PREGUNTA = {
  1: 'direccion', 2: 'propiedad', 3: 'prometido_vs_entregado', 4: 'gerencia',
  5: 'competencia', 6: 'mercado', 7: 'catalizador',
};

const T = {
  es: {
    sub: 'Siete preguntas sobre una empresa, contestadas SOLO con documentos de la SEC. Cada dato trae el filing del que salió. Esta página no narra ni recomienda.',
    buscar: 'Escribí un ticker y dale Enter.',
    cargando: 'Buscando…',
    perimetro: 'Lo que este módulo NO cubre',
    emisor: 'CIK', ingesta: 'Última ingesta',
    cobertura_parcial: 'Cobertura parcial',
    ya_en_linea: 'Estos documentos ya están en la línea de arriba. Se repiten acá porque la contraevidencia va al final y no se busca: es el mismo papel, no uno nuevo.',
    sin_docs: 'Sin documentos.',
    sin_docs_q: 'Se buscó en el índice de filings de este emisor y no hay ninguno de este tipo en la ventana. No es que no lo hayamos mirado.',

// EL NÚMERO SE MUESTRA COMPLETO, NO COMPACTO. La primera versión usaba
// `notation:'compact'` y 6.100 millones de dólares salían como "6100 MUSD":
// legible solo si ya sabías qué decía, y a un parpadeo de leerse como 6.100
// dólares. Y en español la escala corta es peor todavía — "B" es billion en
// inglés y billón (10¹²) en español, así que el sufijo que ahorra espacio es
// justo el que cambia el número por mil.
//
// Un dígito de más en pantalla no le cuesta nada a nadie. Un dígito mal leído
// en una serie de ingresos sí, y este módulo existe para que eso no pase.
function monto(v, unit) {
  const n = Number(v);
  if (!Number.isFinite(n)) return '—';
  const loc = LANG === 'en' ? 'en-US' : 'es-MX';
  if (unit === 'USD') {
    return new Intl.NumberFormat(loc, { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
  }
  return new Intl.NumberFormat(loc, { maximumFractionDigits: 2 }).format(n) + (unit && unit !== 'pure' ? ' ' + unit : '');
}
// El hover trae la unidad completa, que en un EPS (USD/shares) es la mitad
// del dato.
const exacto = (v, unit) => {
  const n = Number(v);
  if (!Number.isFinite(n)) return '';
  return new Intl.NumberFormat(LANG === 'en' ? 'en-US' : 'es-MX').format(n) + (unit ? ' ' + unit : '');
};

// Un mes-año legible. La fecha exacta sigue estando en cada fila.
function mesAnio(iso) {
  if (!iso) return '—';
  const d = new Date(`${String(iso).slice(0, 10)}T00:00:00Z`);
  if (Number.isNaN(d.getTime())) return String(iso);
  return new Intl.DateTimeFormat(LANG === 'en' ? 'en-US' : 'es-MX',
    { year: 'numeric', month: 'short', timeZone: 'UTC' }).format(d);
}

// La traducción del código. El `title` lleva el nombre OFICIAL de la SEC —
// una cita textual— y el texto visible lleva nuestra glosa. Un código que no
// está en el diccionario se muestra crudo y se dice que no lo tenemos: un
// diccionario que adivina deja de ser un diccionario.
function glosas(lista) {
  const t = T[LANG];
  const gs = (lista || []).filter(Boolean);
  if (!gs.length) return '';
  return gs.map((g) => (g.glosa
    ? `<span title="${esc(g.oficial || '')}">${esc(g.glosa)}</span>`
    : `<span class="sin" title="${esc(t.sin_glosa)}">${esc(g.codigo)} — ${esc(t.sin_glosa)}</span>`)).join(' · ');
}

// Un renglón de la línea = un documento, con todos sus temas y ninguna copia.
//
// El 9.01 —y el 7.01 cuando acompaña a otro item— bajan a la línea gris de
// "además adjunta". Se apagan, no se borran: esconderlos sería decidir por el
// lector qué hay en el papel, y ya pasó una vez que un 7.01 SOLO fuera el
// único contenido del filing.
function evHTML(e, filtro) {
  const t = T[LANG];
  const destacadas = (e.items_destacados_glosa && e.items_destacados_glosa.length)
    ? e.items_destacados_glosa : [e.forma_glosa].filter(Boolean);
  const cods = (e.items_destacados && e.items_destacados.length) ? e.items_destacados : [];
  return `<div class="ev${e.contraevidencia ? ' rota' : ''}">
    <div class="ev-d">${esc(e.filed)}</div>
    <div class="ev-b">
      <div class="l1">
        <span class="f" title="${esc((e.forma_glosa && e.forma_glosa.oficial) || '')}">${esc(e.form)}</span>
        ${cods.length ? `<span class="cod">${esc(cods.join(' · '))}</span>` : ''}
        <a class="cita" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.cita)}</a>
      </div>
      <div class="glosa">${glosas(destacadas)}</div>
      ${(e.items_secundarios || []).length
        ? `<div class="sobre">${esc(t.sobre)} ${glosas(e.items_secundarios_glosa)} <span>(${esc(e.items_secundarios.join(' · '))})</span></div>`
        : ''}
      ${(e.preguntas || []).length ? `<div class="qs">${e.preguntas.map((q) =>
        `<span class="${q === filtro ? 'on' : ''}" data-q="${q}" title="${esc(t.contesta_q(q))}">${q} · ${esc(CORTOS[LANG][ID_DE_PREGUNTA[q]] || q)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

// "14 filings entre dic 2021 y sep 2026" — aritmética sobre los documentos,
// de la misma clase que derivar un Q4. No dice qué significan.
function resumenHTML(r) {
  const t = T[LANG];
  if (!r || !r.total) return '';
  const cuenta = (o) => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v}× ${k}`).join(' · ');
  // El desglose cuenta TEMAS, no adjuntos. Contar el 9.01 acá daría
  // "9.01: 30" como el tema más frecuente de la empresa: verdad sobre los
  // sobres y mentira sobre lo que pasó. Los adjuntos van en su propia línea.
  const desglose = Object.keys(r.por_item || {}).length ? cuenta(r.por_item) : cuenta(r.por_forma);
  const sobres = cuenta(r.por_item_secundario);
  return `<div class="resumen">
    <b>${esc(t.filings(r.total))}</b>
    <span class="rango">${esc(t.entre)} ${esc(mesAnio(r.desde))} ${esc(t.y)} ${esc(mesAnio(r.hasta))}</span>
    ${r.truncado ? `<span class="rango">· ${esc(t.mostrando(r.mostrados, r.total))}</span>` : ''}
    ${desglose ? `<div class="desglose">${esc(t.temas_de)} ${esc(desglose)}</div>` : ''}
    ${sobres ? `<div class="desglose">${esc(t.sobre)} ${esc(sobres)}</div>` : ''}
  </div>`;
}

// La pelea por el consejo: en una lista plana hay que contar 34 filings a
// mano para darse cuenta de que pasó algo.
function episodiosHTML(eps) {
  const t = T[LANG];
  if (!eps || !eps.length) return '';
  return eps.map((e) => `<div class="episodio">
    <b>${esc(t.episodio)}</b>
    <div class="cuenta">${esc(t.filings(e.total))} ${esc(t.entre)} ${esc(mesAnio(e.desde))} ${esc(t.y)} ${esc(mesAnio(e.hasta))} · ${esc(t.episodio_dias(e.dias))}</div>
    <div class="formas">${esc(Object.entries(e.por_forma).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${v}× ${k}`).join(' · '))}</div>
    <div class="umbral">${esc(t.episodio_umbral(e.umbral_dias))}</div>
  </div>`).join('');
}

function serieHTML(serie) {
  const t = T[LANG];
  if (!serie || !serie.length) return '';
  const porFam = {};
  for (const p of serie) (porFam[p.familia] = porFam[p.familia] || []).push(p);

  return '<div class="serie">' + Object.keys(porFam).map((fam) => {
    const puntos = porFam[fam].map((p) => {
      // Un YoY nulo se dibuja como "—" con su motivo, NUNCA como 0%.
      const y = (p.yoy_pct == null || p.yoy_pct === '')
        ? `<span class="yoy na" title="${esc(t.yoy_na)}">—</span>`
        : `<span class="yoy ${Number(p.yoy_pct) >= 0 ? 'up' : 'down'}">${Number(p.yoy_pct) >= 0 ? '+' : ''}${esc(p.yoy_pct)}%</span>`;
      const citas = [`<a href="${esc(p.url)}" target="_blank" rel="noopener" title="${esc(p.form || '')} ${esc(p.filed || '')}">${esc(p.cita)}</a>`]
        .concat(p.cita_aux ? [`<a href="${esc(p.url_aux)}" target="_blank" rel="noopener" title="${esc(t.der_nota)}">${esc(p.cita_aux)}</a>`] : []);
      return `<div class="pt">
        <span class="per">${esc(p.period_end)}</span>
        <span class="val" title="${esc(exacto(p.val, p.unit))}">${esc(monto(p.val, p.unit))}</span>
        ${y}
        ${p.revisado ? `<span class="tag rev">${esc(t.rev)}</span>` : ''}
        ${p.derived ? `<span class="tag der" title="${esc(t.der_nota)}">${esc(t.der)}</span>` : ''}
        <span class="citas">${citas.join('')}</span>
      </div>`;
    }).join('');
    return `<div class="fam">${esc(FAMILIAS[LANG][fam] || fam)}</div>${puntos}`;
  }).join('') + '</div>';
}

// El panel de una pregunta. NO repite los documentos: esos viven una vez en
// la línea, y copiarlos acá es exactamente lo que hacía que un papel se
// contara tres veces. Lo que sí va es lo que la pregunta agrega — el conteo,
// lo que no cubrimos, la serie (pregunta 3) y los episodios (pregunta 2),
// que no son documentos sueltos sino aritmética sobre ellos.
function panelHTML(s) {
  const t = T[LANG];
  const titulo = TITULOS[LANG][s.id] || s.id;
  const badge = { con_documentos: ['ok', t.badge_ok], sin_documentos: ['vacio', t.badge_vacio],
    no_cubierta: ['nocubre', t.badge_nocubre], fuera_del_modulo: ['fuera', t.badge_fuera] }[s.estado] || ['vacio', s.estado];

  let cuerpo = '';
  if (s.estado === 'con_documentos') {
    cuerpo = resumenHTML(s.resumen) + episodiosHTML(s.episodios) + serieHTML(s.serie);
  } else if (s.estado === 'sin_documentos') {
    // El vacío que habla de LA EMPRESA. Se dice que se buscó.
    cuerpo = `<div class="sindocs">${esc(t.sin_docs)}<span class="q">${esc(t.sin_docs_q)}</span></div>`;
  }

  const decls = (s.declaraciones || []).map((d) => {
    const clase = s.estado === 'no_cubierta' ? 'nocubre' : s.estado === 'fuera_del_modulo' ? 'fuera' : 'nota';
    return `<div class="decl ${clase}">${esc(d.texto)}</div>`;
  }).join('');

  return `<section class="sec" data-sec="${esc(s.id)}">
    <div class="sec-head">
      <span class="sec-num">${esc(s.pregunta)}</span>
      <h2>${esc(titulo)}</h2>
      <span class="badge ${badge[0]}">${esc(badge[1])}</span>
    </div>
    ${cuerpo}${decls}
  </section>`;
}

// LA LECTURA ESCRITA. Tres salidas, y las tres se ven distinto:
//
//   · `ok`            — se muestra, con su procedencia.
//   · `sin_narracion` — se declara, igual que "sin documentos". La narración
//                       se genera aparte y se guarda; no se escribe cada vez
//                       que alguien abre la página, porque eso sería una
//                       llamada pagada por visita.
//   · `retenida`      — existe pero una cita no resuelve a un documento de
//                       esta página, así que NO se muestra ninguna sección.
//                       Todo-o-nada es tosco a propósito: un texto con una
//                       cita que no abre parece riguroso y no lo es.
function lecturaHTML(d) {
  const t = T[LANG];
  const n = d.narracion;
  if (!n) return '';

  // TRES maneras de no mostrar una lectura, y las tres se ven distinto. Es la
  // misma doctrina de `sin_documentos` / `no_cubierta` / `fuera_del_modulo`
  // aplicada a la narración: verlas iguales —las tres como un hueco— borra
  // justo el dato que decide qué hacer.
  //
  //   · falta     — todavía no se escribió. Se espera a que corra el job.
  //   · fallida   — se escribió y salió mal. Se va a mirar qué pasó.
  //   · retenida  — se escribió bien pero una cita no resuelve acá. Es un
  //                 problema nuestro, no del modelo.
  if (n.estado !== 'ok') {
    const mapa = {
      retenida: ['retenida', t.lectura_retenida],
      fallida: ['fallida', t.lectura_fallida],
    };
    const [clase, titulo] = mapa[n.estado] || ['falta', t.lectura_falta];
    return `<div class="lectura ${clase}">
      <h3>${esc(titulo)}</h3>
      ${(n.declaraciones || []).map((x) => `<p class="motivo">${esc(x.texto)}</p>`).join('')}
      ${(n.citas_desconocidas || []).length
        ? `<div class="cuales">${esc(t.citas_malas)} ${esc(n.citas_desconocidas.join(' · '))}</div>` : ''}
      ${n.estado === 'fallida' && n.motivo
        ? `<div class="porque">${esc(t.motivo[n.motivo] || n.motivo)}${n.intentos ? ' · ' + esc(t.intentos(n.intentos)) : ''}</div>` : ''}
    </div>`;
  }

  // El índice de lo citable sale de lo que ESTA página ya tiene. Una cita que
  // no está acá no se enlaza — y el servidor ya retuvo la narración entera en
  // ese caso, así que llegar acá con una desconocida no debería pasar.
  const meta = new Map();
  for (const e of ((d.linea_de_tiempo || {}).eventos || [])) {
    meta.set(e.accession, { url: e.url, form: e.form, fecha: e.filed });
  }
  for (const s of (d.secciones || [])) {
    for (const p of (s.serie || [])) {
      if (p.accession && !meta.has(p.accession)) meta.set(p.accession, { url: p.url, form: p.form, fecha: p.filed });
      if (p.accession_aux && !meta.has(p.accession_aux)) meta.set(p.accession_aux, { url: p.url_aux, form: null, fecha: null });
    }
  }

  // La numeración es de la lectura ENTERA, no por sección: el mismo documento
  // lleva el mismo número aunque lo citen dos secciones distintas. Verlo
  // repetido con dos números haría parecer que son dos papeles.
  const numero = new Map();
  const asignar = (a) => {
    if (!numero.has(a)) numero.set(a, numero.size + 1);
    return numero.get(a);
  };

  // Se escapa PRIMERO y se marca después, sobre el texto ya escapado: al
  // revés, el href entraría al escape y el enlace quedaría roto.
  const conCitas = (texto) => {
    const usadas = [];
    const html = esc(texto).replace(/\[([A-Za-z0-9][A-Za-z0-9.\-]{2,})\]/g, (m, a) => {
      const info = meta.get(a);
      if (!info) return m;                       // desconocida: se deja cruda
      const num = asignar(a);
      if (!usadas.includes(a)) usadas.push(a);
      const rotulo = [info.form, info.fecha, `[${a}]`].filter(Boolean).join(' · ');
      return `<sup class="c"><a href="${esc(info.url)}" target="_blank" rel="noopener" title="${esc(rotulo)}">${num}</a></sup>`;
    });
    return { html, usadas };
  };

  const titulo = (id) => (id === 'donde_se_rompe' ? t.rompe : (TITULOS[LANG][id] || id));

  // El accession completo no desaparece: baja a la línea de fuentes de su
  // sección. La marca dice DÓNDE aplica; la línea dice QUÉ es.
  const fuentesHTML = (usadas) => (usadas.length
    ? `<div class="fuentes">${esc(t.fuentes)} ${usadas.map((a) => {
      const info = meta.get(a);
      const rotulo = [info.form, info.fecha].filter(Boolean).join(' ');
      return `<b>${numero.get(a)}</b> <a href="${esc(info.url)}" target="_blank" rel="noopener">[${esc(a)}]</a>${rotulo ? ' ' + esc(rotulo) : ''}`;
    }).join(' · ')}</div>`
    : '');

  const partes = (n.secciones || []).map((s) => {
    const { html, usadas } = conCitas(s.texto);
    return `<div class="parte${s.id === 'donde_se_rompe' ? ' rompe-parte' : ''}">
      <b>${esc(titulo(s.id))}</b>
      <p>${html}</p>
      ${fuentesHTML(usadas)}
    </div>`;
  }).join('');

  return `<div class="lectura">
    <h3>${esc(t.lectura)}</h3>
    ${partes}
    <div class="proc">${esc(t.proc(n.modelo || '', n.prompt_version || '', String(n.creado_en || '').slice(0, 10)))}</div>
  </div>`;
}

// Los chips. Una pregunta sin documentos NO se apaga ni se esconde: se puede
// elegir igual, y ahí es donde vive la explicación de por qué no los hay. Es
// la diferencia entre "no hay 13D" y "no miramos 13D", que es toda.
function chipsHTML(d, filtro) {
  const t = T[LANG];
  const total = (d.linea_de_tiempo || {}).total || 0;
  const uno = (id, etiqueta, q, n, hay) =>
    `<div class="chip${q === filtro ? ' on' : ''}${hay ? '' : ' nada'}" data-q="${q == null ? '' : q}">${esc(etiqueta)}<span class="n">${esc(n)}</span></div>`;
  return `<div class="chips">
    ${uno('todo', t.todo, null, total, true)}
    ${(d.secciones || []).map((s) => uno(s.id, `${s.pregunta} · ${CORTOS[LANG][s.id] || s.id}`,
      s.pregunta, (s.accessions || []).length || '—', (s.accessions || []).length > 0)).join('')}
  </div>
  <p class="chips-nota">${esc(t.filtro_nota)}</p>`;
}

// La línea. Un renglón por documento, del más nuevo al más viejo, agrupados
// por año para que la distancia entre dos cosas se vea sin restar fechas.
function lineaHTML(d, filtro, tope) {
  const t = T[LANG];
  const L = d.linea_de_tiempo || { eventos: [] };
  const sel = (d.secciones || []).find((x) => x.pregunta === filtro);
  const todos = L.eventos || [];
  const eventos = filtro == null ? todos : todos.filter((e) => (e.preguntas || []).includes(filtro));
  const visibles = eventos.slice(0, tope);

  let filas = '';
  let anio = null;
  for (const e of visibles) {
    const a = String(e.filed || '').slice(0, 4);
    if (a !== anio) { anio = a; filas += `<div class="anio">${esc(a)}</div>`; }
    filas += evHTML(e, filtro);
  }

  const cabeza = `<div class="linea-head"><h2>${esc(t.linea)}</h2>
    <span class="cuantos">${esc(t.filings(eventos.length))}${eventos.length > visibles.length ? ` · ${esc(t.mostrando(visibles.length, eventos.length))}` : ''}</span></div>`;

  const decls = (L.declaraciones || []).map((x) => `<div class="decl nota">${esc(x.texto)}</div>`).join('');

  if (!eventos.length) {
    // La trampa del filtro vacío: las preguntas 4, 5 y 6 no tienen documentos
    // porque NO MIRAMOS esa fuente, no porque buscáramos y no hubiera. Poner
    // acá el texto de "se buscó en el índice y no hay" sería decir sobre la
    // empresa algo que en realidad es sobre nosotros — el error exacto que
    // este módulo existe para no cometer.
    const noMirado = sel && (sel.estado === 'no_cubierta' || sel.estado === 'fuera_del_modulo');
    return `<div class="linea">${cabeza}
      <div class="sindocs">${noMirado
        ? esc(t.vacio_nocubre)
        : esc(filtro == null ? t.sin_docs : t.vacio_filtro) + `<span class="q">${esc(t.sin_docs_q)}</span>`}</div>
      ${decls}</div>`;
  }
  return `<div class="linea">${cabeza}${filas}
    ${eventos.length > visibles.length ? `<div class="mas" id="mas">${esc(t.mas(eventos.length - visibles.length))}</div>` : ''}
    ${decls}</div>`;
}

function render(d) {
  const t = T[LANG];
  DATOS = d;
  $('sub').textContent = t.sub;
  $('lang').textContent = LANG === 'es' ? 'EN' : 'ES';
  $('foot').innerHTML = esc(t.fuente) + '<br/>' + esc(t.nodata);

  if (!d) { $('app').innerHTML = `<div class="estado"><p>${esc(t.buscar)}</p></div>`; return; }

  if (d.estado === 'desconocido' || d.estado === 'sin_ingesta') {
    // No es un error ni un 404. "Todavía no la bajamos" y "esta empresa no
    // tiene historia" son cosas distintas y la página no las confunde.
    const titulo = d.estado === 'desconocido' ? t.desconocido : t.sin_ingesta;
    const nota = d.estado === 'desconocido' ? t.desconocido_q : t.sin_ingesta_q;
    $('app').innerHTML = `<div class="estado"><h2>${esc(d.ticker)}</h2><p>${esc(titulo)}<br/><br/>${esc(nota)}</p></div>`;
    return;
  }
  if (d.estado !== 'ok') {
    $('app').innerHTML = `<div class="estado"><h2>${esc(t.error)}</h2><p>${esc(d.error || d.detalle || '')}</p></div>`;
    return;
  }

  const e = d.emisor || {};
  const cab = `<div class="emisor"><b>${esc(e.nombre || d.ticker)}</b><br/>
    <span class="cik">${esc(t.emisor)} ${esc(e.cik)} · ${esc(e.forma_anual || '')} · ${esc(t.ingesta)}: ${esc(String(e.ultima_ingesta || '').slice(0, 10))}</span></div>`;

  // La cobertura parcial va arriba y en ámbar: es lo que cambia cómo se lee
  // TODO lo de abajo, así que llega antes y no como nota al pie.
  const parcial = e.cobertura === 'parcial'
    ? `<div class="cobertura"><b>${esc(t.cobertura_parcial)}</b><p>${esc((d.no_cubierto.find((x) => x.codigo === 'cobertura_parcial') || {}).texto || '')}</p></div>`
    : '';

  const perim = `<div class="perimetro"><h3>${esc(t.perimetro)}</h3><ul>${
    (d.no_cubierto || []).filter((x) => x.codigo !== 'cobertura_parcial').map((x) => `<li>${esc(x.texto)}</li>`).join('')
  }</ul></div>`;

  // Cuando hay un filtro puesto, el panel de esa pregunta va ARRIBA: es el
  // encabezado de la lista filtrada, no una nota al pie. Sin filtro, los
  // siete van abajo y la línea manda, que es el punto de la línea.
  const paneles = (d.secciones || []).filter((x) => FILTRO == null || x.pregunta === FILTRO)
    .map(panelHTML).join('');
  const linea = lineaHTML(d, FILTRO, TOPE);

  // La contraevidencia apunta a la línea por accession. El papel no se copia:
  // se resuelve contra la misma lista que ya está en pantalla.
  const c = d.contraevidencia || {};
  const limpio = c.estado !== 'con_documentos';
  const porAcc = new Map(((d.linea_de_tiempo || {}).eventos || []).map((e) => [e.accession, e]));
  const rompe = `<div class="rompe${limpio ? ' limpio' : ''}">
    <h2>${esc(t.rompe)}</h2>
    <p class="por">${esc(t.rompe_por)}</p>
    ${(c.accessions || []).length ? `<p class="por repetido">${esc(t.ya_en_linea)}</p>` : ''}
    ${(c.accessions || []).map((a) => (porAcc.has(a) ? evHTML(porAcc.get(a), FILTRO) : '')).join('')}
    ${(c.periodos_reexpresados || []).length ? `<div class="fam">${esc(t.reexpresado)}</div>` +
      c.periodos_reexpresados.map((p) => `<div class="pt"><span class="per">${esc(p.period_end)}</span>
        <span class="val">${esc(FAMILIAS[LANG][p.familia] || p.familia)}</span>
        <span class="citas"><a href="${esc(p.url || '#')}" target="_blank" rel="noopener">${esc(p.cita)}</a></span></div>`).join('') : ''}
    ${(c.declaraciones || []).map((x) => `<div class="decl nota">${esc(x.texto)}</div>`).join('')}
  </div>`;

  $('app').innerHTML = cab + parcial + perim + lecturaHTML(d) + chipsHTML(d, FILTRO)
    + (FILTRO == null ? linea + paneles : paneles + linea) + rompe;
}

// El filtro y el tope viven acá y no en el DOM: volver a pintar es barato y
// tener el estado en dos lugares es cómo empiezan a decir cosas distintas.
function filtrar(q) {
  FILTRO = q;
  TOPE = TOPE_INICIAL;
  render(DATOS);
  const chips = document.querySelector('.chips');
  if (chips) chips.scrollIntoView({ block: 'start', behavior: 'smooth' });
}

// Un solo listener en el contenedor: los chips y las etiquetas de cada
// renglón se repintan en cada render, y colgarles un handler a cada uno
// dejaría listeners viejos apuntando a nodos que ya no existen.
$('app').addEventListener('click', (ev) => {
  const chip = ev.target.closest('.chip');
  if (chip) return filtrar(chip.dataset.q ? Number(chip.dataset.q) : null);
  // Desde un renglón: la etiqueta de una pregunta lleva al mismo filtro. Es
  // la manera de ver "¿qué más contesta esta pregunta?" sin volver arriba.
  const et = ev.target.closest('.qs span');
  if (et) return filtrar(Number(et.dataset.q) === FILTRO ? null : Number(et.dataset.q));
  if (ev.target.closest('#mas')) { TOPE += TOPE_INICIAL; render(DATOS); }
});

async function cargar(ticker) {
  const t = T[LANG];
  $('app').innerHTML = `<div class="estado"><p>${esc(t.cargando)}</p></div>`;
  // Otra empresa, otra línea: el filtro de la anterior no se arrastra.
  FILTRO = null;
  TOPE = TOPE_INICIAL;
  try {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 20000);
    const r = await fetch(`/api/historia?ticker=${encodeURIComponent(ticker)}&lang=${LANG}`, { signal: ctl.signal });
    clearTimeout(to);
    render(await r.json());
  } catch (err) {
    render({ estado: 'error', error: String(err && err.message ? err.message : err) });
  }
}

function tickerDeLaURL() {
  const m = /^\/historia\/([A-Za-z0-9.\-]+)/.exec(location.pathname);
  if (m) return m[1].toUpperCase();
  const q = new URLSearchParams(location.search).get('ticker');
  return q ? q.toUpperCase() : '';
}

let TICKER = tickerDeLaURL();
$('tk').value = TICKER;
$('tk').addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter') return;
  TICKER = $('tk').value.trim().toUpperCase();
  if (!TICKER) return;
  history.replaceState(null, '', `/historia/${encodeURIComponent(TICKER)}`);
  cargar(TICKER);
});
$('lang').addEventListener('click', () => {
  LANG = LANG === 'es' ? 'en' : 'es';
  localStorage.setItem('historia:lang', LANG);
  document.documentElement.lang = LANG;
  // Se vuelve a pedir en vez de traducir acá: las declaraciones de §8 viven
  // en el servidor y tener dos copias del mismo texto es cómo empiezan a
  // decir cosas distintas.
  if (TICKER) cargar(TICKER); else render(null);
});

document.documentElement.lang = LANG;
if (TICKER) cargar(TICKER); else render(null);
</script>
</body>
</html>
